services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pancasila-index-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=pancasila-index-dev-secret-replace-in-production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/index || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
