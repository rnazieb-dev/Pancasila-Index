name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versi pnpm TIDAK diisi di sini. Sengaja: action ini membaca
      # package.json#packageManager sebagai satu-satunya sumber otoritatif.
      # Mengisi `version` di sini membuat ada dua deklarasi dan action gagal
      # dengan "Multiple versions of pnpm specified".
      #
      # Jangan pula membalik arahnya dengan menghapus `packageManager` dari
      # package.json: pnpm-workspace.yaml memakai `allowBuilds` (field era
      # pnpm 11) untuk menyetujui build script @prisma/client, prisma, esbuild,
      # dan sharp. Kalau versinya jatuh ke pnpm lama, keempatnya tidak jalan
      # dan kegagalannya muncul sebagai error TypeScript, bukan error install.
      - uses: pnpm/action-setup@v4

      # Node 24 adalah Active LTS (dukungan sampai 30 April 2028). Node 22
      # sudah masuk Maintenance LTS dan berakhir 30 April 2027.
      #
      # Catatan: ini versi Node yang menjalankan PROYEK. Peringatan "Node 20 is
      # being deprecated" di log run berasal dari runtime yang dipakai GitHub
      # untuk mengeksekusi action-nya sendiri (actions/checkout, pnpm/action-setup)
      # dan tidak terpengaruh oleh nilai di bawah ini - itu hanya hilang bila
      # major action-nya dinaikkan.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Wajib sebelum typecheck: tipe @prisma/client dihasilkan dari schema,
      # dan postinstall di root repo tidak menemukan schema (schema-nya milik
      # apps/web). Tanpa langkah ini, `tsc --noEmit` di apps/web gagal pada
      # route kurasi/ karena hasil query Prisma bertipe implicit any.
      - name: Generate Prisma Client
        run: pnpm --filter @pancasila-index/web db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm build

  # Pemindai kerentanan dependensi. Tidak memblokir MR: hanya lapor
  # kerentanan yang diketahui, agar tim bisa menentukan prioritas.
  # `pnpm audit` adalah perintah resmi pnpm yang membaca pnpm-lock.yaml
  # dan mencocokkannya dengan database advisori (npm advisory + pnpm).
  # Untuk audit yang lebih dalam (transitive), ganti ke `osv-scanner`.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        # --audit-level=high hanya gagal pada kerentanan high/critical.
        # moderate/low dicatat tapi tidak menggagalkan build.
        run: pnpm audit --audit-level=high || true
        # `|| true` disengaja: ini sinyal, bukan gerbang. Ganti ke fail-on-high
        # bila siap menunda rilis demi kerentanan moderate.

  # Pemindai rahasia yang dikomit. gitleaks memindai pola umum (AWS keys,
  # GitHub PAT, dsb.). Wajib sejak SECURITY.md menyatakan "kebocoran token
  # pada riwayat git" sebagai lingkup kerentanan.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
