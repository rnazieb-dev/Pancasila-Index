      normative_anchors:
        - uud-nri-1945
      event_ids:
        - ev-dpd-pelantikan-2004
      antithesis_id: Usulan pengelolaan wilayah pesisir diajukan tetapi pembahasannya diambil alih DPR sehingga rumusan akhirnya tidak sepenuhnya mencerminkan kepentingan daerah yang mengusulkannya.
      synthesis_id: Skor Baik (+1) karena pengelolaan sumber daya pesisir diangkat sebagai agenda legislasi nasional atas inisiatif wakil daerah.
    - dimension_id: tujuan-3
      score: 1
      confidence: 0.75
      rationale_id: Menjalankan fungsi pengawasan atas pelaksanaan undang-undang yang menyangkut daerah sejak sidang perdana 2004, termasuk penyelenggaraan pendidikan yang menjadi kewenangan pemerintah daerah pasca-desentralisasi.
      evidence:
        - source_id: uu-22-2003
        - source_id: risalah-dpd-ruu-pesisir-2006
        - source_id: putusan-mk-005-puu-v-2007
      normative_anchors:
        - uud-nri-1945
      event_ids:
        - ev-dpd-pelantikan-2004
      antithesis_id: Fungsi pengawasan dijalankan tanpa kewenangan menindaklanjuti temuan, sehingga hasil pengawasan hanya dapat disampaikan kepada DPR yang tidak berkewajiban membahasnya.
      synthesis_id: Skor Baik (+1) karena pelaksanaan undang-undang di daerah mulai diawasi oleh lembaga yang anggotanya berasal dari daerah itu sendiri.
    - dimension_id: tujuan-4
