      rationale_id: Aspirasi daerah terserap namun nol output legislatif yang berhasil disahkan menjadi UU nasional — soft bicameralism menjadikan DPD parlemen tanpa daya legislasi nyata.
      evidence:
        - source_id: uu-22-2003
