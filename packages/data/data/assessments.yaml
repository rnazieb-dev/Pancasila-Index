      antithesis_id: RUU inisiatif pengelolaan wilayah pesisir yang diajukan DPD pada 2005 tetap memengaruhi substansi undang-undang yang kemudian disahkan DPR, sehingga pengaruhnya ada meski tidak tercatat sebagai produk sendiri.
      synthesis_id: Skor Netral (0) karena aspirasi daerah terserap dan disalurkan, tepat sebanding dengan nol undang-undang yang berhasil disahkan atas inisiatif DPD sepanjang periode pertamanya.
    - dimension_id: kedaulatan-rakyat
      score: 0
      confidence: 0.85
      rationale_id: Terkendala wewenang terbatas (soft bicameralism) dalam proses pembentukan UU sehingga aspirasi daerah belum sepenuhnya tertampung.
      evidence:
        - source_id: uu-22-2003
        - source_id: putusan-mk-005-puu-v-2007
      normative_anchors:
        - uud-nri-1945
      event_ids:
        - ev-dpd-pelantikan-2004
      antithesis_id: Meski kewenangannya terbatas, DPD menempuh jalur uji materi ke Mahkamah Konstitusi pada 2006 untuk memperjuangkan kewenangan legislasinya - memilih koreksi konstitusional alih-alih menerima keterbatasan.
      synthesis_id: Skor Netral (0) karena anggota DPD dipilih langsung dengan suara terbanyak di setiap provinsi, tetapi mandat sebesar itu tidak dapat diterjemahkan menjadi keputusan karena kewenangannya dibatasi konstitusi.
    - dimension_id: sila-1
      score: 1
      confidence: 0.7
      rationale_id: Mengawasi akses perbankan bagi pelaku usaha daerah pada 2008 sebagai wujud keberpihakan pada kesejahteraan warga di wilayah yang jauh dari pusat, menjalankan amanah perwakilan daerah pada periode pertamanya.
      evidence:
        - source_id: uu-22-2003
        - source_id: risalah-dpd-ruu-pesisir-2006
        - source_id: putusan-mk-005-puu-v-2007
      normative_anchors:
        - uud-nri-1945
      event_ids:
        - ev-dpd-pengawasan-kur-2008
      antithesis_id: Pengawasan atas akses perbankan daerah menghasilkan rekomendasi tanpa daya ikat, sehingga hasilnya bergantung sepenuhnya pada kesediaan pemerintah dan otoritas perbankan menindaklanjutinya.
      synthesis_id: Skor Baik (+1) karena persoalan akses keuangan pelaku usaha daerah diangkat ke tingkat nasional oleh lembaga yang khusus mewakili daerah.
    - dimension_id: sila-2
      score: 1
      confidence: 0.7
      rationale_id: Mengajukan RUU inisiatif perdana pada 2006 sebagai lembaga yang baru berdiri dua tahun, menegaskan hak konstitusional daerah untuk mengusulkan norma yang menyangkut kepentingan warganya sendiri.
      evidence:
        - source_id: uu-22-2003
        - source_id: risalah-dpd-ruu-pesisir-2006
        - source_id: putusan-mk-005-puu-v-2007
      normative_anchors:
        - uud-nri-1945
      event_ids:
        - ev-dpd-ruu-pesisir-2006
      antithesis_id: RUU inisiatif perdana diajukan tetapi tidak pernah dibahas DPR, sehingga hak mengusulkan yang dijamin konstitusi berhenti sebagai hak menyerahkan dokumen tanpa kewajiban pihak lain menanggapinya.
      synthesis_id: Skor Baik (+1) karena hak inisiatif legislasi daerah digunakan sejak periode pertama, menetapkan preseden bahwa daerah berhak mengusulkan norma nasional.
    - dimension_id: sila-4
      score: 1
      confidence: 0.8
      rationale_id: Memperoleh penguatan kedudukan lewat Putusan MK No. 005/PUU-V/2007 pada 2008, putusan yang menegaskan DPD sebagai lembaga negara dengan kewenangan konstitusional yang tidak boleh dipersempit undang-undang.
      evidence:
        - source_id: uu-22-2003
        - source_id: risalah-dpd-ruu-pesisir-2006
        - source_id: putusan-mk-005-puu-v-2007
      normative_anchors:
        - uud-nri-1945
      event_ids:
        - ev-dpd-uji-materi-prolegnas-2008
      antithesis_id: Penguatan lewat putusan MK menegaskan kedudukan formal DPD, tetapi tidak mengubah struktur soft bicameralism dalam UUD 1945 yang menempatkan DPD tanpa hak memutus dalam pembentukan undang-undang.
      synthesis_id: Skor Baik (+1) karena kedudukan DPD sebagai lembaga negara dengan kewenangan konstitusional ditegaskan pengadilan, melindunginya dari pemangkasan lewat undang-undang biasa.
    - dimension_id: sila-5
      score: 1
      confidence: 0.8
      rationale_id: Mengajukan gugatan uji materiil ke Mahkamah Konstitusi pada 2006 untuk memperjuangkan kewenangan legislasi daerah, menempuh jalur konstitusional demi keadilan kedudukan antara pusat dan daerah.
      evidence:
        - source_id: risalah-dpd-ruu-pesisir-2006
        - source_id: uu-20-2008
        - source_id: uu-27-2007
      normative_anchors:
        - uud-nri-1945
      event_ids:
        - ev-dpd-uji-materi-susduk-2006
      antithesis_id: Jalur uji materi ditempuh karena kanal politik tertutup, tetapi hasilnya tidak dapat mengubah rumusan konstitusi itu sendiri sehingga ketimpangan kedudukan yang menjadi akar persoalan tetap berdiri.
      synthesis_id: Skor Baik (+1) karena ketimpangan kewenangan antara wakil daerah dan wakil partai diperjuangkan lewat pengadilan konstitusi alih-alih dibiarkan sebagai keadaan yang diterima.
    - dimension_id: tujuan-1
      score: 1
      confidence: 0.75
      rationale_id: Menyelenggarakan sidang perdana pada Oktober 2004 sebagai kamar kedua parlemen hasil Pemilu 2004, membawa kepentingan seluruh provinsi termasuk wilayah perbatasan ke dalam pengambilan keputusan nasional.
      evidence:
        - source_id: uu-22-2003
        - source_id: risalah-dpd-ruu-pesisir-2006
        - source_id: putusan-mk-005-puu-v-2007
      normative_anchors:
        - uud-nri-1945
      event_ids:
        - ev-dpd-pelantikan-2004
      antithesis_id: Kehadiran wakil dari seluruh provinsi menjamin keterwakilan geografis, tetapi tanpa kewenangan memutus keterwakilan itu tidak berpengaruh pada alokasi anggaran maupun kebijakan yang menyangkut wilayah perbatasan.
      synthesis_id: Skor Baik (+1) karena seluruh provinsi termasuk wilayah terluar memperoleh wakil dengan jumlah setara di parlemen nasional untuk pertama kalinya sejak kemerdekaan.
    - dimension_id: tujuan-2
      score: 1
      confidence: 0.75
      rationale_id: Mengajukan RUU inisiatif tentang pengelolaan wilayah pesisir dan pulau-pulau kecil pada 2005, mendorong pemanfaatan sumber daya maritim daerah sebagai basis kesejahteraan warga pesisir.
      evidence:
