# Entitas orang kanonik (aktor ketatanegaraan).
#
# Dua asal isi berkas ini:
#
# 1. BLOK TURUNAN - pimpinan 8 organ konstitusional, diturunkan otomatis dari
#    terms-*.yaml. Satu orang = satu entri, meski menjabat di beberapa periode
#    atau beberapa lembaga (mis. Megawati: Wapres lalu Presiden). Setiap entri
#    ditautkan balik lewat `actor_id` pada terms-*.yaml.
#
# 2. BLOK MANUAL - pejabat di luar pimpinan 8 organ (menteri, hakim non-ketua,
#    pejabat eselon, pimpinan lembaga lain) yang menjadi subjek peristiwa
#    berbukti. Mereka TIDAK punya `term_id` karena bukan unit penilaian rubrik:
#    indeks tetap dihitung per masa jabatan lembaga, bukan per kepala.
#
# ATURAN KERAS: sebuah nama hanya boleh masuk blok manual bila sudah ada
# dokumen yang mendukungnya di sources.yaml. Tidak ada nama dari ingatan.
# Perkara hukumnya dicatat terpisah di actor-cases.yaml, lengkap dengan status
# hukum eksplisit - "disebut di berita" tidak sama dengan "sudah bersalah".

# ------------------------------------------------------- 1. BLOK TURUNAN

