  term_id: dpr-2024-2029
  date: 2025-03
  category: produk-hukum
  title_id: Revisi UU MD3 disahkan di tengah protes
  summary_id: "20 Maret 2025, DPR mengesahkan revisi MD3 yang memperbesar hak anggota: tunjangan rumah dinas Rp50 juta/bulan, perluasan fasilitas, dan mekanisme internal yang lebih tertutup. Disahkan sambil mahasiswa dan warga berdemo di gerbang parlemen menolaknya. Presiden awalnya menandatanganinya, lalu dinamika publik Agustus memaksa pencabutan tunjangan kontroversial itu oleh pimpinan DPR sendiri."
