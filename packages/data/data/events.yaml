- id: ev-sby1-kur
  term_id: presiden-sby-i
  date: 2007-03
  category: kebijakan
  title_id: Kredit Usaha Rakyat (KUR) diluncurkan nasional
  summary_id: "Maret 2007, KUR menembakkan kredit subsidi ke UMKM dengan bunga
    tetap rendah dan tanpa agunan untuk plafon tertentu - triliunan rupiah
    pertama dialirkan pada tahun pertamanya. Program ini menjadi instrumen
    favorit setiap pemerintah sesudahnya; kritiknya juga turun temurun:
    penyaluran sering tertukar dengan patronase politik dan banyak penerima tak
    pernah naik kelas."
  source_ids:
    - literatur-sejarah-nasional
  dimension_ids:
    - sila-5
    - tujuan-2
- id: ev-sby1-gempa-yogya
  term_id: presiden-sby-i
  date: 2006-05
  category: krisis
  title_id: Gempa Yogyakarta dan Jawa Tengah
  summary_id: 27 Mei 2006, gempa M5,9 meratakan ribuan rumah di Yogyakarta-Klaten;
    sekitar 5.800 orang tewas. Respons darurat berjalan cepat dengan bantuan
    komunitas terbesar dalam sejarah bencana Indonesia saat itu, namun
    rekonstruksi via dana swadaya masyarakat justru lebih cepat dan lebih
    akuntabel daripada kanal negara - pelajaran tata kelola yang kelak diulang
    di Palu.
  source_ids:
    - literatur-sejarah-nasional
  dimension_ids:
    - tujuan-1
- id: ev-dpr04-pilkada-langsung
  term_id: dpr-2004-2009
  date: 2004-09
  category: produk-hukum
  title_id: UU Pemerintahan Daerah - era pilkada langsung dimulai
  summary_id: "UU No. 32/2004 mengoperasionalkan amandemen konstitusi:
    gubernur-bupati-wali kota dipilih langsung rakyat mulai 2005, mengakhiri era
    DPRD menunjuk kepala daerah. Legitimasi lokal berubah total; harga-harganya
    juga muncul - politik uang pilkada dan dinasti daerah yang kini jadi musuh
    abadi reformasi elektoral."
  source_ids:
    - uu-32-2004
  dimension_ids:
    - sila-4
    - kedaulatan-rakyat

- id: ev-prabowo-kabinet-merah-putih
  term_id: presiden-prabowo
  date: 2024-10
  category: pengangkatan
  title_id: Kabinet Merah Putih dilantik - terbesar sejak Orde Baru
  summary_id: 21 Oktober 2024, Prabowo melantik kabinet dengan puluhan menteri dan
    pejabat setingkat - total melebihi seratus jabatan, terbesar sejak Orde
    Baru, termasuk wamen usia 20-an dan koalisi hampir seluruh partai. Efisiensi
    birokrasi dipertanyakan ekonomi; presiden membela sebagai mesin kerja cepat.
    Ukuran sebenarnya akan diukur oleh kinerja, bukan jumlah kursi.
  source_ids:
    - berita-kabinet-merah-putih-2024
  dimension_ids:
    - checks-balances
- id: ev-prabowo-oecd
  term_id: presiden-prabowo
  date: 2024-09
  category: kebijakan
  title_id: Indonesia memulai proses aksesi OECD
  summary_id: "September 2024, Indonesia resmi menyampaikan permohonan aksesi ke
    OECD - klub negara industri demokrasi pasar - beberapa bulan sebelum masuk
    BRICS. Dua arah sekaligus: berkembar ganda atau diversifikasi cerdas,
    tergantung siapa yang ditanya. Yang pasti, standar tata kelola, antikorupsi,
    dan data OECD kini menjadi alat ukur eksternal bagi reformasi di rumah."
  source_ids:
    - berita-oecd-indonesia-2024
  dimension_ids:
    - tujuan-4
