  term_id: presiden-soekarno-ii
  date: 1962-08
  category: kebijakan
  title_id: New York Agreement dan pengembalian Irian Barat
  summary_id: 'Trikora dan diplomasi keras memaksa Belanda menandatangani New York Agreement (Agustus 1962): Irian Barat lewat administrasi PBB masuk ke Indonesia pada 1963 - penepian kedaulatan paling emosional bagi revolusi. Catatan gelapnya menetap: janji penentuan nasib sendiri bagi orang Papua baru "dilaksanakan" lewat Pepera 1969 dengan seribu tangan terpilih, proses yang dipersoalkan dunia hingga kini.'
