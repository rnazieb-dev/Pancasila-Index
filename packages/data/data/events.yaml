  term_id: mk-2008-2013
  date: 2013-10
  category: krisis
  title_id: Ketua MK Akil Mochtar ditangkap kasus suap
  summary_id: "2 Oktober 2013, KPK menangkap tangan Ketua MK saat menerima uang
    suap sengketa pilkada - pekerjaan sampingannya selama memimpin lembaga
    tertinggi kehormatan negara. Vonis seumur hidup. Kepercayaan publik pada MK
    jatuh ke titik terendah; jam malam pilkada dikeluarkan darurat; reformasi
    tata kelola etik dimulai dari puing-puing skandal ini. Pelajaran abadi:
    integritas lembaga hanya setinggi integritas manusianya."
