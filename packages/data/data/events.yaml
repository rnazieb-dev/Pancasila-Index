- id: ev-ma-suap-hakim-modern
  term_id: ma-reformasi-sekarang
  date: 2017-09
  category: krisis
  title_id: Serangkaian OTT suap hakim dari Bandar Jiwa hingga PN Tipikor
  summary_id: "Reformasi organisasi tidak otomatis membersihkan manusianya: OTT
    KPK menangkap hakim Bandar Jiwa Suanto (2017), disusul gelombang penangkapan
    hakim dan panitera Pengadilan Tipikor daerah (2023-2025) yang memperlihatkan
    pasar vonis terselubung. Laporan tahunan KY mencatat ribuan aduan etik per
    tahun dengan sanksi berat yang jarang sampai pemberhentian. Independensi
    sudah ada; integritas masih dalam peradilan panjang."
  source_ids:
