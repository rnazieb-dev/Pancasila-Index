  summary_id: "November 2023, Majelis Kehormatan Etik MK memberhentikan Anwar Usman dari kursi ketua: ia gagal netral dan tidak melaporkan konflik kepentingan dalam perkara yang menguntungkan kakak iparnya sendiri. Hakim konstitusi tetap bermajelis; kursi ketua berganti. Skandal ini menjadi studi kasus nasional tentang bagaimana kekuasaan menafsirkan konstitusi bisa digerogoti dari dalam oleh kepentingan keluarga."
