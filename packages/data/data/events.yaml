- id: ev-soekarno1-kmb
  term_id: presiden-soekarno-i
  date: 1949-12
  category: kebijakan
  title_id: Konferensi Meja Bundar dan pengakuan kedaulatan
  summary_id: "Setelah empat tahun perang dan diplomasi - dari Linggarjati yang diangkat senjata, Renville yang dikhianati, hingga serangan umum 1 Maret 1949 yang membuat dunia malu - Belanda akhirnya duduk di meja bundar Den Haag. 27 Desember 1949 kedaulatan diserahkan. Harga-harganya menyakitkan: negara federal RIS sementara dan isu Irian Barat yang ditunda - dua bom waktu ketatanegaraan yang meledak bertahun-tahun kemudian."
  source_ids:
