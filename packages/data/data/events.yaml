- id: ev-dpr14-revisi-kpk
  term_id: dpr-2014-2019
  date: 2019-09
  category: produk-hukum
  title_id: Revisi UU KPK melemahkan independensi
  summary_id: 'Disepakati empat fraksi koalisi dalam hitungan pekan, disahkan 17 September 2019: KPK jadi "lembaga negara" (bukan independen), pegawai di-ASN-kan, Dewan Pengarah beranggotapolitisi dibentuk, izin penyadapan butuh persetujuan eksternal, dan masa jabatan pimpinan diperpendek untuk mengganti semua pemimpinnya. Jutaan tanda tangan online dan aksi mahasiswa nasional menolaknya - DPR tetap jalan. Kinerja penindakan KPK anjlok tajam dalam dua tahun berikutnya.'
  source_ids:
