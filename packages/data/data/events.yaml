- id: ev-soekarno1-nkri-uuds
  term_id: presiden-soekarno-i
  date: 1950-08
  category: produk-hukum
  title_id: Kembalinya NKRI dan berlakunya UUDS 1950
  summary_id: "Dalam hitungan bulan, republik menyerap negara-negara bagian RIS - sebagian lewat perundingan damai, sebagian lewat tekanan tentara - dan pada 17 Agustus 1950 kembali menjadi negara kesatuan dengan konstitusi baru bergaya parlementer. Demokrasi kabinet lima tahun berikutnya menghasilkan tujuh kabinet jatuh-bangun, tapi juga pers bebas, parlemen hidup, dan pemilu terbaik di Asia Tenggara. Eksperimen demokrasi pertama: gagal secara stabilitas, patut dicontoh secara kebebasan."
  source_ids:
    - uuds-1950
  dimension_ids:
    - negara-hukum
