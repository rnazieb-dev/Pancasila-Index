  summary_id: Januari 1973, sepuluh partai Islam dilebur paksa menjadi PPP; lima partai nasionalis dan Kristen menjadi PDI; Golkar berdiri sebagai kendaraan pemerintah tanpa oposisi efektif. Dari sembilan partai pemilu 1955, rakyat kini cuma punya tiga pilihan yang dua di antaranya dikendalikan istana. Fondasi hegemoni politik Orde Baru diletakkan lewat tekanan, bukan musyawarah.
