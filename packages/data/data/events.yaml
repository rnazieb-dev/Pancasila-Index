- id: ev-soeharto-swasembada
  term_id: presiden-soeharto
  date: 1984-11
  category: kebijakan
  title_id: Swasembada beras diakui FAO
  summary_id: 1984 Indonesia - negara pengimpor beras terbesar dunia - mencapai
    swasembada; FAO menganugerahkan medali kepada Soeharto pada 1985. Hasil
    kombinasi intensifikasi massal, subsidi pupuk, dan insentif harga bagi
    petani. Kemiskinan turun dari sekitar enam puluh persen (1970) ke belasan
    persen (1990-an) - capaian kesejahteraan nyata rezim ini, yang sayangnya
    dibayar oleh utang luar negeri dan oligarki cronies yang tumbuh paralel di
    sektor-sektor sama.
  source_ids:
    - fao-swasembada-1985
  dimension_ids:
    - sila-5
    - tujuan-2
- id: ev-soeharto-mej-1998
  term_id: presiden-soeharto
  date: 1998-05
  category: krisis
  title_id: Krismon, Trisakti, kerusuhan Mei, dan lengsernya Soeharto
  summary_id: Rupiah anjlok dari Rp2.500 ke Rp16.000 per dolar; perusahaan runtuh;
    PHK jutaan orang. Penembakan Trisakti 12 Mei 1998 menewaskan empat
    mahasiswa; dua hari kemudian kerusuhan Mei membakar Jakarta - TGPF mencatat
    1.190 orang tewas dan puluhan perempuan Tionghoa diperkosa secara
    sistematis. 21 Mei 1998, Soeharto mengucapkan lengser di Istana Merdeka,
    didampingi Habibie. Tiga puluh dua tahun berakhir dalam delapan menit pidato
    - dan akuntabilitas atas segala yang terjadi belum pernah benar-benar
    datang.
  source_ids:
    - tgpf-mei-1998
  dimension_ids:
    - sila-2
    - kedaulatan-rakyat
- id: ev-dpr24-calon-hakim-mk
  term_id: dpr-2024-2029
  date: 2026-01
  category: krisis
  title_id: DPR mengganti calon hakim konstitusi lewat proses kilat
  summary_id: Agustus 2025, paripurna sudah menetapkan Inosentius Samsul sebagai
    calon hakim konstitusi pengganti Arief Hidayat. Januari 2026, Komisi III
    mendadak membatalkannya dan menjalankan uji kelayakan Adies Kadir - Wakil
    Ketua DPR dari partai penguasa - dalam rapat kurang dari tiga puluh menit;
    paripurna menyetujui keesokan harinya. Tanpa seleksi terbuka, tanpa
    pendalaman publik. Akademisi menyebut proses ini melanggar prinsip
    keterbukaan yang menjadi justru tugas lembaga yang diusulkannya.
  source_ids:
    - berita-adies-kadir-mk-2026
