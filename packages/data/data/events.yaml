    - sila-3
- id: ev-soeharto-fusi-partai
  term_id: presiden-soeharto
  date: 1973-01
  category: kebijakan
  title_id: Fusi paksa partai politik
  summary_id: Januari 1973, sepuluh partai Islam dilebur paksa menjadi PPP; lima
    partai nasionalis dan Kristen menjadi PDI; Golkar berdiri sebagai kendaraan
    pemerintah tanpa oposisi efektif. Dari sembilan partai pemilu 1955, rakyat
    kini cuma punya tiga pilihan yang dua di antaranya dikendalikan istana.
    Fondasi hegemoni politik Orde Baru diletakkan lewat tekanan, bukan
    musyawarah.
  source_ids:
    - fusi-partai-1973
  dimension_ids:
    - sila-4
