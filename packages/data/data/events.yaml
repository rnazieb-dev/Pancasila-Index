  category: peristiwa
  title_id: Serangan Umum 1 Maret 1949
  summary_id: Enam jam republik merebut kembali Yogyakarta dari tangan Belanda - lalu sengaja melepasnya lagi. Serangan yang dipimpin Letkol Soeharto ini bukan soal mempertahankan kota, melainkan bukti kepada dunia bahwa TNI masih hidup dan pemerintah republik berdaulat, membantah propaganda Belanda tentang "republik yang sudah hancur". Tekanan internasional bergeser dalam hitungan pekan; jalannya menuju KMB terbuka lebar.
  source_ids:
    - buku-kahin-nationalism-revolution-1952
    - buku-ricklefs-history-modern-indonesia-1981
