- id: ev-soekarno1-pemilu-1955
  term_id: presiden-soekarno-i
  date: 1955-09
  category: peristiwa
  title_id: Pemilu nasional pertama
  summary_id: September sampai Desember 1955, 37 juta pemilih - 91% partisipasi - memberikan suara tanpa paksaan di negeri yang separuhnya buta huruf. Empat partai besar berbagi suara hampir merata; tidak ada pemenang mutlak, dan itulah potret masyarakat Indonesia yang sesungguhnya. Pengamat asing menyebutnya pemilu terbersih di Asia pasca-kolonial. Ironisnya, hasilnya justru dianggap bencana oleh elite yang ingin Indonesia lebih "tegas" - dan delapan tahun kemudian demokrasi ini dimatikan.
  source_ids:
    - pemilu-1955
  dimension_ids:
