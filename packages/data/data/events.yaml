- id: ev-soekarno2-gestapu
  term_id: presiden-soekarno-ii
  date: 1965-10
  category: krisis
  title_id: G30S dan gelombang kekerasan 1965-1966
  summary_id: "Pagi 1 Oktober 1965 enam jenderal dibunuh; malamnya Mayjen Suharto
    menguasai Jakarta. Berikutnya adalah salah satu pembunuhan massal tercepat
    abad ke-20: dalam lima bulan, ratusan ribu sampai sejuta orang dicurigai
    simpatisan PKI dibunuh oleh pasukan, kelompok agama, dan warga yang
    dimobilisasi - didokumentasikan Komnas HAM sebagai pelanggaran HAM berat
    sistemik. Sukarno menyaksikan kekuasaannya terkikis peristiwa demi
    peristiwa; kebenaran historis masih diperjuangkan korban hingga hari ini."
  source_ids:
    - komnas-ham-temuan-1965
  dimension_ids:
    - sila-2
    - tujuan-1
- id: ev-soekarno2-supersemar
  term_id: presiden-soekarno-ii
  date: 1966-03
  category: krisis
  title_id: Supersemar
  summary_id: 11 Maret 1966, di tengah rumor kudeta dan suasana panik Istana
    Bogor, Sukarno menandatangani surat perintah kepada Mayjen Suharto untuk
    "memulihkan keamanan dan ketertiban". Naskah aslinya hilang - hanya salinan
    di Arsip Nasional; misteri arsip paling terkenal republik. Dalam sembilan
    belas bulan, satu lembar surat itu ditafsirkan menjadi mandat membubarkan
    PKI, membersihkan kabinet, lalu merebut kursi presiden itu sendiri.
  source_ids:
    - supersemar-1966
  dimension_ids:
    - checks-balances
- id: ev-soeharto-tap-iii-1967
  term_id: presiden-soeharto
  date: 1967-03
  category: produk-hukum
  title_id: TAP MPRS III/MPRS/1967 - Suharto menjadi Pejabat Presiden
  summary_id: 'Sidang Istimewa MPRS mencabut mandat Sukarno dan menunjuk Jenderal
    Suharto sebagai Pejabat Presiden; setahun kemudian dilantik penuh. MPRS yang
    banyak diisi unsur militer menjadi mesin legitimasi: apa yang tak bisa
    didapat lewat pemilu didapat lewat sidang. Pola "MPR sebagai penentu arah"
    berjalan mulus tiga puluh tahun - sampai mahasiswa 1998 turun ke jalan.'
  source_ids:
    - tap-mprs-iii-1967
  dimension_ids:
    - checks-balances
- id: ev-soeharto-inpres-14
  term_id: presiden-soeharto
  date: 1967-12
  category: kebijakan
  title_id: Inpres 14/1967 membatasi tradisi dan kepercayaan Tionghoa
  summary_id: "Satu instruksi presiden menutup sekolah, media, dan ritual
    keagamaan Tionghoa: barongsai dilarang, Imlek dirayakan diam-diam, nama
    Tionghoa dipaksa diganti. Selama 32 tahun jutaan warga keturunan hidup
    dengan kodifikasi diskriminasi resmi - baru dicabut Gus Dur pada 2000. Bukti
    bahwa satu lembar birokrasi bisa mewariskan trauma lintas generasi."
  source_ids:
    - inpres-14-1967
  dimension_ids:
