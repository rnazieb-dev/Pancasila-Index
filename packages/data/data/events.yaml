  category: pengangkatan
  title_id: Majelis MK pertama mulai bertugas
  summary_id: 13 Agustus 2003, sembilan hakim dari tiga jalur pengusulan dilantik - Jimly Asshiddiqie menjadi motor penggeraknya sebagai sekretaris jenderal pertama. Dalam hitungan bulan, MK membuka sidang uji materi kepada publik dan media - sesuatu yang tak pernah dilakukan MA selama puluhan tahun. Standar keterbukaan peradilan Indonesia ditulis ulang dari ruang sidang di Jalan Medan Merdeka Barat ini.
