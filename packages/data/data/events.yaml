- id: ev-soekarno2-pnps-1965
  term_id: presiden-soekarno-ii
  date: 1966-01
  category: produk-hukum
  title_id: Lahirnya kitab blasfemi - UU No. 1/PNPS/1965
  summary_id: Ditandatangani Sukarno pada pekan-pekan terakhir Demokrasi Terpimpin (27 Januari 1966), undang-undang ini melarang penafsiran agama yang menyimpang dari doktrin utama - dan secara efektif membekukan aliran-aliran baru seperti Ahmadiyah dalam posisi hukum abu-abu. Lima puluh tahun kemudian, kitab lima pasal ini menjadi dasar ratusan penangkapan dan penutupan rumah ibadah. Pasal karet tertua yang masih hidup dalam hukum kebebasan beragama Indonesia.
  source_ids:
    - pnps-1965
  dimension_ids:
    - sila-1
- id: ev-gusdur-uu-pengadilan-ham
  term_id: presiden-gusdur
  date: 2000-11
  category: produk-hukum
  title_id: UU No. 26/2000 tentang Pengadilan HAM
  summary_id: "November 2000, Indonesia akhirnya punya payung yuridis untuk mengadili pelanggaran HAM berat - genosida dan kejahatan kemanusiaan - termasuk retroaktif untuk Timor Timur dan kasus-kasus Orde Baru. Di atas kertas, jawaban atas impunitas 1965 dan 1998 terbuka lebar. Praksinya: hanya Timor Timur ad hoc yang pernah berjalan, dan gagal. Undang-undang bagus, keberanian politiknya tidak pernah ikut disahkan."
  source_ids:
    - uu-26-2000
  dimension_ids:
    - sila-2
    - negara-hukum
    - tujuan-2
    - tujuan-4
- id: ev-gusdur-konflik-komunal
  term_id: presiden-gusdur
  date: 1999-01
  category: krisis
  title_id: Konflik komunal Maluku dan Poso meledak
  summary_id: Januari 1999 Ambon terbakar; Poso menyusul 2000. Dalam tiga tahun, konflik Muslim-Kristen menewaskan perkiraan sepuluh ribu jiwa dan memaksa lebih sejuta orang mengungsi - kekerasan komunal terbesar pasca-Reformasi. Negara lambat meredam, Laskar Jihad melintasi provinsi tanpa halangan, dan rekonsiliasi Baku Bae baru datang setelah darah. Pesan Bhinneka Tunggal Ika Gus Dur tidak cukup kuat mengalahkan mesin provokasi di lapangan.
  source_ids:
