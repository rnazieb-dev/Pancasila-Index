- id: ev-soekarno1-di-tii
  term_id: presiden-soekarno-i
  date: 1949-08
  category: krisis
  title_id: Pemberontakan DI/TII Kartosuwiryo (1949-1962)
  summary_id: "Agustus 1949, S.M. Kartosuwiryo memproklamasikan Negara Islam Indonesia di Jawa Barat - pemberontakan yang menyebar ke Sulawesi Selatan dan Kalimantan Selatan serta menggigit belasan tahun. Ditumpas dengan operasi militer panjang; Kartosuwiryo ditangkap 1962 dan dieksekusi. Warisannya dua sisi: negara menegaskan bahwa syariat tidak boleh dipaksakan lewat senjata, sekaligus meninggalkan catatan pelanggaran kedua belah pihak yang jarang dibicarakan."
  source_ids:
    - buku-kahin-nationalism-revolution-1952
