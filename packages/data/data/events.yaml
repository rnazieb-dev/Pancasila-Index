- id: ev-ma-otonomi-penuh
  term_id: ma-reformasi-sekarang
  date: 2004-03
  category: produk-hukum
  title_id: Otonomi organisasi penuh MA lepas dari eksekutif
  summary_id: Pasca-amandemen konstitusi, 31 Maret 2004 tanggung jawab pembinaan
    MA resmi lepas dari Departemen Kehakiman ke MA sendiri (dikonsolidasikan UU
    No. 48/2009). Untuk pertama kali sejak 1946 karier hakim tidak lagi
    ditentukan menteri politik. Independensi struktural tercapai - budaya
    internal dan kas-kusuen butuh waktu lebih lama direformasi.
