  term_id: mk-2008-2013
  date: 2010-10
  category: pengadilan
  title_id: Putusan MK No. 46/PUU-VIII/2010
  summary_id: "Gugatan dua mantan pecandu mengubah paradigma narkotika Indonesia:
    pecandu adalah korban penyakit yang wajib direhabilitasi, bukan penjahat
    yang dipenjara. Dasar bagi UU Narkotika revisi dan jutaan kasus
    rehabilitasi. Putusan paling humanis dalam sejarah MK ini juga menjadi
    bantalan hukum ketika eksekusi mati terpidana narkoba diperdebatkan - logika
    korban vs pelakunya sendiri sering bertabrakan."
