  term_id: presiden-soekarno-ii
  date: 1965-10
  category: krisis
  title_id: G30S dan gelombang kekerasan 1965-1966
  summary_id: "Pagi 1 Oktober 1965 enam jenderal dibunuh; malamnya Mayjen Suharto menguasai Jakarta. Berikutnya adalah salah satu pembunuhan massal tercepat abad ke-20: dalam lima bulan, ratusan ribu sampai sejuta orang dicurigai simpatisan PKI dibunuh oleh pasukan, kelompok agama, dan warga yang dimobilisasi - didokumentasikan Komnas HAM sebagai pelanggaran HAM berat sistemik. Sukarno menyaksikan kekuasaannya terkikis peristiwa demi peristiwa; kebenaran historis masih diperjuangkan korban hingga hari ini."
