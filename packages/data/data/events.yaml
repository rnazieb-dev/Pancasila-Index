  summary_id: Seluruh organisasi massa dan partai wajib Pancasila sebagai asas tunggal; PNS wajib monoloyalitas. Kaderisasi P4 masuk sekolah dan kantor; siapa yang ragu dicurigai. Konsep ideologi yang dirancang penyatuan berubah menjadi instrumen ujian kesetiaan politik - dan dicabut barulah oleh MPR pada 2000. Contoh sempurna bagaimana nilai luhur bisa dijadikan alat kontrol.
