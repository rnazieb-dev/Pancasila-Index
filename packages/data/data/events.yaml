  summary_id: "Rezeki minyak 1973 dilempar ke desa: puluhan ribu sekolah dasar dibangun dalam beberapa tahun - salah satu ekspansi pendidikan tercepat di dunia berkembang. Angka partisipasi SD melonjak dari sekitar separuh anak ke hampir universal; Bank Dunia menjadikannya studi kasus klasik. Kritiknya menyusul lama kemudian: gedung ada, guru dan mutu mengikuti dengan tertinggal satu generasi."
