  term_id: dpr-2024-2029
  date: 2025-08
  category: krisis
  title_id: Gelombang protes nasional soal tunjangan DPR
  summary_id: Pernyataan anggota DPR soal tunjangan Rp50 juta di tengah PHK massal dan harga kebutuhan pokok menjadi bara. Kematian ojek daring Affan Kurniawan dilindas kendaraan Brimob pada 28 Agustus 2025 mengubah demo standar menjadi gelombang nasional; gedung DPRD beberapa daerah terbakar. Dalam hitungan hari, pimpinan DPR mencabut kebijakan tunjangan dan presiden membatalkan sejumlah fasilitas pejabat. Rakyat kalah argumen di ruang sidang, menang di jalan - dengan harga sepuluh nyawa menurut Komnas HAM.
