  term_id: mk-2018-2023
  date: 2023-11
  category: krisis
  title_id: Ketua MK Anwar Usman melanggar etik
  summary_id: "November 2023, Majelis Kehormatan Etik MK memberhentikan Anwar
    Usman dari kursi ketua: ia gagal netral dan tidak melaporkan konflik
    kepentingan dalam perkara yang menguntungkan kakak iparnya sendiri. Hakim
    konstitusi tetap bermajelis; kursi ketua berganti. Skandal ini menjadi studi
    kasus nasional tentang bagaimana kekuasaan menafsirkan konstitusi bisa
    digerogoti dari dalam oleh kepentingan keluarga."
