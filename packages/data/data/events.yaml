- id: ev-soeharto-asean-1967
  term_id: presiden-soeharto
  date: 1967-08
  category: kebijakan
  title_id: Pendirian ASEAN - Deklarasi Bangkok
  summary_id: Setelah konfrontasi yang menghancurkan, Indonesia justru menjadi
    pendiri ASEAN bersama lima tetangga pada 8 Agustus 1967. Dari sini lahir
    ZOPFAN, TAC 1976, dan arsitektur keamanan regional tempat Jakarta selalu
    jadi motor. Satu dari sedikit babak dalam sejarah ketika kebijakan luar
    negeri Indonesia mengubah peta kawasan secara permanen - warisan positif
    Orde Baru yang tak terbantahkan.
  source_ids:
    - deklarasi-bangkok-1967
  dimension_ids:
    - tujuan-4
    - sila-3
- id: ev-soeharto-dom-aceh-papua
  term_id: presiden-soeharto
  date: "1989"
  category: krisis
  title_id: Daerah Operasi Militer Aceh dan Papua
  summary_id: "Status DOM diberlakukan di Aceh (1989-1998) dan diperkuat di Papua:
    pembumian rumah, penyiksaan, hilangnya ribuan orang yang namanya tidak
    pernah dicatat. Ketika DOM dicabut 1998, mayat massal digali dari bekas
    markas militer di Aceh. Warisan kebijakan ini - menjawab pemberontakan
    dengan teror terhadap warga sipil - adalah akar dari luka yang MoU Helsinki
    hanya sebagian menyembuhkan."
  source_ids:
    - literatur-sejarah-nasional
  dimension_ids:
    - sila-2
- id: ev-soekarno2-pnps-1965
  term_id: presiden-soekarno-ii
  date: 1966-01
  category: produk-hukum
  title_id: Lahirnya kitab blasfemi - UU No. 1/PNPS/1965
  summary_id: Ditandatangani Sukarno pada pekan-pekan terakhir Demokrasi Terpimpin
    (27 Januari 1966), undang-undang ini melarang penafsiran agama yang
    menyimpang dari doktrin utama - dan secara efektif membekukan aliran-aliran
    baru seperti Ahmadiyah dalam posisi hukum abu-abu. Lima puluh tahun
    kemudian, kitab lima pasal ini menjadi dasar ratusan penangkapan dan
    penutupan rumah ibadah. Pasal karet tertua yang masih hidup dalam hukum
    kebebasan beragama Indonesia.
  source_ids:
    - pnps-1965
  dimension_ids:
    - sila-1
- id: ev-gusdur-uu-pengadilan-ham
  term_id: presiden-gusdur
  date: 2000-11
  category: produk-hukum
  title_id: UU No. 26/2000 tentang Pengadilan HAM
  summary_id: "November 2000, Indonesia akhirnya punya payung yuridis untuk
    mengadili pelanggaran HAM berat - genosida dan kejahatan kemanusiaan -
    termasuk retroaktif untuk Timor Timur dan kasus-kasus Orde Baru. Di atas
    kertas, jawaban atas impunitas 1965 dan 1998 terbuka lebar. Praksinya: hanya
    Timor Timur ad hoc yang pernah berjalan, dan gagal. Undang-undang bagus,
    keberanian politiknya tidak pernah ikut disahkan."
  source_ids:
    - uu-26-2000
  dimension_ids:
    - sila-2
    - negara-hukum
- id: ev-gusdur-konflik-komunal
  term_id: presiden-gusdur
  date: 1999-01
  category: krisis
  title_id: Konflik komunal Maluku dan Poso meledak
  summary_id: Januari 1999 Ambon terbakar; Poso menyusul 2000. Dalam tiga tahun,
    konflik Muslim-Kristen menewaskan perkiraan sepuluh ribu jiwa dan memaksa
    lebih sejuta orang mengungsi - kekerasan komunal terbesar pasca-Reformasi.
    Negara lambat meredam, Laskar Jihad melintasi provinsi tanpa halangan, dan
    rekonsiliasi Baku Bae baru datang setelah darah. Pesan Bhinneka Tunggal Ika
    Gus Dur tidak cukup kuat mengalahkan mesin provokasi di lapangan.
  source_ids:
    - literatur-sejarah-nasional
  dimension_ids:
    - sila-2
    - sila-3
- id: ev-megawati-sisdiknas
  term_id: presiden-megawati
  date: 2003-07
  category: produk-hukum
  title_id: UU Sistem Pendidikan Nasional No. 20/2003
  summary_id: "Disahkan 8 Juli 2003, UU Sisdiknas menjadi kerangka induk
    pendidikan modern: wajib belajar, kurikulum berbasis kompetensi, jaminan
    anggaran, dan definisi pendidikan yang inklusif. Semua reformasi pendidikan
    sesudahnya - BOS, Kurikulum Merdeka - berdiri di atas fondasi ini.
    Kelemahannya juga mewarisi: mutu guru dan hasil belajar tetap menjadi PR
    yang belum selesai dua dekade kemudian."
  source_ids:
    - uu-20-2003
  dimension_ids:
    - tujuan-3
- id: ev-megawati-sipadan-ligitan
  term_id: presiden-megawati
  date: 2002-12
  category: pengadilan
  title_id: ICJ menangkan Sipadan-Ligitan untuk Indonesia
  summary_id: 17 Desember 2002, Mahkamah Internasional menetapkan kedaulatan dua
    pulau kecil di Selat Celebes kepada Indonesia, menutup sengketa tiga dekade
    dengan Malaysia. Kemenangan dibangun bukan dengan kapal perang melainkan
    dokumen efektifitas pengelolaan sejak era kolonial - kemenangan arsip.
    Preseden penting bagi seluruh sengketa maritim Nusantara dan bukti bahwa
    diplomasi hukum adalah senjata negara kepulauan.
  source_ids:
    - icj-sipadan-ligitan-2002
  dimension_ids:
    - tujuan-1
- id: ev-sby1-ratifisasi-icescr
  term_id: presiden-sby-i
  date: 2005-09
  category: produk-hukum
  title_id: Ratifikasi Konvenan Ekonomi-Sosial-Budaya (UU No. 11/2005)
  summary_id: "Hampir empat puluh tahun Indonesia menunda meratifikasi ICESCR -
    takut kewajiban hak ekonomi mengikat. Akhirnya September 2005 sah juga,
    menyusul ICCPR setahun sebelumnya. Sejak itu seluruh pasal 28E-28J
    konstitusi punya jangkar traktat internasional, dan laporan berkala
    Indonesia diuji Komite PBB. Langkah kecil di kertas, besar dalam bahasa:
    negara resmi mengaku bisa diaudit soal hak-hak dasar rakyatnya."
  source_ids:
    - uu-11-2005
  dimension_ids:
    - tujuan-4
    - sila-2
- id: ev-sby1-blt-perdana
  term_id: presiden-sby-i
  date: 2005-10
  category: kebijakan
  title_id: BLT perdana untuk 19 juta rumah tangga miskin
  summary_id: "Saat subsidi BBM dipotong Oktober 2005, pemerintah membayar
    kompensasi sosialnya langsung: Rp300 ribu per bulan bagi 19 juta rumah
    tangga termiskin - program perlindungan sosial berskala massal pertama
    republik. Distribusinya berantakan di lapangan, data kemiskinan usang, tapi
    preseden lahir: sejak BLT ini, setiap kenaikan harga energi wajib dibayar
    tebusan sosial. Fondasi bagi PKH, bansos pandemi, sampai MBG hari ini."
  source_ids:
    - literatur-sejarah-nasional
  dimension_ids:
    - sila-5
    - tujuan-2
- id: ev-sby1-dana-bos
  term_id: presiden-sby-i
  date: "2005"
  category: kebijakan
  title_id: Dana BOS dimulai - sekolah bebas biaya
  summary_id: "Tahun ajaran 2005/2006 Dana BOS pertama mengalir ke ratusan ribu
    SD-SMP negeri dan swasta terakreditasi: sekolah dilarang memungut biaya,
    negara yang membayarnya per siswa. Angka partisipasi SMP melonjak nyata
    dalam beberapa tahun. Masalahnya klasik menyusul: verifikasi murid fiktif,
    penyelewengan oleh kepala sekolah, dan mutu yang tidak otomatis naik ikut
    kantong yang naik."
  source_ids:
    - dana-bos-2005
  dimension_ids:
    - tujuan-3
- id: ev-sby1-penanaman-modal
  term_id: presiden-sby-i
  date: 2007-03
  category: produk-hukum
  title_id: UU Penanaman Modal No. 25/2007
  summary_id: "Setelah satu dekade krisis membuat investor lari, Indonesia menulis
    ulang rezim investasi: perlakukan asing-domestik setara, kepastian tanah,
    fasilitas pajak, dan larangan nasionalisasi tanpa kompensasi. Arus masuk FDI
    berbalik tajam bertahun-tahun sesudahnya. Sisi gelapnya kelak tampak di
    Cipta Kerja: pintu yang dibuka lebar ini tanpa pagar lingkungan dan hak
    buruh yang memadai."
  source_ids:
    - uu-25-2007
  dimension_ids:
    - tujuan-2
- id: ev-jokowi1-perppu-ormas-hti
  term_id: presiden-jokowi-i
  date: 2017-07
  category: produk-hukum
  title_id: Perppu Ormas dan pembubaran HTI
  summary_id: Julu 2017, pemerintah menerbitkan Perppu Ormas yang mempermudah
    pembubaran organisasi kemasyarakatan tanpa putusan pengadilan - dua pekan
    kemudian HTI dilumat karena menolak Pancasila sebagai asas negara. Perppu
    disahkan jadi UU meski Komnas HAM dan puluhan LSM menyebutnya pintu represi
    terhadap semua ormas. Preseden yang sama kelak dipakai membubarkan FPI pada
    2020 - alat yang dibuat untuk satu lawan akhirnya tersedia untuk siapa saja
    yang berkuasa.
  source_ids:
    - berita-fpi-skb-2020
  dimension_ids:
    - negara-hukum
    - sila-4
- id: ev-jokowi2-revisi-uumk
  term_id: presiden-jokowi-ii
  date: 2020-07
  category: produk-hukum
  title_id: Revisi UU Mahkamah Konstitusi mengubah masa jabatan pimpinan
  summary_id: Diam-diam digodok, UU No. 7/2020 mengubah aturan masa jabatan Ketua
    dan Wakil Ketua MK - periode 2015-2020 dihitung sebagai periode baru
    sehingga petahana bisa maju lagi. Anwar Usman akhirnya menjabat ketua hingga
    2023, persis sampai skandal etik Putusan 90/2023 memberhentikannya.
    Legislatif membuka pintu; isi rumahnya yang kelak memalukan. Contoh sempurna
    bagaimana revisi teknis kecil bisa mengubah nasib konstitusi.
  source_ids:
    - uu-7-2020
    - mkmk-anwar-usman-2023
  dimension_ids:
    - checks-balances
- id: ev-soeharto-skb-1969
  term_id: presiden-soeharto
  date: "1969"
  category: kebijakan
  title_id: SKB 2 Menteri tentang rumah ibadah
  summary_id: Dua menteri menandatangani surat bersama yang mensyaratkan "dukungan
    warga sekitar" untuk membangun rumah ibadah minoritas - dalam praktiknya
    diterjemahkan birokrasi menjadi angka 90 tanda tangan tetangga. Selama lebih
    dari lima puluh tahun, dokumen teknis ini adalah akar dari ratusan kasus
    penutupan paksa gereja dan pura di seluruh Indonesia. Konflik yang terlihat
    sebagai intoleransi warga sering kali lahir dari satu lembar SKB.
  source_ids:
    - skb-rumah-ibadah-1969
  dimension_ids:
    - sila-1
- id: ev-soeharto-uuperkawinan-1974
  term_id: presiden-soeharto
  date: "1974"
  category: produk-hukum
  title_id: UU Perkawinan No. 1/1974
  summary_id: "Undang-undang pertama tentang perkawinan menutup perdebatan panjang
    dengan formula kompromi: perkawinan sah bila dilakukan menurut agama
    masing-masing, tetapi Pasal 11 tak menjelaskan status perkawinan beda agama
    - celah yang membuat pasukan pencatat sipil dan pengadilan saling melempar
    tanggung jawab sampai hari ini. Negara memilih mengunci keragaman ke dalam
    ambiguitas daripada menyelesaikannya."
  source_ids:
    - uu-1-1974
  dimension_ids:
    - sila-1
- id: ev-soeharto-krismon-blbi
  term_id: presiden-soeharto
  date: 1998-01
  category: krisis
  title_id: Krismon, likuidasi bank, dan skandal BLBI
  summary_id: Rupiah runtuh; di bawah tekanan IMF, puluhan bank dilikuidasi
    sementara BLBI Rp130+ triliun dialirkan ke pemilik bank - sebagian besar
    tidak kembali. Para taipan yang membawa uang keluar negeri hidup bebas;
    rakyat menanggung inflasi 78% dan PHK massal. Skandal BLBI kemudian jadi
    daftar panjang impunitas oligarki yang tidak pernah benar-benar dituntaskan
    hingga kini.
  source_ids:
    - literatur-sejarah-nasional
  dimension_ids:
    - negara-hukum
    - sila-5
- id: ev-soeharto-udin-jurnalis
  term_id: presiden-soeharto
  date: 1996-08
  category: krisis
  title_id: Pembunuhan jurnalis Udin di Yogyakarta
  summary_id: "10 Agustus 1996, wartawan Monitor Fuad Muhammad Syafruddin yang
    gali korupsi bupati Bantul ditusuk di depan rumahnya. Seorang buruh bangunan
    disiksa hingga mengaku, lalu dibebaskan pengadilan karena keterangannya
    dipaksakan. Pembunuh sejati dan otaknya tak pernah ditemukan. Kasus Udin
    menjadi simbol abadi: membongkar korupsi di era Orde Baru bisa berarti mati,
    dan negara melindungi pembunuhnya lebih baik daripada saksi."
  source_ids:
    - berita-udin-1996
  dimension_ids:
    - sila-4
    - sila-2
- id: ev-megawati-sampit-sambas
  term_id: presiden-megawati
  date: 2001-02
  category: krisis
  title_id: Kerusuhan Sampit dan Sambas - konflik Dayak-Madura
  summary_id: Melanjutkan Sambas 1999, kerusuhan Sampit Februari-Maret 2001
    menewaskan setidaknya lima ratus orang dan memaksa puluhan ribu etnis Madura
    mengungsi permanen dari Kalimantan Tengah. Kekerasan paling brutal
    antaretnis era Reformasi ini berakhir bukan lewat penegakan hukum melainkan
    karena satu kelompok berhasil dibersihkan dari wilayahnya - perdamaian tanpa
    keadilan yang menjadi template konflik agraria-etnis berikutnya.
  source_ids:
    - literatur-sejarah-nasional
  dimension_ids:
    - sila-2
    - sila-3
- id: ev-sby1-tsunami-aceh-respons
  term_id: presiden-sby-i
  date: 2004-12
  category: krisis
  title_id: Gempa dan tsunami Samudra Hindia - respons bencana terbesar republik
  summary_id: "26 Desember 2004, gempa M9,1 dan tsunami menewaskan sekitar 167
    ribu orang di Aceh dan Nias - bencana nasional terbesar sepanjang ingatan.
    Indonesia membuka pintu bantuan dunia, TNI berubah fungsi menjadi logistik
    kemanusiaan, dan rekonstruksi via BRR Aceh-Nias dijalankan relatif bersih
    dibanding standar saat itu. Dari puing-puing juga lahir damai: bencana yang
    sama-sama diderita membuka jalan MoU Helsinki tujuh bulan kemudian."
  source_ids:
    - literatur-sejarah-nasional
    - mou-helsinki-2005
  dimension_ids:
    - tujuan-1
- id: ev-sby1-uuguru-dosen
  term_id: presiden-sby-i
  date: 2005-12
  category: produk-hukum
  title_id: UU Guru dan Dosen No. 14/2005
  summary_id: "Diundangkan 14 Desember 2005 dengan janji megah: tunjangan profesi
    sebesar gaji pokok bagi semua guru - gaji guru naik dua kali lipat. Empat
    belas tahun kemudian jutaan guru non-PNS masih menunggu janji itu penuh;
    sertifikasi mengubah status tanpa mengubah mutu kelas secara signifikan
    menurut berbagai studi. UU yang dimaksudkan mencerdaskan justru menjadi
    contoh bagaimana anggaran besar tanpa desain insentif hanya menghasilkan
    birokrasi baru."
  source_ids:
    - uu-14-2005
  dimension_ids:
    - tujuan-3
- id: ev-sby2-gayus-pajak
  term_id: presiden-sby-ii
  date: "2010"
  category: krisis
  title_id: Kasus Gayus Tambunan - mafia pajak yang berlibur
  summary_id: Pajak rendahan Gayus Tambunan terbongkar menerima miliaran dari
    perusahaan, lalu dunia dikejutkan foto dirinya berlibur ke Bali dan Gili
    saat statusnya tahanan - bukti telanjang bahwa uang bisa membeli penjara.
    Jaringannya menyentuh polisi, jaksa, hakim, dan advokat. Reformasi DJP
    diluncurkan setelahnya; kepercayaan publik kepada sistem perpajakan dan
    penegakan hukum tidak pernah benar-benar pulih.
  source_ids:
    - berita-gayus-2010
  dimension_ids:
    - negara-hukum
- id: ev-sby2-hambalang
  term_id: presiden-sby-ii
  date: 2013-01
  category: krisis
  title_id: Korupsi proyek Hambalang Rp2,5 triliun
  summary_id: Proyek pusat pelatihan atlet nasional membengkak menjadi sekitar
    Rp2,5 triliun penuh mark-up; KPK menetapkan pejabat Kemenpora dan kontraktor
    sebagai tersangka, termasuk politisi senior partai penguasa. Dana yang
    seharusnya mencetak medali habis di rekening. Hambalang menjadi lambang
    bagaimana anggaran prestasi olahraga Indonesia dibunuh oleh rakusnya
    pengelolanya sendiri - dua dekade kemudian hasilnya masih kita tanggung.
  source_ids:
    - berita-hambalang-2013
  dimension_ids:
    - negara-hukum
- id: ev-jokowi1-paris-agreement
  term_id: presiden-jokowi-i
  date: 2016-10
  category: produk-hukum
  title_id: Indonesia meratifikasi Paris Agreement lebih awal
  summary_id: "Oktober 2016, DPR mengesahkan UU No. 16/2016 sehingga Indonesia
    masuk jajaran negara pertama yang meratifikasi Paris Agreement sebelum
    perjanjian itu berlaku efektif - diklaim sebagai negara berkembang pertama
    lewat jalur parlemen. Komitmen NDC: menurunkan emisi hingga 29% sendiri, 41%
    dengan bantuan internasional pada 2030. Realisasinya masih diperdebatkan
    tiap tahun; tetapi secara hukum, Indonesia mengikat dirinya ke rezim iklim
    global."
  source_ids:
    - uu-16-2016
  dimension_ids:
    - tujuan-4
- id: ev-jokowi2-kip-kuliah
  term_id: presiden-jokowi-ii
  date: "2020"
  category: kebijakan
  title_id: Peluncuran KIP Kuliah
  summary_id: "Tengah pandemi, pemerintah melebur Bidikmisi dan berbagai beasiswa
    menjadi satu KIP Kuliah: biaya kuliah ditanggung penuh plus biaya hidup bagi
    mahasiswa dari keluarga tidak mampu. Dalam beberapa tahun jumlah penerima
    melonjak hingga jutaan per angkatan - salah satu program afirmasi pendidikan
    tinggi terbesar di Asia Tenggara. Tantangan klasik menyusul: data penerima
    yang bocor dijual daring, dan mutu lulusan yang tak otomatis ikut naik
    bersama kuotanya."
  source_ids:
    - kip-kuliah-2020
  dimension_ids:
    - tujuan-3
- id: ev-jokowi2-jiwasraya-vonis
  term_id: presiden-jokowi-ii
  date: 2022-03
  category: pengadilan
  title_id: Vonis Jiwasraya - Rp16,8 triliun hilang di asuransi negara
  summary_id: "Maret 2022 majelis hakim menjatuhkan vonis dalam skandal investasi
    PT Asuransi Jiwasraya: kerugian negara Rp16,8 triliun - dana tabungan polis
    jutaan rakyat yang dipakai saham- sahaman spekulatif oleh eks-direktur dan
    jaringan broker politik. Salah satu kerugian terbesar dalam sejarah korupsi
    Indonesia, dan seperti biasa: para eksdir divonis, sementara pertanyaan
    siapa pemilik kepentingan di baliknya tidak pernah benar-benar dijawab."
  source_ids:
    - berita-jiwasraya-2022
  dimension_ids:
    - negara-hukum
  actor_ids:
    - benny-tjokrosaputro
    - heru-hidayat
    - hendrisman-rahim
- id: ev-jokowi2-revisi-ite-2024
  term_id: presiden-jokowi-ii
  date: 2024-01
  category: produk-hukum
  title_id: Revisi kedua UU ITE (UU No. 1/2024)
  summary_id: Setelah lebih dari 700 orang dipidana lewat pasal karet, revisi
    kedua UU ITE akhirnya mengubah pencemaran nama baik menjadi delik aduan dan
    menambah bab "hormat serta privasi". Kemajuannya nyata di atas kertas;
    praktik lapangan belum banyak berubah - pasal-pasal baru tentang martabat
    dan privasi justru rawan dipakai cara lama. Perbaikan setengah hati atas
    luka yang diciptakan undang-undang itu sendiri enam belas tahun sebelumnya.
  source_ids:
    - uu-1-2024
  dimension_ids:
    - sila-4
- id: ev-soekarno1-hatta-mundur
  term_id: presiden-soekarno-i
  date: 1956-12
  category: pengangkatan
  title_id: Mohammad Hatta mengundurkan diri dari wakil presiden
  summary_id: 1 Desember 1956, Bung Hatta meletakkan jabatan - protes tenang atas
    kultus individu yang tumbuh dan ketidaksetujuan pada arah politik Sukarno.
    Tanpa wakil presiden, republik kehilangan rem moralnya di detik kritis
    menjelang Dekrit 1959. Perdebatan apakah Indonesia butuh wakil presiden
    aktif baru selesai hanya lewat amandemen 44 tahun kemudian.
  source_ids:
    - literatur-sejarah-nasional
  dimension_ids:
    - checks-balances
- id: ev-soekarno2-seumur-hidup
  term_id: presiden-soekarno-ii
  date: 1963-05
  category: produk-hukum
  title_id: TAP MPRS III/MPRS/1963 - Sukarno Presiden Seumur Hidup
  summary_id: "Sidang Istimewa MPRS Mei 1963 menobatkan Sukarno presiden seumur
    hidup - tanpa pemilu, tanpa batasan, atas nama revolusi. Satu ketetapan
    menutup seluruh pintu pergantian kekuasaan secara damai selamanya; dua tahun
    kemudian satu lembar Supersemar membuka pintu itu dengan cara paling
    berdarah. Pelajaran klasik: kursi tanpa batas waktu selalu berakhir tanpa
    aturan."
  source_ids:
    - tap-mprs-iii-1963
  dimension_ids:
    - checks-balances
    - kedaulatan-rakyat
- id: ev-dpr99-uu-polri
  term_id: dpr-1999-2004
  date: 2002-01
  category: produk-hukum
  title_id: UU Kepolisian - Polri resmi lepas dari militer
  summary_id: "Disahkan Januari 2002 menyusul pemisahan Polri dari ABRI sejak
    April 1999, undang-undang ini menata ulang kepolisian sebagai institusi
    sipil yang melindungi-mengayomi-melayani masyarakat. Reformasi keamanan
    paling fundamental pasca-dwifungsi: tentara keluar dari urusan kamtibmas.
    Implementasinya masih diperjuangkan sampai hari ini - reformasi polri
    ternyata lebih mudah ditulis daripada dilakukan."
  source_ids:
    - uu-2-2002
  dimension_ids:
    - tujuan-1
    - negara-hukum
- id: ev-jokowi1-pengepungan-kpk
  term_id: presiden-jokowi-i
  date: 2015-01
  category: krisis
  title_id: Pengepungan gedung KPK oleh aparat kepolisian
  summary_id: "18 Januari 2015, beberapa hari setelah KPK menetapkan seorang
    jenderal bintang tiga tersangka, puluhan aparat Brimob mengepung gedung KPK
    untuk menangkap dua penyidiknya. Publik menyebutnya hari tergelap
    antikorupsi; presiden memilih jalan tengah yang tidak menyenangkan siapa
    pun. Pesan yang tertinggal: lembaga antikorupsi bisa digerogoti bahkan oleh
    institusi yang seharusnya menjadi sekutunya."
  source_ids:
    - berita-kpk-2015
  dimension_ids:
    - checks-balances
    - negara-hukum
- id: ev-jokowi2-hilirisasi-nikel
  term_id: presiden-jokowi-ii
  date: 2020-01
  category: kebijakan
  title_id: Larangan ekspor bijih nikel dan era hilirisasi paksa
  summary_id: "Januari 2020 larangan ekspor bijih nikel mentah berlaku - WTO
    sempat memenangkan gugatan atasnya, Indonesia banding dan tetap jalan.
    Hasilnya nyata: puluhan smelter dibangun, nilai ekspor produk nikel melonjak
    berpuluh kali lipat, ratusan ribu lapangan kerja industri baru. Bayangannya
    sama nyata: ekspansi tambah kapal keruk laut, deforestasi Raja
    Ampat-Halmahera, dan dominasi modal tunggal asing di kawasan industri."
  source_ids:
    - berita-hilirisasi-2020
  dimension_ids:
    - tujuan-2
- id: ev-jokowi2-pemilu-terbesar
  term_id: presiden-jokowi-ii
  date: 2024-02
  category: peristiwa
  title_id: Pemilu 14 Februari 2024 - pemilihan satu hari terbesar dunia
  summary_id: Sehari dalam sebulan penuh, sekitar 204,8 juta pemilih terdaftar
    memilih lima tingkat jabatan sekaligus di lebih dari 800 ribu TPS -
    pemilihan umum satu hari terbesar dalam sejarah manusia. Berlangsung damai
    dan meriah meski korban jiwa petugas logistik serta polemik etika netralitas
    Anies-Ganjar-Prabowo vs Istana mencoretnya. Kapasitas elektoral republik tak
    diragukan lagi; mutu integritasnya masih diuji tiap lima tahun.
  source_ids:
    - berita-kpu-2024
    - uu-7-2017
  dimension_ids:
    - sila-4
    - kedaulatan-rakyat
- id: ev-sby1-kur
  term_id: presiden-sby-i
  date: 2007-03
  category: kebijakan
  title_id: Kredit Usaha Rakyat (KUR) diluncurkan nasional
  summary_id: "Maret 2007, KUR menembakkan kredit subsidi ke UMKM dengan bunga
    tetap rendah dan tanpa agunan untuk plafon tertentu - triliunan rupiah
    pertama dialirkan pada tahun pertamanya. Program ini menjadi instrumen
    favorit setiap pemerintah sesudahnya; kritiknya juga turun temurun:
    penyaluran sering tertukar dengan patronase politik dan banyak penerima tak
    pernah naik kelas."
  source_ids:
    - literatur-sejarah-nasional
  dimension_ids:
    - sila-5
    - tujuan-2
- id: ev-sby1-gempa-yogya
  term_id: presiden-sby-i
  date: 2006-05
  category: krisis
  title_id: Gempa Yogyakarta dan Jawa Tengah
  summary_id: 27 Mei 2006, gempa M5,9 meratakan ribuan rumah di Yogyakarta-Klaten;
    sekitar 5.800 orang tewas. Respons darurat berjalan cepat dengan bantuan
    komunitas terbesar dalam sejarah bencana Indonesia saat itu, namun
    rekonstruksi via dana swadaya masyarakat justru lebih cepat dan lebih
    akuntabel daripada kanal negara - pelajaran tata kelola yang kelak diulang
    di Palu.
  source_ids:
    - literatur-sejarah-nasional
  dimension_ids:
    - tujuan-1
- id: ev-dpr04-pilkada-langsung
  term_id: dpr-2004-2009
  date: 2004-09
  category: produk-hukum
  title_id: UU Pemerintahan Daerah - era pilkada langsung dimulai
  summary_id: "UU No. 32/2004 mengoperasionalkan amandemen konstitusi:
    gubernur-bupati-wali kota dipilih langsung rakyat mulai 2005, mengakhiri era
    DPRD menunjuk kepala daerah. Legitimasi lokal berubah total; harga-harganya
    juga muncul - politik uang pilkada dan dinasti daerah yang kini jadi musuh
    abadi reformasi elektoral."
  source_ids:
