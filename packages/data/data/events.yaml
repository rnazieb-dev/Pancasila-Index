- id: ev-sby1-ratifisasi-icescr
  term_id: presiden-sby-i
  date: 2005-09
  category: produk-hukum
  title_id: Ratifikasi Konvenan Ekonomi-Sosial-Budaya (UU No. 11/2005)
  summary_id: "Hampir empat puluh tahun Indonesia menunda meratifikasi ICESCR - takut kewajiban hak ekonomi mengikat. Akhirnya September 2005 sah juga, menyusul ICCPR setahun sebelumnya. Sejak itu seluruh pasal 28E-28J konstitusi punya jangkar traktat internasional, dan laporan berkala Indonesia diuji Komite PBB. Langkah kecil di kertas, besar dalam bahasa: negara resmi mengaku bisa diaudit soal hak-hak dasar rakyatnya."
  source_ids:
    - uu-11-2005
  dimension_ids:
    - tujuan-4
    - sila-2
- id: ev-sby1-blt-perdana
  term_id: presiden-sby-i
  date: 2005-10
  category: kebijakan
  title_id: BLT perdana untuk 19 juta rumah tangga miskin
  summary_id: "Saat subsidi BBM dipotong Oktober 2005, pemerintah membayar kompensasi sosialnya langsung: Rp300 ribu per bulan bagi 19 juta rumah tangga termiskin - program perlindungan sosial berskala massal pertama republik. Distribusinya berantakan di lapangan, data kemiskinan usang, tapi preseden lahir: sejak BLT ini, setiap kenaikan harga energi wajib dibayar tebusan sosial. Fondasi bagi PKH, bansos pandemi, sampai MBG hari ini."
  source_ids:
    - buku-kahin-nationalism-revolution-1952
    - buku-ricklefs-history-modern-indonesia-1981
  dimension_ids:
    - sila-5
    - tujuan-2
- id: ev-sby1-dana-bos
  term_id: presiden-sby-i
  date: "2005"
  category: kebijakan
  title_id: Dana BOS dimulai - sekolah bebas biaya
  summary_id: "Tahun ajaran 2005/2006 Dana BOS pertama mengalir ke ratusan ribu SD-SMP negeri dan swasta terakreditasi: sekolah dilarang memungut biaya, negara yang membayarnya per siswa. Angka partisipasi SMP melonjak nyata dalam beberapa tahun. Masalahnya klasik menyusul: verifikasi murid fiktif, penyelewengan oleh kepala sekolah, dan mutu yang tidak otomatis naik ikut kantong yang naik."
  source_ids:
    - dana-bos-2005
  dimension_ids:
    - tujuan-3
    - kedaulatan-rakyat
- id: ev-sby1-penanaman-modal
  term_id: presiden-sby-i
  date: 2007-03
  category: produk-hukum
  title_id: UU Penanaman Modal No. 25/2007
  summary_id: "Setelah satu dekade krisis membuat investor lari, Indonesia menulis ulang rezim investasi: perlakukan asing-domestik setara, kepastian tanah, fasilitas pajak, dan larangan nasionalisasi tanpa kompensasi. Arus masuk FDI berbalik tajam bertahun-tahun sesudahnya. Sisi gelapnya kelak tampak di Cipta Kerja: pintu yang dibuka lebar ini tanpa pagar lingkungan dan hak buruh yang memadai."
  source_ids:
    - uu-25-2007
  dimension_ids:
    - tujuan-2
- id: ev-jokowi1-perppu-ormas-hti
  term_id: presiden-jokowi-i
  date: 2017-07
  category: produk-hukum
  title_id: Perppu Ormas dan pembubaran HTI
  summary_id: Julu 2017, pemerintah menerbitkan Perppu Ormas yang mempermudah pembubaran organisasi kemasyarakatan tanpa putusan pengadilan - dua pekan kemudian HTI dilumat karena menolak Pancasila sebagai asas negara. Perppu disahkan jadi UU meski Komnas HAM dan puluhan LSM menyebutnya pintu represi terhadap semua ormas. Preseden yang sama kelak dipakai membubarkan FPI pada 2020 - alat yang dibuat untuk satu lawan akhirnya tersedia untuk siapa saja yang berkuasa.
  source_ids:
    - berita-fpi-skb-2020
  dimension_ids:
    - negara-hukum
    - sila-4
- id: ev-jokowi2-revisi-uumk
  term_id: presiden-jokowi-ii
  date: 2020-07
  category: produk-hukum
  title_id: Revisi UU Mahkamah Konstitusi mengubah masa jabatan pimpinan
  summary_id: Diam-diam digodok, UU No. 7/2020 mengubah aturan masa jabatan Ketua dan Wakil Ketua MK - periode 2015-2020 dihitung sebagai periode baru sehingga petahana bisa maju lagi. Anwar Usman akhirnya menjabat ketua hingga 2023, persis sampai skandal etik Putusan 90/2023 memberhentikannya. Legislatif membuka pintu; isi rumahnya yang kelak memalukan. Contoh sempurna bagaimana revisi teknis kecil bisa mengubah nasib konstitusi.
  source_ids:
    - uu-7-2020
    - mkmk-anwar-usman-2023
  dimension_ids:
    - checks-balances
- id: ev-soeharto-skb-1969
  term_id: presiden-soeharto
  date: "1969"
  category: kebijakan
  title_id: SKB 2 Menteri tentang rumah ibadah
  summary_id: Dua menteri menandatangani surat bersama yang mensyaratkan "dukungan warga sekitar" untuk membangun rumah ibadah minoritas - dalam praktiknya diterjemahkan birokrasi menjadi angka 90 tanda tangan tetangga. Selama lebih dari lima puluh tahun, dokumen teknis ini adalah akar dari ratusan kasus penutupan paksa gereja dan pura di seluruh Indonesia. Konflik yang terlihat sebagai intoleransi warga sering kali lahir dari satu lembar SKB.
  source_ids:
    - skb-rumah-ibadah-1969
  dimension_ids:
    - sila-1
- id: ev-soeharto-uuperkawinan-1974
  term_id: presiden-soeharto
  date: "1974"
  category: produk-hukum
  title_id: UU Perkawinan No. 1/1974
  summary_id: "Undang-undang pertama tentang perkawinan menutup perdebatan panjang dengan formula kompromi: perkawinan sah bila dilakukan menurut agama masing-masing, tetapi Pasal 11 tak menjelaskan status perkawinan beda agama - celah yang membuat pasukan pencatat sipil dan pengadilan saling melempar tanggung jawab sampai hari ini. Negara memilih mengunci keragaman ke dalam ambiguitas daripada menyelesaikannya."
  source_ids:
    - uu-1-1974
  dimension_ids:
    - sila-1
- id: ev-soeharto-krismon-blbi
  term_id: presiden-soeharto
  date: 1998-01
  category: krisis
  title_id: Krismon, likuidasi bank, dan skandal BLBI
  summary_id: Rupiah runtuh; di bawah tekanan IMF, puluhan bank dilikuidasi sementara BLBI Rp130+ triliun dialirkan ke pemilik bank - sebagian besar tidak kembali. Para taipan yang membawa uang keluar negeri hidup bebas; rakyat menanggung inflasi 78% dan PHK massal. Skandal BLBI kemudian jadi daftar panjang impunitas oligarki yang tidak pernah benar-benar dituntaskan hingga kini.
  source_ids:
    - buku-kahin-nationalism-revolution-1952
    - buku-ricklefs-history-modern-indonesia-1981
  dimension_ids:
    - negara-hukum
    - sila-5
- id: ev-soeharto-udin-jurnalis
  term_id: presiden-soeharto
  date: 1996-08
  category: krisis
  title_id: Pembunuhan jurnalis Udin di Yogyakarta
  summary_id: "10 Agustus 1996, wartawan Monitor Fuad Muhammad Syafruddin yang gali korupsi bupati Bantul ditusuk di depan rumahnya. Seorang buruh bangunan disiksa hingga mengaku, lalu dibebaskan pengadilan karena keterangannya dipaksakan. Pembunuh sejati dan otaknya tak pernah ditemukan. Kasus Udin menjadi simbol abadi: membongkar korupsi di era Orde Baru bisa berarti mati, dan negara melindungi pembunuhnya lebih baik daripada saksi."
  source_ids:
    - berita-udin-1996
  dimension_ids:
    - sila-4
    - sila-2
- id: ev-megawati-sampit-sambas
  term_id: presiden-megawati
  date: 2001-02
  category: krisis
  title_id: Kerusuhan Sampit dan Sambas - konflik Dayak-Madura
  summary_id: Melanjutkan Sambas 1999, kerusuhan Sampit Februari-Maret 2001 menewaskan setidaknya lima ratus orang dan memaksa puluhan ribu etnis Madura mengungsi permanen dari Kalimantan Tengah. Kekerasan paling brutal antaretnis era Reformasi ini berakhir bukan lewat penegakan hukum melainkan karena satu kelompok berhasil dibersihkan dari wilayahnya - perdamaian tanpa keadilan yang menjadi template konflik agraria-etnis berikutnya.
  source_ids:
    - buku-kahin-nationalism-revolution-1952
    - buku-ricklefs-history-modern-indonesia-1981
  dimension_ids:
    - sila-2
    - sila-3
- id: ev-sby1-tsunami-aceh-respons
  term_id: presiden-sby-i
  date: 2004-12
  category: krisis
  title_id: Gempa dan tsunami Samudra Hindia - respons bencana terbesar republik
  summary_id: "26 Desember 2004, gempa M9,1 dan tsunami menewaskan sekitar 167 ribu orang di Aceh dan Nias - bencana nasional terbesar sepanjang ingatan. Indonesia membuka pintu bantuan dunia, TNI berubah fungsi menjadi logistik kemanusiaan, dan rekonstruksi via BRR Aceh-Nias dijalankan relatif bersih dibanding standar saat itu. Dari puing-puing juga lahir damai: bencana yang sama-sama diderita membuka jalan MoU Helsinki tujuh bulan kemudian."
  source_ids:
    - buku-kahin-nationalism-revolution-1952
    - buku-ricklefs-history-modern-indonesia-1981
    - mou-helsinki-2005
  dimension_ids:
    - tujuan-1
- id: ev-sby1-uuguru-dosen
  term_id: presiden-sby-i
  date: 2005-12
  category: produk-hukum
  title_id: UU Guru dan Dosen No. 14/2005
  summary_id: "Diundangkan 14 Desember 2005 dengan janji megah: tunjangan profesi sebesar gaji pokok bagi semua guru - gaji guru naik dua kali lipat. Empat belas tahun kemudian jutaan guru non-PNS masih menunggu janji itu penuh; sertifikasi mengubah status tanpa mengubah mutu kelas secara signifikan menurut berbagai studi. UU yang dimaksudkan mencerdaskan justru menjadi contoh bagaimana anggaran besar tanpa desain insentif hanya menghasilkan birokrasi baru."
  source_ids:
    - uu-14-2005
  dimension_ids:
    - tujuan-3
- id: ev-sby2-gayus-pajak
  term_id: presiden-sby-ii
  date: "2010"
  category: krisis
  title_id: Kasus Gayus Tambunan - mafia pajak yang berlibur
  summary_id: Pajak rendahan Gayus Tambunan terbongkar menerima miliaran dari perusahaan, lalu dunia dikejutkan foto dirinya berlibur ke Bali dan Gili saat statusnya tahanan - bukti telanjang bahwa uang bisa membeli penjara. Jaringannya menyentuh polisi, jaksa, hakim, dan advokat. Reformasi DJP diluncurkan setelahnya; kepercayaan publik kepada sistem perpajakan dan penegakan hukum tidak pernah benar-benar pulih.
  source_ids:
    - berita-gayus-2010
  dimension_ids:
    - negara-hukum
    - sila-1
- id: ev-sby2-hambalang
  term_id: presiden-sby-ii
  date: 2013-01
  category: krisis
  title_id: Korupsi proyek Hambalang Rp2,5 triliun
  summary_id: Proyek pusat pelatihan atlet nasional membengkak menjadi sekitar Rp2,5 triliun penuh mark-up; KPK menetapkan pejabat Kemenpora dan kontraktor sebagai tersangka, termasuk politisi senior partai penguasa. Dana yang seharusnya mencetak medali habis di rekening. Hambalang menjadi lambang bagaimana anggaran prestasi olahraga Indonesia dibunuh oleh rakusnya pengelolanya sendiri - dua dekade kemudian hasilnya masih kita tanggung.
  source_ids:
    - berita-hambalang-2013
  dimension_ids:
    - negara-hukum
- id: ev-jokowi1-paris-agreement
  term_id: presiden-jokowi-i
  date: 2016-10
  category: produk-hukum
  title_id: Indonesia meratifikasi Paris Agreement lebih awal
  summary_id: "Oktober 2016, DPR mengesahkan UU No. 16/2016 sehingga Indonesia masuk jajaran negara pertama yang meratifikasi Paris Agreement sebelum perjanjian itu berlaku efektif - diklaim sebagai negara berkembang pertama lewat jalur parlemen. Komitmen NDC: menurunkan emisi hingga 29% sendiri, 41% dengan bantuan internasional pada 2030. Realisasinya masih diperdebatkan tiap tahun; tetapi secara hukum, Indonesia mengikat dirinya ke rezim iklim global."
  source_ids:
    - uu-16-2016
  dimension_ids:
    - tujuan-4
- id: ev-jokowi2-kip-kuliah
  term_id: presiden-jokowi-ii
  date: "2020"
  category: kebijakan
  title_id: Peluncuran KIP Kuliah
  summary_id: "Tengah pandemi, pemerintah melebur Bidikmisi dan berbagai beasiswa menjadi satu KIP Kuliah: biaya kuliah ditanggung penuh plus biaya hidup bagi mahasiswa dari keluarga tidak mampu. Dalam beberapa tahun jumlah penerima melonjak hingga jutaan per angkatan - salah satu program afirmasi pendidikan tinggi terbesar di Asia Tenggara. Tantangan klasik menyusul: data penerima yang bocor dijual daring, dan mutu lulusan yang tak otomatis ikut naik bersama kuotanya."
  source_ids:
    - kip-kuliah-2020
  dimension_ids:
    - tujuan-3
- id: ev-jokowi2-jiwasraya-vonis
  term_id: presiden-jokowi-ii
  date: 2022-03
  category: pengadilan
  title_id: Vonis Jiwasraya - Rp16,8 triliun hilang di asuransi negara
  summary_id: "Maret 2022 majelis hakim menjatuhkan vonis dalam skandal investasi PT Asuransi Jiwasraya: kerugian negara Rp16,8 triliun - dana tabungan polis jutaan rakyat yang dipakai saham- sahaman spekulatif oleh eks-direktur dan jaringan broker politik. Salah satu kerugian terbesar dalam sejarah korupsi Indonesia, dan seperti biasa: para eksdir divonis, sementara pertanyaan siapa pemilik kepentingan di baliknya tidak pernah benar-benar dijawab."
  source_ids:
    - berita-jiwasraya-2022
  dimension_ids:
    - negara-hukum
  actor_ids:
    - benny-tjokrosaputro
    - heru-hidayat
    - hendrisman-rahim
- id: ev-jokowi2-revisi-ite-2024
  term_id: presiden-jokowi-ii
  date: 2024-01
  category: produk-hukum
  title_id: Revisi kedua UU ITE (UU No. 1/2024)
  summary_id: Setelah lebih dari 700 orang dipidana lewat pasal karet, revisi kedua UU ITE akhirnya mengubah pencemaran nama baik menjadi delik aduan dan menambah bab "hormat serta privasi". Kemajuannya nyata di atas kertas; praktik lapangan belum banyak berubah - pasal-pasal baru tentang martabat dan privasi justru rawan dipakai cara lama. Perbaikan setengah hati atas luka yang diciptakan undang-undang itu sendiri enam belas tahun sebelumnya.
  source_ids:
    - uu-1-2024
  dimension_ids:
    - sila-4
- id: ev-soekarno1-hatta-mundur
  term_id: presiden-soekarno-i
  date: 1956-12
  category: pengangkatan
  title_id: Mohammad Hatta mengundurkan diri dari wakil presiden
  summary_id: 1 Desember 1956, Bung Hatta meletakkan jabatan - protes tenang atas kultus individu yang tumbuh dan ketidaksetujuan pada arah politik Sukarno. Tanpa wakil presiden, republik kehilangan rem moralnya di detik kritis menjelang Dekrit 1959. Perdebatan apakah Indonesia butuh wakil presiden aktif baru selesai hanya lewat amandemen 44 tahun kemudian.
  source_ids:
