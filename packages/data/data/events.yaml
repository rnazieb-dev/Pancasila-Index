    - kedaulatan-rakyat
- id: ev-soekarno1-kaa
  term_id: presiden-soekarno-i
  date: 1955-04
  category: kebijakan
  title_id: Konferensi Asia-Afrika Bandung
  summary_id: "April 1955, 29 negara Asia-Afrika - mayoritas baru merdeka - berkumpul di Gedung Merdeka Bandung atas prakarsa Indonesia. Komunike sepuluh poinnya menjadi embrio Gerakan Non-Blok dan bahasa bersama dunia ketiga: anti-kolonialisme, perdamaian, kesetaraan bangsa. Nehru, Nasser, Zhou Enlai berjalan bersama di kota yang dingin. Satu-satunya momen Indonesia benar-benar memimpin tatanan dunia - warisan yang masih dikutip diplomat hingga hari ini."
  source_ids:
    - kaa-bandung-1955
  dimension_ids:
    - tujuan-4
- id: ev-soekarno2-dekrit
  term_id: presiden-soekarno-ii
  date: 1959-07
  category: krisis
  title_id: Dekrit Presiden 5 Juli 1959
  summary_id: "Konstituante buntu dua tahun memperdebatkan dasar negara; kabinet jatuh-bangun. Solusinya bukan musyawarah melainkan maklumat: 5 Juli 1959 Sukarno membubarkan Konstituante hasil pemilu, memberlakukan kembali UUD 1945 yang kekuasaan eksekutifnya paling besar. Demokrasi parlementer Indonesia mati bukan oleh kudeta, tapi oleh dekrit - dengan TNI dan PKI berebut mendekat ke pusat kekuasaan baru."
