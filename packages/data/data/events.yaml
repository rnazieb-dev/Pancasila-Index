- id: ev-ma-pembentukan
  term_id: ma-revolusi-liberal
  date: 1946-08
  category: pengangkatan
  title_id: Mahkamah Agung dibentuk lewat UU No. 1 Tahun 1946
  summary_id: Tujuh bulan setelah proklamasi, republik yang sedang berperang tetap
    menulis undang-undang tentang mahkamah agungnya; Sutjipto dilantik sebagai
    ketua pertama. Di masa demokrasi liberal, MA cukup dihormati hingga sanggup
    membebaskan terdakwa yang tidak disukai pemerintah - kenangan yang kelak
    membuat Orde Baru memastikan hal serupa tak terulang.
