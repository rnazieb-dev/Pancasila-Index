- id: ev-megawati-sisdiknas
  term_id: presiden-megawati
  date: 2003-07
  category: produk-hukum
  title_id: UU Sistem Pendidikan Nasional No. 20/2003
  summary_id: "Disahkan 8 Juli 2003, UU Sisdiknas menjadi kerangka induk pendidikan modern: wajib belajar, kurikulum berbasis kompetensi, jaminan anggaran, dan definisi pendidikan yang inklusif. Semua reformasi pendidikan sesudahnya - BOS, Kurikulum Merdeka - berdiri di atas fondasi ini. Kelemahannya juga mewarisi: mutu guru dan hasil belajar tetap menjadi PR yang belum selesai dua dekade kemudian."
  source_ids:
    - uu-20-2003
  dimension_ids:
    - tujuan-3
- id: ev-megawati-sipadan-ligitan
  term_id: presiden-megawati
  date: 2002-12
  category: pengadilan
  title_id: ICJ menangkan Sipadan-Ligitan untuk Indonesia
  summary_id: 17 Desember 2002, Mahkamah Internasional menetapkan kedaulatan dua pulau kecil di Selat Celebes kepada Indonesia, menutup sengketa tiga dekade dengan Malaysia. Kemenangan dibangun bukan dengan kapal perang melainkan dokumen efektifitas pengelolaan sejak era kolonial - kemenangan arsip. Preseden penting bagi seluruh sengketa maritim Nusantara dan bukti bahwa diplomasi hukum adalah senjata negara kepulauan.
  source_ids:
