- id: ev-soekarno2-seumur-hidup
  term_id: presiden-soekarno-ii
  date: 1963-05
  category: produk-hukum
  title_id: TAP MPRS III/MPRS/1963 - Sukarno Presiden Seumur Hidup
  summary_id: "Sidang Istimewa MPRS Mei 1963 menobatkan Sukarno presiden seumur hidup - tanpa pemilu, tanpa batasan, atas nama revolusi. Satu ketetapan menutup seluruh pintu pergantian kekuasaan secara damai selamanya; dua tahun kemudian satu lembar Supersemar membuka pintu itu dengan cara paling berdarah. Pelajaran klasik: kursi tanpa batas waktu selalu berakhir tanpa aturan."
  source_ids:
