- id: ev-mk4-usia-capres
  term_id: mk-2018-2023
  date: 2023-10
  category: pengadilan
  title_id: Putusan MK No. 90/PUU-XI/2023 soal batas usia
  summary_id: 'Atas gugatan Partai Buruh, MK mengubah syarat usia calon
    presiden-wapres: di bawah 40 tahun boleh jika "pernah/sedang menjabat kepala
    daerah yang dipilih pemilu". Pasal itu disusun dalam majelis yang ketuanya
    adalah kakak ipar pasangan calon yang langsung diuntungkan - Gibran
    Rakabuming Raka, wali kota Solo, dicapreskan keesokan harinya. Dua hakim
    menulis dissenting opinion tajam. MKMK kelak menyebut ada konflik
    kepentingan serius yang dilanggar.'
