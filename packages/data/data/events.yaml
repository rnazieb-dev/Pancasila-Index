    - tujuan-3
- id: ev-soeharto-asean-1967
  term_id: presiden-soeharto
  date: 1967-08
  category: kebijakan
  title_id: Pendirian ASEAN - Deklarasi Bangkok
  summary_id: Setelah konfrontasi yang menghancurkan, Indonesia justru menjadi pendiri ASEAN bersama lima tetangga pada 8 Agustus 1967. Dari sini lahir ZOPFAN, TAC 1976, dan arsitektur keamanan regional tempat Jakarta selalu jadi motor. Satu dari sedikit babak dalam sejarah ketika kebijakan luar negeri Indonesia mengubah peta kawasan secara permanen - warisan positif Orde Baru yang tak terbantahkan.
  source_ids:
