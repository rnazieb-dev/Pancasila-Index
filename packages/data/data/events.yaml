- id: ev-dpr04-pilkada-langsung
  term_id: dpr-2004-2009
  date: 2004-09
  category: produk-hukum
  title_id: UU Pemerintahan Daerah - era pilkada langsung dimulai
  summary_id: "UU No. 32/2004 mengoperasionalkan amandemen konstitusi: gubernur-bupati-wali kota dipilih langsung rakyat mulai 2005, mengakhiri era DPRD menunjuk kepala daerah. Legitimasi lokal berubah total; harga-harganya juga muncul - politik uang pilkada dan dinasti daerah yang kini jadi musuh abadi reformasi elektoral."
  source_ids:
    - uu-32-2004
  dimension_ids:
    - sila-4
    - kedaulatan-rakyat
- id: ev-prabowo-kabinet-merah-putih
  term_id: presiden-prabowo
  date: 2024-10
  category: pengangkatan
  title_id: Kabinet Merah Putih dilantik - terbesar sejak Orde Baru
  summary_id: 21 Oktober 2024, Prabowo melantik kabinet dengan puluhan menteri dan pejabat setingkat - total melebihi seratus jabatan, terbesar sejak Orde Baru, termasuk wamen usia 20-an dan koalisi hampir seluruh partai. Efisiensi birokrasi dipertanyakan ekonomi; presiden membela sebagai mesin kerja cepat. Ukuran sebenarnya akan diukur oleh kinerja, bukan jumlah kursi.
  source_ids:
    - berita-kabinet-merah-putih-2024
  dimension_ids:
    - checks-balances
- id: ev-prabowo-oecd
  term_id: presiden-prabowo
  date: 2024-09
  category: kebijakan
  title_id: Indonesia memulai proses aksesi OECD
