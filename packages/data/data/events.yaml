- id: ev-dpr99-uu-polri
  term_id: dpr-1999-2004
  date: 2002-01
  category: produk-hukum
  title_id: UU Kepolisian - Polri resmi lepas dari militer
  summary_id: "Disahkan Januari 2002 menyusul pemisahan Polri dari ABRI sejak April 1999, undang-undang ini menata ulang kepolisian sebagai institusi sipil yang melindungi-mengayomi-melayani masyarakat. Reformasi keamanan paling fundamental pasca-dwifungsi: tentara keluar dari urusan kamtibmas. Implementasinya masih diperjuangkan sampai hari ini - reformasi polri ternyata lebih mudah ditulis daripada dilakukan."
  source_ids:
    - uu-2-2002
  dimension_ids:
    - tujuan-1
    - negara-hukum
- id: ev-jokowi1-pengepungan-kpk
  term_id: presiden-jokowi-i
  date: 2015-01
  category: krisis
  title_id: Pengepungan gedung KPK oleh aparat kepolisian
  summary_id: "18 Januari 2015, beberapa hari setelah KPK menetapkan seorang jenderal bintang tiga tersangka, puluhan aparat Brimob mengepung gedung KPK untuk menangkap dua penyidiknya. Publik menyebutnya hari tergelap antikorupsi; presiden memilih jalan tengah yang tidak menyenangkan siapa pun. Pesan yang tertinggal: lembaga antikorupsi bisa digerogoti bahkan oleh institusi yang seharusnya menjadi sekutunya."
  source_ids:
    - berita-kpk-2015
  dimension_ids:
    - checks-balances
    - negara-hukum
- id: ev-jokowi2-hilirisasi-nikel
  term_id: presiden-jokowi-ii
  date: 2020-01
  category: kebijakan
  title_id: Larangan ekspor bijih nikel dan era hilirisasi paksa
  summary_id: "Januari 2020 larangan ekspor bijih nikel mentah berlaku - WTO sempat memenangkan gugatan atasnya, Indonesia banding dan tetap jalan. Hasilnya nyata: puluhan smelter dibangun, nilai ekspor produk nikel melonjak berpuluh kali lipat, ratusan ribu lapangan kerja industri baru. Bayangannya sama nyata: ekspansi tambah kapal keruk laut, deforestasi Raja Ampat-Halmahera, dan dominasi modal tunggal asing di kawasan industri."
  source_ids:
    - berita-hilirisasi-2020
  dimension_ids:
    - tujuan-2
- id: ev-jokowi2-pemilu-terbesar
  term_id: presiden-jokowi-ii
  date: 2024-02
  category: peristiwa
  title_id: Pemilu 14 Februari 2024 - pemilihan satu hari terbesar dunia
  summary_id: Sehari dalam sebulan penuh, sekitar 204,8 juta pemilih terdaftar memilih lima tingkat jabatan sekaligus di lebih dari 800 ribu TPS - pemilihan umum satu hari terbesar dalam sejarah manusia. Berlangsung damai dan meriah meski korban jiwa petugas logistik serta polemik etika netralitas Anies-Ganjar-Prabowo vs Istana mencoretnya. Kapasitas elektoral republik tak diragukan lagi; mutu integritasnya masih diuji tiap lima tahun.
  source_ids:
    - berita-kpu-2024
    - uu-7-2017
  dimension_ids:
    - sila-4
    - kedaulatan-rakyat
- id: ev-sby1-kur
  term_id: presiden-sby-i
  date: 2007-03
  category: kebijakan
  title_id: Kredit Usaha Rakyat (KUR) diluncurkan nasional
  summary_id: "Maret 2007, KUR menembakkan kredit subsidi ke UMKM dengan bunga tetap rendah dan tanpa agunan untuk plafon tertentu - triliunan rupiah pertama dialirkan pada tahun pertamanya. Program ini menjadi instrumen favorit setiap pemerintah sesudahnya; kritiknya juga turun temurun: penyaluran sering tertukar dengan patronase politik dan banyak penerima tak pernah naik kelas."
  source_ids:
