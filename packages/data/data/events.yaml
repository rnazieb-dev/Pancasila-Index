  date: 2024-11
  category: pengadilan
  title_id: Putusan MK No. 60/PUU-XI/2024 soal ambang batas
  summary_id: "Petisi empat alumni 1998 (termasuk mantan panglima TNI Gatot
    Nurmantyo) berhasil: MK menyatakan ambang batas parlemen 4% inkonstitusional
    untuk pemilu mendatang karena membatasi kedaulatan rakyat tanpa alasan kuat.
    DPR merespons dengan revisi UU Pemilu November 2024 - salah satu kepatuhan
    antarlembaga tercepat atas putusan yang mengurangi kepentingan partai
    penguasa dewan."
