    - sila-3
- id: ev-soekarno1-prri-permesta
  term_id: presiden-soekarno-i
  date: 1958-02
  category: krisis
  title_id: Pemberontakan PRRI/Permesta
  summary_id: Februari 1958, perwira menengah Sumatera Tengah dan Sulawesi Utara memberontak - bukan demi separatisme, melainkan protes dana pembangunan yang tak pernah sampai ke daerah penghasil devisa. Dalam lima bulan pemberontakan militer ditumpam, tetapi keluhannya tidak pernah dijawab; malah jadi dalil bagi sentralisasi makin ketat. PRRI/Permesta adalah tagihan otonomi daerah yang baru dibayar Indonesia empat puluh tahun kemudian.
  source_ids:
    - buku-kahin-nationalism-revolution-1952
    - buku-ricklefs-history-modern-indonesia-1981
  dimension_ids:
