  category: pengangkatan
  title_id: Adies Kadir dilantik hakim konstitusi di tengah kontroversi
  summary_id: "Setelah DPR menetapkan Inosentius Samsul pada Agustus 2025, Komisi
    III mendadak mengganti kuda hitam: uji kelayakan Adies Kadir - Wakil Ketua
    DPR aktif dari partai penguasa - berlangsung kurang dari 30 menit pada 26
    Januari 2026, paripurna menyetujuinya keesokan hari, dan pelantikan
    berlangsung 5 Februari 2026. Akademisi hukum tata negara menyebut prosesnya
    melanggar prinsip transparansi; MKMK memproses laporan etik sementara DPR
    menolak kewenangannya. Politisi berjubah toga resmi duduk di majelis
    penafsir konstitusi."
