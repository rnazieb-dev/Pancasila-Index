- id: ev-soekarno1-madiun
  term_id: presiden-soekarno-i
  date: 1948-09
  category: krisis
  title_id: Peristiwa Madiun 1948
  summary_id: 'September 1948, FDR-PKI mendeklarasikan "Republik Soviet" di Madiun
    saat republik terdesak agresi Belanda. Dalam hitungan pekan, konflik
    bersaudara ini menelan ribuan nyawa dari kedua pihak - eksekusi sandera oleh
    pihak PKI, lalu pemukulan balik oleh Siliwangi dan para komandan republik.
    Luka Madiun menjadi prolog trauma 1965: dua kekerasan besar yang saling
    mengunci ingatan nasional selama setengah abad.'
  source_ids:
    - proklamasi-ppki-1945
  dimension_ids:
    - sila-2
- id: ev-soekarno1-kmb
  term_id: presiden-soekarno-i
  date: 1949-12
  category: kebijakan
  title_id: Konferensi Meja Bundar dan pengakuan kedaulatan
  summary_id: "Setelah empat tahun perang dan diplomasi - dari Linggarjati yang
    diangkat senjata, Renville yang dikhianati, hingga serangan umum 1 Maret
    1949 yang membuat dunia malu - Belanda akhirnya duduk di meja bundar Den
    Haag. 27 Desember 1949 kedaulatan diserahkan. Harga-harganya menyakitkan:
    negara federal RIS sementara dan isu Irian Barat yang ditunda - dua bom
    waktu ketatanegaraan yang meledak bertahun-tahun kemudian."
  source_ids:
    - konferensi-meja-bundar-1949
  dimension_ids:
    - tujuan-1
- id: ev-soekarno1-nkri-uuds
  term_id: presiden-soekarno-i
  date: 1950-08
  category: produk-hukum
  title_id: Kembalinya NKRI dan berlakunya UUDS 1950
  summary_id: "Dalam hitungan bulan, republik menyerap negara-negara bagian RIS -
    sebagian lewat perundingan damai, sebagian lewat tekanan tentara - dan pada
    17 Agustus 1950 kembali menjadi negara kesatuan dengan konstitusi baru
    bergaya parlementer. Demokrasi kabinet lima tahun berikutnya menghasilkan
    tujuh kabinet jatuh-bangun, tapi juga pers bebas, parlemen hidup, dan pemilu
    terbaik di Asia Tenggara. Eksperimen demokrasi pertama: gagal secara
    stabilitas, patut dicontoh secara kebebasan."
  source_ids:
    - uuds-1950
  dimension_ids:
    - negara-hukum
    - checks-balances
- id: ev-soekarno1-pemilu-1955
  term_id: presiden-soekarno-i
  date: 1955-09
  category: peristiwa
  title_id: Pemilu nasional pertama
  summary_id: September sampai Desember 1955, 37 juta pemilih - 91% partisipasi -
    memberikan suara tanpa paksaan di negeri yang separuhnya buta huruf. Empat
    partai besar berbagi suara hampir merata; tidak ada pemenang mutlak, dan
    itulah potret masyarakat Indonesia yang sesungguhnya. Pengamat asing
    menyebutnya pemilu terbersih di Asia pasca-kolonial. Ironisnya, hasilnya
    justru dianggap bencana oleh elite yang ingin Indonesia lebih "tegas" - dan
    delapan tahun kemudian demokrasi ini dimatikan.
  source_ids:
    - pemilu-1955
  dimension_ids:
    - sila-4
    - kedaulatan-rakyat
- id: ev-soekarno1-kaa
  term_id: presiden-soekarno-i
  date: 1955-04
  category: kebijakan
  title_id: Konferensi Asia-Afrika Bandung
  summary_id: "April 1955, 29 negara Asia-Afrika - mayoritas baru merdeka -
    berkumpul di Gedung Merdeka Bandung atas prakarsa Indonesia. Komunike
    sepuluh poinnya menjadi embrio Gerakan Non-Blok dan bahasa bersama dunia
    ketiga: anti-kolonialisme, perdamaian, kesetaraan bangsa. Nehru, Nasser,
    Zhou Enlai berjalan bersama di kota yang dingin. Satu-satunya momen
    Indonesia benar-benar memimpin tatanan dunia - warisan yang masih dikutip
    diplomat hingga hari ini."
  source_ids:
    - kaa-bandung-1955
  dimension_ids:
    - tujuan-4
- id: ev-soekarno2-dekrit
  term_id: presiden-soekarno-ii
  date: 1959-07
  category: krisis
  title_id: Dekrit Presiden 5 Juli 1959
  summary_id: "Konstituante buntu dua tahun memperdebatkan dasar negara; kabinet
    jatuh-bangun. Solusinya bukan musyawarah melainkan maklumat: 5 Juli 1959
    Sukarno membubarkan Konstituante hasil pemilu, memberlakukan kembali UUD
    1945 yang kekuasaan eksekutifnya paling besar. Demokrasi parlementer
    Indonesia mati bukan oleh kudeta, tapi oleh dekrit - dengan TNI dan PKI
    berebut mendekat ke pusat kekuasaan baru."
  source_ids:
    - dekrit-presiden-1959
  dimension_ids:
    - checks-balances
    - negara-hukum
- id: ev-soekarno2-irian-barat
  term_id: presiden-soekarno-ii
  date: 1962-08
  category: kebijakan
  title_id: New York Agreement dan pengembalian Irian Barat
  summary_id: 'Trikora dan diplomasi keras memaksa Belanda menandatangani New York
    Agreement (Agustus 1962): Irian Barat lewat administrasi PBB masuk ke
    Indonesia pada 1963 - penepian kedaulatan paling emosional bagi revolusi.
    Catatan gelapnya menetap: janji penentuan nasib sendiri bagi orang Papua
    baru "dilaksanakan" lewat Pepera 1969 dengan seribu tangan terpilih, proses
    yang dipersoalkan dunia hingga kini.'
  source_ids:
    - new-york-agreement-1962
  dimension_ids:
    - tujuan-1
    - sila-3
- id: ev-soekarno2-konfrontasi
  term_id: presiden-soekarno-ii
  date: 1963-09
  category: kebijakan
  title_id: Dwikora dan konfrontasi dengan Malaysia
  summary_id: '"Ganyang Malaysia" menggerakkan massa sambil menghancurkan ekonomi.
    Konfrontasi militer tiga tahun - penyusupan Kalimantan, serangan Semenanjung
    Singapura, hingga Indonesia keluar dari PBB (1965) - menguras kas negara,
    mengisolasi diplomasi, dan memperkaya para komandan. Warisan yang diterima
    Soeharto adalah kehancuran total: inflasi menuju 600% dan cadangan devisa
    nyaris kosong.'
  source_ids:
    - dwikora-konfrontasi-1963
  dimension_ids:
    - tujuan-4
