- id: ev-soekarno1-madiun
  term_id: presiden-soekarno-i
  date: 1948-09
  category: krisis
  title_id: Peristiwa Madiun 1948
  summary_id: 'September 1948, FDR-PKI mendeklarasikan "Republik Soviet" di Madiun saat republik terdesak agresi Belanda. Dalam hitungan pekan, konflik bersaudara ini menelan ribuan nyawa dari kedua pihak - eksekusi sandera oleh pihak PKI, lalu pemukulan balik oleh Siliwangi dan para komandan republik. Luka Madiun menjadi prolog trauma 1965: dua kekerasan besar yang saling mengunci ingatan nasional selama setengah abad.'
  source_ids:
