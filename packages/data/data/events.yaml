    - sila-3
- id: ev-soeharto-dom-aceh-papua
  term_id: presiden-soeharto
  date: "1989"
  category: krisis
  title_id: Daerah Operasi Militer Aceh dan Papua
  summary_id: "Status DOM diberlakukan di Aceh (1989-1998) dan diperkuat di Papua: pembumian rumah, penyiksaan, hilangnya ribuan orang yang namanya tidak pernah dicatat. Ketika DOM dicabut 1998, mayat massal digali dari bekas markas militer di Aceh. Warisan kebijakan ini - menjawab pemberontakan dengan teror terhadap warga sipil - adalah akar dari luka yang MoU Helsinki hanya sebagian menyembuhkan."
  source_ids:
    - buku-kahin-nationalism-revolution-1952
    - buku-ricklefs-history-modern-indonesia-1981
