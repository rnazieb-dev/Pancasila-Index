- id: ev-soekarno2-supersemar
  term_id: presiden-soekarno-ii
  date: 1966-03
  category: krisis
  title_id: Supersemar
  summary_id: 11 Maret 1966, di tengah rumor kudeta dan suasana panik Istana Bogor, Sukarno menandatangani surat perintah kepada Mayjen Suharto untuk "memulihkan keamanan dan ketertiban". Naskah aslinya hilang - hanya salinan di Arsip Nasional; misteri arsip paling terkenal republik. Dalam sembilan belas bulan, satu lembar surat itu ditafsirkan menjadi mandat membubarkan PKI, membersihkan kabinet, lalu merebut kursi presiden itu sendiri.
