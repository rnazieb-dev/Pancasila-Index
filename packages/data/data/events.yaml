- id: ev-habibie-tap-xvii
  term_id: presiden-habibie
  date: 1998-11
  category: produk-hukum
  title_id: TAP MPR XVII/MPR/1998 tentang Hak Asasi Manusia
  summary_id: 'Empat bulan setelah Soeharto lengser, Sidang Umum MPR mengesahkan piagam HAM nasional yang mengadopsi semangat Deklarasi Universal HAM - dokumen yang 32 tahun dihindari rezim karena dianggap barang "barat". Piagam ini menjadi payung seluruh legislasi HAM berikutnya, dari penguatan Komnas HAM sampai pengadilan HAM ad hoc. Catatan pedasnya: piagam lahir tanpa gigi - negara menandatangani pengakuan pada kertas jauh sebelum pada meja pengadilan.'
  source_ids:
    - tap-mpr-xvii-1998
  dimension_ids:
    - sila-2
    - negara-hukum
- id: ev-habibie-kemerdekaan-sipil
  term_id: presiden-habibie
  date: 1998-10
  category: produk-hukum
  title_id: UU Kemerdekaan Menyatakan Pendapat di Muka Umum
  summary_id: Ditandatangani 20 Oktober 1998, undang-undang ini membebaskan unjuk rasa yang selama Orde Baru diberi label "subversif". Tahanan politik dilepas bertahap; buruh dan mahasiswa kembali boleh berdemo tanpa izin polisi. Dalam hitungan bulan jumlah aksi melonjak dari belasan menjadi ribuan per tahun - ruang sipil paling terbuka sejak 1950-an.
  source_ids:
    - uu-9-1998
  dimension_ids:
    - sila-4
    - negara-hukum
- id: ev-habibie-referendum-timtim
  term_id: presiden-habibie
  date: 1999-05
  category: kebijakan
  title_id: Konsultasi Rakyat Timor Timur
  summary_id: "Keputusan yang membuat Habibie dicemooh elite Jakarta tetapi disegani dunia: setelah 23 tahun integrasi berdarah, nasib Timor Timur diserahkan ke kotak suara lewat kesepakatan tripartit Indonesia-Portugal-PBB (5 Mei 1999). Pada 30 Agustus 1999, 78,5% memilih merdeka - diikuti gelombang kehancuran oleh milisi pro-integrasi. Prosedurnya damai, pelaksanaannya tragis."
  source_ids:
    - tripartit-timtim-1999
  dimension_ids:
    - sila-3
    - tujuan-4
    - kedaulatan-rakyat
- id: ev-habibie-pemilu-1999
  term_id: presiden-habibie
  date: 1999-06
  category: peristiwa
  title_id: Pemilu multipartai pertama pasca-Orde Baru
  summary_id: "7 Juni 1999: 48 partai bertanding dan untuk pertama kali sejak 1955 rakyat memilih tanpa asas tunggal dan tanpa Golkar yang menang otomatis. PDI-P menang 33,7%; Golkar jatuh ke 22,4% - kalah pertama dalam enam pemilu. Pengamat internasional menyebutnya bebas dan adil meski kerusuhan Kupang dan Atambua meninggalkan luka. Inilah fondasi legitimasi demokrasi modern Indonesia."
  source_ids:
    - uu-3-1999
  dimension_ids:
    - sila-4
    - kedaulatan-rakyat
- id: ev-habibie-otda
  term_id: presiden-habibie
  date: 1999-05
  category: produk-hukum
  title_id: UU Otonomi Daerah dan Perimbangan Keuangan
  summary_id: "Reaksi cepat atas pelajaran sentralisasi: saat Jakarta runtuh, Aceh, Papua, dan Riau menyuarakan perpisahan. UU No. 22 dan No. 25 Tahun 1999 membalik logika Orde Baru - daerah mengurus semua urusan kecuali yang eksplisit dipusatkan, lengkap dengan bagi hasil SDA. Implementasinya kacau di banyak tempat, namun arah desentralisasi tak pernah bisa dibalik lagi."
  source_ids:
    - uu-22-1999
    - uu-25-1999
  dimension_ids:
    - sila-3
    - tujuan-3
- id: ev-habibie-uu-pers-ham
  term_id: presiden-habibie
  date: 1999-09
  category: produk-hukum
  title_id: UU Pers dan UU Hak Asasi Manusia
  summary_id: Dua undang-undang kembar ditetapkan 23 September 1999, hari-hari terakhir Habibie di Istana. UU Pers membunuh SIUPP - izin terbit yang bisa dicabut sewaktu-waktu, senjata pembredelan Soeharto - dan menggantinya dengan hak jawab. UU HAM memberi Komnas HAM mandat penyelidikan formal. Pers Indonesia melonjak dari satu dominasi menjadi ribuan media dalam lima tahun.
  source_ids:
    - uu-40-1999
    - uu-39-1999
  dimension_ids:
    - sila-4
    - sila-2
    - tujuan-3
- id: ev-gusdur-depen
  term_id: presiden-gusdur
  date: 1999-10
  category: kebijakan
  title_id: Pembubaran Departemen Penerangan
  summary_id: 'Dalam pekan pertama jabatannya, Gus Dur membubarkan departemen yang 54 tahun menjadi corong propaganda negara - dari manipulasi era konfrontasi hingga pencucian otak Orde Baru. Ribuan pegawai Depen kehilangan fungsi; pers bebas mewarisi tugas "penerangan". Simbolisme yang tajam: negara mengakui bahwa informasi milik warga, bukan monopoli istana.'
  source_ids:
    - keppres-125-1999
  dimension_ids:
    - sila-4
    - negara-hukum
- id: ev-gusdur-imlek
  term_id: presiden-gusdur
  date: 2000-01
  category: kebijakan
  title_id: Keppres 6/2000 - Imlek dirayakan terbuka
  summary_id: 17 Januari 2000, Gus Dur mencabut Inpres 14/1967 yang membatasi agama, kepercayaan, dan tradisi Tionghoa. Imlek kembali menjadi hari raya nasional setelah 32 tahun harus dirayakan diam-diam; barongsai yang dulu diburu polisi tampil di istana. Satu keputusan presiden menghapus tiga dekade diskriminasi budaya - bukti bahwa pelarasan bisa sesederhana itu.
  source_ids:
    - keppres-6-2000
  dimension_ids:
    - sila-1
    - sila-3
    - tujuan-3
    - negara-hukum
- id: ev-gusdur-ssm
  term_id: presiden-gusdur
  date: 2001-07
  category: krisis
  title_id: Sidang Istimewa MPR memberhentikan Presiden Wahid
  summary_id: Konflik Gus Dur-DPR yang memanas sepanjang 2001 - dari Buloggate hingga ancaman mendekrit - berakhir di Sidang Istimewa MPR 23 Juli 2001. Presiden pertama hasil pemilu bebas diberhentikan lewat prosedur konstitusi, bukan tank di jalan. Kritikus menyebutnya kudeta berjubah toga; pembelanya menyebut dewasanya checks and balances. Keduanya benar sekaligus.
  source_ids:
    - tap-mpr-iii-2001
  dimension_ids:
    - checks-balances
    - sila-4
    - kedaulatan-rakyat
- id: ev-megawati-pengadilan-timtim
  term_id: presiden-megawati
  date: 2001-12
  category: pengadilan
  title_id: Pengadilan HAM Ad Hoc Timor Timur dibentuk
  summary_id: 'Keppres 53/2001 membentuk pengadilan ad hoc untuk kekerasan pasca-jajak pendapat 1999. Hasilnya memalukan: dari 18 tertuduhan, semua pejabat Indonesia dibebaskan atau bebas banding, sementara dua orang Timor Leste jadi kambing hitam. PBB menyebut prosesnya "secara sistematik gagal menegakkan keadilan" - contoh klasik bagaimana negara bisa punya pengadilan tanpa punya keinginan menghukum.'
  source_ids:
    - keppres-53-2001
  dimension_ids:
    - sila-2
    - tujuan-4
- id: ev-megawati-kpk
  term_id: presiden-megawati
  date: 2002-12
  category: produk-hukum
  title_id: UU Komisi Pemberantasan Korupsi
  summary_id: 'Disahkan 27 Desember 2002 di tengah skeptisisme parlemen sendiri, UU ini melahirkan KPK dengan kewenangan super: penyadapan, penangkapan, dan penuntutan dalam satu atap - hal yang ditolak elite karena "berbahaya bagi politisi". Delapan tahun kemudian KPK memenjarakan ketua partai penguasa parlemen. Institusi antikorupsi paling ditakuti Asia Tenggara lahir dari rezim yang tidak terkenal bersih.'
  source_ids:
    - uu-30-2002
  dimension_ids:
    - negara-hukum
- id: ev-megawati-presiden-langsung
  term_id: presiden-megawati
  date: 2003-07
  category: produk-hukum
  title_id: UU Pemilihan Presiden dan Wakil Presiden
  summary_id: "Disahkan Juli 2003, undang-undang ini menerjemahkan amandemen ketiga konstitusi menjadi mesin elektoral: rakyat langsung memilih presiden, bukan lagi MPR. Ironi sejarahnya tebal - Megawati menandatangani aturan yang setahun kemudian menjatuhkannya lewat kotak suara rakyat, kalah telak dari SBY. Negara yang matang adalah yang pemimpinnya rela dikalahkan oleh aturan yang ia buat sendiri."
  source_ids:
    - uu-23-2003
  dimension_ids:
    - kedaulatan-rakyat
    - sila-4
- id: ev-megawati-antiteror
  term_id: presiden-megawati
  date: 2003-04
  category: produk-hukum
  title_id: UU Pemberantasan Tindak Pidana Terorisme
  summary_id: 'Bom Bali 12 Oktober 2002 - 202 korban jiwa - memaksa legislasi kilat lewat Perppu yang kemudian menjadi UU No. 15/2003. Hasilnya nyata: Densus 88 dibentuk, jaringan JI dibongkar, para pelaku dieksekusi. Harga-harganya juga nyata: definisi terorisme yang luas kelak menjadi preseden perluasan makna "ancaman" dalam hukum pidana Indonesia.'
  source_ids:
    - uu-15-2003
  dimension_ids:
    - tujuan-1
- id: ev-megawati-mk-dilantik
  term_id: presiden-megawati
  date: 2003-08
  category: pengangkatan
  title_id: Majelis Mahkamah Konstitusi pertama dilantik
  summary_id: "13 Agustus 2003, sembilan hakim dari tiga jalur (MA, DPR, Presiden) dilantik - realisasi janji amandemen yang tertunda dua tahun. MK langsung membuktikan diri: dalam bulan-bulan pertamanya menerima puluhan permohonan uji UU dan membuka sidang kepada publik, sesuatu yang belum pernah dilakukan MA. Penjaga konstitusi resmi lahir; sejarah membuktikan ia akan menjadi lembaga paling digemari sekaligus paling digoda politik."
  source_ids:
    - uu-24-2003
  dimension_ids:
    - checks-balances
- id: ev-sby1-log-aceh
  term_id: presiden-sby-i
  date: 2006-07
  category: produk-hukum
  title_id: UU Pemerintahan Aceh
  summary_id: "Disahkan 11 Juli 2006, undang-undang ini menerjemahkan MoU Helsinki menjadi hukum: Aceh jadi satu-satunya provinsi dengan partai lokal, menerima dana otonomi khusus 2% APBN selama 15 tahun, dan pilkada pertamanya dimenangkan mantan panglima GAM Irwandi Yusuf. Provinsi paling militeristik Indonesia berubah menjadi laboratorium perdamaian - meski paket syariat yang menyertainya memunculkan pertanyaan baru tentang perlindungan minoritas."
  source_ids:
    - uu-11-2006
  dimension_ids:
    - sila-3
    - sila-4
    - kedaulatan-rakyat
- id: ev-sby1-ite
  term_id: presiden-sby-i
  date: 2008-03
  category: produk-hukum
  title_id: UU Informasi dan Transaksi Elektronik disahkan
  summary_id: 'Dirancang untuk kepastian ekonomi digital, UU No. 11/2008 justru melahirkan instrumen lain: Pasal 27 ayat (3) tentang "berita bohong" dan pasal karet lainnya tanpa definisi tegas. Dalam satu dekade lebih dari 400 orang dilaporkan pidana karena unggahan - dari pengkritik kepala daerah sampai tetangga yang bertengkar. Kepastian hukum bagi e-commerce dibayar mahal oleh kebebasan berekspresi warga.'
  source_ids:
    - uu-11-2008
  dimension_ids:
    - sila-4
    - kedaulatan-rakyat
- id: ev-sby1-antirasial
  term_id: presiden-sby-i
  date: 2008-10
  category: produk-hukum
  title_id: UU Penghapusan Diskriminasi Rasial dan Etnik
  summary_id: "Setelah enam dekade konstitusi menjanjikan kesetaraan, akhirnya lahir instrumen pidana anti-diskriminasi (UU No. 40/2008) - lanjutan logis pencabutan SBKRI pada 2003. Implementasinya lesu: segelintir perkara sejak disahkan, sementara diskriminasi bergeser ke praktik administratif harian. Namun fondasinya tertanam permanen: negara tak lagi punya dasar hukum untuk membedakan warganya."
  source_ids:
    - uu-40-2008
  dimension_ids:
    - sila-3
- id: ev-sby1-century
  term_id: presiden-sby-i
  date: 2008-11
  category: krisis
  title_id: Bailout Bank Century Rp6,7 triliun
  summary_id: November 2008, pemerintah menyelamatkan bank mungil milik Robert Tantular dengan Rp6,7 triliun - sepuluh kali lipat rencana awal Rp620 miliar. Dana menguap, pemiliknya sempat melarikan diri, dan pansus DPR terbelah persis di garis koalisi saat memvonis bailout itu "tidak salah hukum". Tidak ada pejabat tinggi yang dimintai pertanggungjawaban. Century adalah pelajaran abadi tentang bagaimana akuntabilitas bisa dikalahkan oleh aritmetika kursi parlemen.
  source_ids:
    - laporan-bpk-century
  dimension_ids:
    - negara-hukum
    - sila-4
- id: ev-sby2-tppu
  term_id: presiden-sby-ii
  date: 2010-10
  category: produk-hukum
  title_id: UU Pencegahan dan Pemberantasan Pencucian Uang
  summary_id: "Revisi total rezim antimonecucian memberi PPATK akses analisis transaksi finansial yang lebih luas dan menjadikan pencucian uang tindak pidana mandiri - tak perlu menunggu kejahatan asal terbukti. Instrumen ini kelak menjadi mata-mata paling efektif aparat antikorupsi: mayoritas tersangka korupsi besar jatuh bukan karena tertangkap tangan, melainkan karena jejak rupiahnya."
  source_ids:
    - uu-8-2010
  dimension_ids:
    - negara-hukum
- id: ev-sby2-bpjs
  term_id: presiden-sby-ii
  date: 2011-11
  category: produk-hukum
  title_id: UU Badan Penyelenggara Jaminan Sosial
  summary_id: "Perjuangan sembilan tahun pasca-amandemen Pasal 34 menghasilkan UU No. 24/2011: BPJS Kesehatan dan BPJS Ketenagakerjaan. Pengusaha dan asuransi swasta melobi keras menolaknya; serikat buruh turun ke jalan memperjuangkannya. Saat beroperasi, JKN menjadi skema asuransi kesehatan tunggal terbesar di dunia - kini melebihi 200 juta peserta. Tulang punggung negara kesejahteraan Indonesia akhirnya ada."
  source_ids:
    - uu-24-2011
  dimension_ids:
    - sila-5
    - tujuan-2
    - tujuan-1
- id: ev-sby2-moratorium-hutan
  term_id: presiden-sby-ii
  date: 2011-05
  category: kebijakan
  title_id: Moratorium izin hutan alam primer dan gambut
  summary_id: "Buah dari kerja sama iklim Norwegia senilai US$1 miliar, Inpres No. 10/2011 membekukan izin baru pada sekitar 64 juta hektare hutan primer dan gambut - diperpanjang berkala hingga 2019. Emisi deforestasi melambat nyata meski bocornya izin di lapangan tak kunjung kering. Preseden internasional penting: negara berkembang membuktikan hutan bisa menjadi aset iklim, bukan sekadar tambang kayu."
  source_ids:
    - inpres-10-2011
  dimension_ids:
    - tujuan-4
    - tujuan-3
- id: ev-sby2-md3
  term_id: presiden-sby-ii
  date: 2014-04
  category: produk-hukum
  title_id: UU MD3 memperkuat elite parlemen
  summary_id: 'Digodok tanpa sorotan lalu disahkan April 2014, UU No. 17/2014 mengangkat MPR-DPR-DPD menjadi "lembaga negara" dengan anggaran raksasa dan hak inisiatif RUU. Pimpinan dewan mendapat kekuasaan alokasi masif; anggota biasa meredup; publik nyaris tak tahu undang-undang ini lahir. Contoh sempurna legislasi melayani diri sendiri: aturan yang ditulis elite, untuk elite, oleh elite.'
  source_ids:
    - uu-17-2014
  dimension_ids:
    - checks-balances
    - kedaulatan-rakyat
- id: ev-jokowi1-dana-desa
  term_id: presiden-jokowi-i
  date: 2015-01
  category: kebijakan
  title_id: Dana Desa mulai mengalir besar-besaran
  summary_id: "Maret 2015, Rp20 triliun pertama mengalir ke 74 ribu desa - transfer fiskal langsung terbesar dalam sejarah republik, terus naik hingga lebih dari Rp100 triliun setahun. Ratusan ribu kilometer jalan desa dibangun; kasus korupsi kepala desa juga membubung ratusan tersangka per tahun. Eksperimen paling ambisius ini membuktikan dua hal sekaligus: negara sanggup sampai ke pelosok, dan pengawasan belum sanggup mengikutinya."
  source_ids:
    - uu-6-2014
  dimension_ids:
    - sila-5
- id: ev-jokowi1-eksekusi-narkoba
  term_id: presiden-jokowi-i
  date: 2015-01
  category: peristiwa
  title_id: Gelombang eksekusi mati narkotika
  summary_id: 18 Januari 2015 enam orang ditembak mati di Nusakambangan - eksekusi pertama setelah moratorium empat tahun - disusul gelombang April dengan delapan orang, termasuk enam warga asing dari Bali Nine. Brazil dan Australia menarik dutanya; PBB dan Komnas HAM memprotes keras. Jokowi bertahan dengan narasi "krisis narkoba", sementara proses hukum para terpidana dipertanyakan karena akses advokat dan ujian clemensi yang sempit.
  source_ids:
    - laporan-komnas-ham-eksekusi-2015
  dimension_ids:
    - sila-2
- id: ev-jokowi1-perluasan-pkh
  term_id: presiden-jokowi-i
  date: 2017-08
  category: kebijakan
  title_id: Perluasan Program Keluarga Harapan nasional
  summary_id: "Perpres 63/2017 melembagakan PKH - bantuan tunai bersyarat ala Brasil dan Meksiko - menjadi program nasional: dari 800 ribu keluarga (2014) menjadi 10 juta keluarga. Ibu hamil wajib imunisasi, anak wajib sekolah; pelanggarannya memotong bantuan. Evaluasi mencatat stunting dan putus sekolah menurun di rumah tangga penerima. Kelemahan klasiknya tetap data kemiskinan yang usang, membuat jutaan orang layak tak terdaftar."
  source_ids:
    - perpres-63-2017
  dimension_ids:
    - sila-5
    - tujuan-2
- id: ev-jokowi1-aksi-2019
  term_id: presiden-jokowi-i
  date: 2019-09
  category: peristiwa
  title_id: Aksi mahasiswa nasional dan penindakannya
  summary_id: "September 2019, mahasiswa dan warga di puluhan kota turun menolak revisi UU KPK dan RKUHP - aksi terbesar sejak 1998. DPR akhirnya menunda penetapan RKUHP, tapi revisi KPK sudah sah. Komnas HAM mencatat ratusan mahasiswa terluka akibat tembakan gas dan pemukulan aparat di Jakarta, Bandung, Makassar, Kendari. Pesannya jelas: jalan bisa mengalahkan agenda parlemen, tapi selalu dengan risiko darah."
  source_ids:
    - laporan-komnas-ham-aktivis-2019
  dimension_ids:
    - sila-4
    - sila-2
- id: ev-jokowi2-shutdown-papua
  term_id: presiden-jokowi-ii
  date: 2019-08
  category: kebijakan
  title_id: Pembatasan akses internet di Papua
  summary_id: Pasca-kerusuhan Surabaya atas rasisme terhadap mahasiswa Papua, pemerintah memblokir internet di Papua dan Papua Barat selama berpekan - shutdown terbesar dalam sejarah Indonesia. Koalisi LSM membawanya ke pengadilan; MK menyatakan pemutusan sepihak tanpa dasar hukum inkonstitusional (2020). Negara memilih memutus mata dan telinga warga ketika cerita yang menyebar tidak sesuai versi resmi.
  source_ids:
    - laporan-lsm-kebebasan-sipil-2019-2024
  dimension_ids:
    - sila-4
    - sila-3
- id: ev-jokowi2-ciptaker
  term_id: presiden-jokowi-ii
  date: 2020-02
  category: produk-hukum
  title_id: Proses omnibus UU Cipta Kerja
  summary_id: 'Ribuan pasal dari puluhan UU dilebur jadi satu paket 944 halaman dalam hitungan bulan. Partisipasi publik nyaris nol: draf tidak dipublikasikan tuntas, pendapat ditampung simbolik. Buruh menggelar mogok nasional Oktober 2020; MK kemudian menyatakannya "inkonstitusional bersyarat" karena cacat formal. Preseden paling telanjang tentang bagaimana efisiensi bisa dibunuhnya prosedur demokrasi.'
  source_ids:
    - uu-11-2020
  dimension_ids:
    - checks-balances
    - sila-4
- id: ev-jokowi2-respons-pandemi
  term_id: presiden-jokowi-ii
  date: 2020-03
  category: krisis
  title_id: Penanganan pandemi COVID-19
  summary_id: "Respons awal lambat - presiden lebih dulu sibuk meremehkan virus di Januari 2020 - hingga kasus meledak Maret. Lalu negara banting setir: Perppu 1/2020 membuka belanja Rp1.700 triliun, PSBB-PKKM diselenggarakan, bansos mengalir ke puluhan juta keluarga, vaksinasi massal menyentuh 200 juta dosis dalam satu tahun. Akhirnya salah satu respons kesehatan publik terbesar dalam sejarah republik - dengan catatan transparansi data awal yang buruk dan korupsi bansos daerah yang merajalela."
  source_ids:
    - uu-2-2020
  dimension_ids:
    - tujuan-1
    - sila-5
- id: ev-jokowi2-perppu-ciptaker
  term_id: presiden-jokowi-ii
  date: 2022-12
  category: produk-hukum
  title_id: Perppu Cipta Kerja diterbitkan sebelum revisi selesai
  summary_id: "Tepat dua tahun setelah putusan MK, 30 Desember 2022, pemerintah menerbitkan Perppu No. 2/2022 yang menetapkan substansi lama menjadi berlaku kini - padahal revisi UU belum tuntas dan uji materi atas Perppu masih akan diajukan. DPR mempercepat persetujuan. Langkah ini dibaca luas sebagai jawaban eksekutif kepada penjaga konstitusi: putusan Anda benar, tapi kami tetap jalan."
  source_ids:
    - perppu-2-2022
  dimension_ids:
    - negara-hukum
    - checks-balances
- id: ev-jokowi2-uu-ciptaker-permanen
  term_id: presiden-jokowi-ii
  date: 2023-03
  category: produk-hukum
  title_id: DPR menetapkan Perppu Cipta Kerja menjadi UU
  summary_id: "31 Maret 2023, DPR mengesahkan Perppu menjadi UU No. 6/2023 meski sejumlah gugatan uji materi atas Perppu itu masih hidup di MK. Hakim konstitusi sendiri sempat mempertanyakan mengapa pengesahan tidak menunggu putusan. Dengan ini lingkaran tertutup: cacat proses yang ditegaskan MK pada 2021 kini menjadi hukum permanen tanpa perbaikan prosedur apa pun."
  source_ids:
    - uu-6-2023
  dimension_ids:
    - negara-hukum
    - checks-balances
- id: ev-jokowi2-ikn
  term_id: presiden-jokowi-ii
  date: 2022-01
  category: produk-hukum
  title_id: UU Ibu Kota Negara disahkan
  summary_id: "Disahkan 18 Januari 2022 dalam hitungan pekan, UU No. 3/2022 memindahkan ibu kota ke Nusantara, Kalimantan Timur - proyek strategis terbesar pasca-Reformasi dengan estimasi Rp466 triliun. Argumennya kuat: pemerataan keluar dari Jawa, ikut risiko Jakarta tenggelam. Prosesnya lemah: RUU digodok kilat, kajian alternatif tak dipublikasikan, dan beban fiskal di tengah pemulihan pandemi diperdebatkan akademisi fiskal."
  source_ids:
    - uu-3-2022
  dimension_ids:
    - tujuan-2
    - kedaulatan-rakyat
- id: ev-jokowi2-whoosh
  term_id: presiden-jokowi-ii
  date: 2023-10
  category: kebijakan
  title_id: Kereta cepat Whoosh mulai operasi komersial
  summary_id: "2 Oktober 2023, presiden naik kereta cepat pertama Asia Tenggara dari Halim ke Padalarang, 142 km ditempuh dalam sekitar 45 menit. Whoosh adalah simbol ambisi infrastruktur Jokowi - dan simbol polemiknya juga: biaya membengkak dari US$6 miliar, utang korporasi ke Tiongkok yang dibayar negara saat gagal bayar, serta pertanyaan apakah proyek prestise ini layak dibandingkan investasi transportasi massal Jabodetabek yang lebih menyentuh jutaan rakyat."
  source_ids:
    - whoosh-kcjb-2023
  dimension_ids:
    - tujuan-2
- id: ev-jokowi2-dinasti-politik
  term_id: presiden-jokowi-ii
  date: 2024-02
  category: peristiwa
  title_id: Konsolidasi politik dinasti keluarga presiden petahana
  summary_id: "Trilogi yang mengubah lanskap elektoral: Putusan MK 90/2023 membuka jalan Gibran Rakabuming (36 tahun) menjadi cawapres; Kaesang Pangarep merebut kursi ketua umum PSI (2023); Bobby Nasution dilantik gubernur Sumatera Utara (2025) usai menjabat walikota Medan. Keluarga petahana kini menguasai tiga level eksekutif sekaligus. Pengamat tata negara menyebutnya pewarisan kekuasaan paling sistematis sejak Orde Baru - sah secara prosedur, meragukan secara semangat konstitusi."
  source_ids:
    - putusan-mk-90-2023
    - mkmk-anwar-usman-2023
    - berita-dinasti-politik-2024
  dimension_ids:
    - kedaulatan-rakyat
    - negara-hukum
- id: ev-prabowo-mbg
  term_id: presiden-prabowo
  date: 2025-01
  category: kebijakan
  title_id: Program Makan Bergizi Gratis dimulai
  summary_id: "6 Januari 2025, program andalan Prabowo beroperasi: makan bergizi gratis untuk pelajar, santri, ibu hamil, dan balita melalui Badan Gizi Nasional. Target akhir 80 juta penerima dengan anggaran yang bisa mencapai Rp400+ triliun per tahun - program sosial tunggal termahal dalam sejarah Indonesia. Capaian gizi awal nyata di dapur-dapur SPPG; tantangannya serius: kasus keracunan massal berulang, struktur biaya yang belum efisien, dan pertanyaan apakah APBN sanggup menanggungnya."
  source_ids:
    - perpres-83-2024
  dimension_ids:
    - sila-5
    - tujuan-2
    - tujuan-3
- id: ev-prabowo-danantara
  term_id: presiden-prabowo
  date: 2025-02
  category: produk-hukum
  title_id: UU Badan Pengelola Investasi Danantara
  summary_id: '24 Februari 2025 lahir Daya Anagata Nusantara: holding aset BUMN senilai sekitar Rp10.000 triliun - salah satu dana kedaulatan terbesar dunia - dijalankan di luar mekanisme BUMN biasa. Laporan keuangannya tidak wajib diaudit BPK; presiden dan menteri menduduki posisi penasihat. ICW dan ekonomi menyebutnya potensi "zona abu-abu akuntabilitas" terbesar dekade ini. Sejarah SOE Indonesia memberi alasan untuk waspada.'
  source_ids:
    - uu-danantara-2025
  dimension_ids:
    - negara-hukum
    - checks-balances
    - sila-3
- id: ev-prabowo-agustus-2025
  term_id: presiden-prabowo
  date: 2025-08
  category: krisis
  title_id: Gelombang protes nasional Agustus 2025
  summary_id: "Kematian Affan Kurniawan - ojek daring yang dilindas kendaraan Brimob saat aksi 28 Agustus - menyulut kemarahan nasional terbesar era Prabowo. Aksi meluas dari tunjangan DPR ke isu pengangguran dan kesenjangan; gedung DPRD di beberapa daerah dibakar; Komnas HAM mencatat sepuluh korban jiwa dan ribuan luka dalam penindakan. Presiden membatalkan sejumlah fasilitas pejabat dan menahan beberapa polisi. Titik uji klasik: apakah reformasi polri akhirnya benar-benar dimulai."
  source_ids:
    - komnas-ham-protes-agustus-2025
  dimension_ids:
    - sila-2
    - sila-4
- id: ev-dpr99-amandemen-uud
  term_id: dpr-1999-2004
  date: 2002-08
  category: produk-hukum
  title_id: Empat tahap amandemen UUD 1945 diselesaikan
  summary_id: "Dalam empat sidang tahunan (1999-2002), MPR menulis ulang konstitusi paling fundamental sejak 1945: pembatasan masa jabatan presiden, pilpres langsung, Bab HAM lengkap 10 pasal, Mahkamah Konstitusi, Komisi Yudisial, BPK modern, pemakzulan berprosedur, dan penghapusan DPA. Tidak ada satu pun korban nyawa - kebalikan dari perubahan konstitusi di banyak negara. Reformasi konstitusi paling damai dan menyeluruh di dunia pasca-Soviet."
  source_ids:
    - tap-amandemen-uud-1999-2002
    - uud-nri-1945
  dimension_ids:
    - checks-balances
    - kedaulatan-rakyat
    - sila-4
    - sila-3
- id: ev-dpr99-kpk
  term_id: dpr-1999-2004
  date: 2002-12
  category: produk-hukum
  title_id: DPR mengesahkan UU KPK
  summary_id: 'Banyak fraksi awalnya keberatan memberi satu lembaga kewenangan penyadapan sekaligus penuntutan - "terlalu berbahaya", kata mereka. Akhirnya disahkan dengan desain super-ketat: hanya boleh menangani kasus besar, melibatkan aparat lain, dan mengawasi pejabat penegak hukum juga. Produk legislasi antikorupsi paling berdampak dalam sejarah Indonesia ini kelak menjadi target revisi yang sama parlemen yang melahirkannya.'
  source_ids:
    - uu-30-2002
  dimension_ids:
    - negara-hukum
- id: ev-dpr99-pilpres-langsung
  term_id: dpr-1999-2004
  date: 2003-07
  category: produk-hukum
  title_id: DPR mengesahkan UU Pilpres langsung
  summary_id: "Pertarungan sengit antara elite partai yang ingin mempertahankan hak memilih presiden di MPR versus tuntutan publik atas amandemen konstitusi. Rakyat menang: UU No. 23/2003 menetapkan pilpres langsung mulai 2004. Legislator yang sama yang menikmati legitimasi MPR rela melepasnya - salah satu momen langka parlemen Indonesia mengurangi kekuasaannya sendiri."
  source_ids:
    - uu-23-2003
  dimension_ids:
    - kedaulatan-rakyat
- id: ev-dpr04-ky
  term_id: dpr-2004-2009
  date: 2004-08
  category: produk-hukum
  title_id: UU Komisi Yudisial
  summary_id: "Mandat Pasal 24B hasil amandemen ketiga diwujudkan Agustus 2004: KY lahir sebagai pencari utama hakim agung dan pengawas etik hakim. Sejak itu KY menerima puluhan ribu laporan masyarakat tentang perilaku hakim - meski giginya tumpul oleh Putusan MK 005/PUU-IV/2006 yang mencabut wewenangnya atas hakim konstitusi dan membatasi rekomendasi terhadap MA. Pengawasan eksternal atas kehakiman tetap setengah jadi sampai hari ini."
  source_ids:
    - uu-27-2004
  dimension_ids:
    - negara-hukum
    - checks-balances
- id: ev-dpr04-kepemilihan
  term_id: dpr-2004-2009
  date: 2007-04
  category: produk-hukum
  title_id: UU Penyelenggara Pemilihan Umum
  summary_id: 'Setelah KPU terjerat skandal logistik pemilu 2004, DPR merespons dengan arsitektur baru: KPU dan Bawaslu dipisahkan, anggota diseleksi independen lewat tim penguji, dana digelontorkan via kanal khusus. Model "penyelenggara ganda" ini ditiru beberapa negara. Kepercayaan pada pemilu pulih bertahap - hingga generasi berikutnya memperdebatkan lagi siapa yang boleh menunjuk penyelenggara.'
  source_ids:
    - uu-22-2007
  dimension_ids:
    - sila-4
    - sila-1
- id: ev-dpr04-tipikor
  term_id: dpr-2004-2009
  date: 2009-09
  category: produk-hukum
  title_id: UU Pengadilan Tipikor
  summary_id: "Melengkapi KPK dengan ruang sidang khusus: majelis campuran hakim karier-ad-hoc, beban pembalikan beban pembuktian, dan proses cepat. Pengadilan Tipikor menjadi panggung publik tempat ratusan pejabat - bupati, gubernur, menteri, anggota DPR sendiri - dipenjara. Efisiensinya tinggi; kritiknya konsisten: vonis ringan dan seragam dibanding kerugian negara yang dicabut dari negara."
  source_ids:
    - uu-46-2009
  dimension_ids:
    - negara-hukum
- id: ev-dpr04-ite-disahkan
  term_id: dpr-2004-2009
  date: 2008-03
  category: produk-hukum
  title_id: UU ITE disahkan dengan pasal yang kelak dipersoalkan
  summary_id: DPR mengesahkan undang-undang pertama tentang dunia digital tanpa membayangkan bahwa satu pasalnya akan mengubah hidup ribuan orang. Pasal 27 ayat (3) tentang "pencemaran nama baik" lewat elektronik menjadi pasal paling dilaporkan dalam hukum pidana Indonesia modern. Parlemen butuh 12 tahun untuk akhirnya merevisi pasal-pasal itu - setelah ratusan nyawa dan karier hancur.
  source_ids:
    - uu-11-2008
  dimension_ids:
    - sila-4
- id: ev-dpr09-bpjs
  term_id: dpr-2009-2014
  date: 2011-11
  category: produk-hukum
  title_id: DPR mengesahkan UU BPJS
  summary_id: Setelah sembilan tahun UU SJSN tak punya anak implementasi, tekanan serikat buruh dan putusan pengadilan memaksa DPR menyelesaikan UU BPJS November 2011. Lima UU lama dicabut; sistem asuransi sosial pecahan era kolonial dilebur menjadi dua badan nasional. Salah satu contoh jarang di mana mobilisasi publik benar-benar menentukan agenda legislasi.
  source_ids:
    - uu-24-2011
  dimension_ids:
    - sila-5
    - tujuan-2
    - sila-2
    - sila-4
- id: ev-dpr09-pp3
  term_id: dpr-2009-2014
  date: 2011-08
  category: produk-hukum
  title_id: UU Pembentukan Peraturan Perundang-undangan
  summary_id: 'Kodifikasi proses legislasi yang ditunggu kalangan hukum: hierarki norma, kewajiban partisipasi publik, dan aturan harmonisasi. Namun kritik tajam menyasar ketentuan yang membuat Perppu bisa "diam-diam sah" jika DPR tak menyatakan penolakan, serta hilangnya status khusus bagi beberapa instrumen. UU ini kelak jadi senjata dua mata: alat kontrol proses sekaligus celah legalisasi legislasi kilat.'
  source_ids:
    - uu-12-2011
  dimension_ids:
    - negara-hukum
    - sila-4
- id: ev-dpr09-md3
  term_id: dpr-2009-2014
  date: 2014-04
  category: produk-hukum
  title_id: UU MD3 memperkuat posisi pimpinan dewan
  summary_id: 'Digodok senyap di rapat-rapat internal pimpinan, disahkan April 2014: MPR-DPR-DPD jadi "lembaga negara" beranggaran besar, tunjangan dan fasilitas pimpinan naik signifikan, hak inisiatif RUU diperluas. Publik tahu belakangan - saat anggota dewan periode berikutnya menikmati fasilitas barunya. Pola legislasi self-serving ini menjadi cetakan yang diwariskan sampai revisi MD3 2025.'
  source_ids:
    - uu-17-2014
  dimension_ids:
    - checks-balances
    - kedaulatan-rakyat
- id: ev-dpr14-des
  term_id: dpr-2014-2019
  date: 2014-09
  category: produk-hukum
  title_id: UU Desa disahkan
  summary_id: "Disahkan 30 September 2014 di penghujung masa sidang, UU No. 6/2014 mengubah desa dari objek pembangunan menjadi subjek pemerintahan: badan permusyawaratan desa, APBDes transparan, dan jalur dana langsung yang kelak mencapai Rp100+ triliun setahun. Warisan legislasi terbaik periode ini - sekaligus medan uji baru bagi integritas ribuan kepala desa."
  source_ids:
    - uu-6-2014
  dimension_ids:
    - sila-5
    - tujuan-2
- id: ev-dpr14-pemilu
  term_id: dpr-2014-2019
  date: 2017-08
  category: produk-hukum
  title_id: UU Pemilihan Umum No. 7/2017
  summary_id: Kodifikasi elektoral raksasa - 560+ pasal menggabungkan delapan UU lama. Ambang batas parlemen 4% dipertahankan meski MK dua kali memperingatkan; pencalonan tetap dikunci partai; sanksi pelanggaran administratif diperkuat dengan pembubaran partai. Undang-undang yang menyelenggarakan pemilu 2019 dan 2024 ini juga menjadi akar gugatan ambang batas yang dimenangkan petisi di MK pada 2024.
  source_ids:
