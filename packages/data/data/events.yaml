  summary_id: 1984 Indonesia - negara pengimpor beras terbesar dunia - mencapai swasembada; FAO menganugerahkan medali kepada Soeharto pada 1985. Hasil kombinasi intensifikasi massal, subsidi pupuk, dan insentif harga bagi petani. Kemiskinan turun dari sekitar enam puluh persen (1970) ke belasan persen (1990-an) - capaian kesejahteraan nyata rezim ini, yang sayangnya dibayar oleh utang luar negeri dan oligarki cronies yang tumbuh paralel di sektor-sektor sama.
