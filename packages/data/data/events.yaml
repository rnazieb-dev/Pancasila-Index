  term_id: presiden-soekarno-ii
  date: 1963-09
  category: kebijakan
  title_id: Dwikora dan konfrontasi dengan Malaysia
  summary_id: '"Ganyang Malaysia" menggerakkan massa sambil menghancurkan ekonomi. Konfrontasi militer tiga tahun - penyusupan Kalimantan, serangan Semenanjung Singapura, hingga Indonesia keluar dari PBB (1965) - menguras kas negara, mengisolasi diplomasi, dan memperkaya para komandan. Warisan yang diterima Soeharto adalah kehancuran total: inflasi menuju 600% dan cadangan devisa nyaris kosong.'
