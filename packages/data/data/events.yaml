  date: 2024-11
  category: produk-hukum
  title_id: Revisi UU Pemilu mematuhi Putusan MK No. 60/PUU-XI/2024
  summary_id: Menyusul putusan MK yang menyatakan ambang batas parlemen inkonstitusional untuk pemilu mendatang, DPR menyusun revisi UU Pemilu pada November 2024 - salah satu contoh jarang kepatuhan cepat parlemen terhadap putusan penjaga konstitusi dalam hal yang mengurangi keuntungan partai besar. Detail implementasinya masih akan diperjuangkan di ruang-ruang komisi.
