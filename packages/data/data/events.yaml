- id: ev-ma-dikooptasi-orba
  term_id: ma-dt-orde-baru
  date: 1980-01
  category: krisis
  title_id: Peradilan tunduk pada eksekutif sepanjang Orde Baru
  summary_id: Secara organisasi MA berada di bawah Departemen Kehakiman; karier,
    gaji tunjangan, bahkan pensiun hakim ditentukan eksekutif. Perkara sensitif
    - Malari, media yang dibredel, tanah rakyat untuk proyek - nyaris selalu
    dimenangkan penguasa; advokat berani seperti Adnan Buyung Nasution justru
    diberhentikan. Supremasi hukum menjadi slogan pidato, bukan realitas
    persidangan.
