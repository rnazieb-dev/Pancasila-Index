    - tujuan-4
- id: ev-soeharto-asas-tunggal
  term_id: presiden-soeharto
  date: 1985-08
  category: produk-hukum
  title_id: UU Ormas 8/1985 - Pancasila asas tunggal
  summary_id: Seluruh organisasi massa dan partai wajib Pancasila sebagai asas
    tunggal; PNS wajib monoloyalitas. Kaderisasi P4 masuk sekolah dan kantor;
    siapa yang ragu dicurigai. Konsep ideologi yang dirancang penyatuan berubah
    menjadi instrumen ujian kesetiaan politik - dan dicabut barulah oleh MPR
    pada 2000. Contoh sempurna bagaimana nilai luhur bisa dijadikan alat
    kontrol.
  source_ids:
    - uu-8-1985
  dimension_ids:
