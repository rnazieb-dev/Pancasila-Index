    - tujuan-2
- id: ev-soeharto-transmigrasi
  term_id: presiden-soeharto
  date: "1975"
  category: kebijakan
  title_id: Transmigrasi skala besar era minyak
  summary_id: Dengan uang migas, ratusan ribu keluarga Jawa-Bali dipindahkan ke Sumatera, Kalimantan, dan Papua dengan janji tanah dan hidup baru. Di satu sisi kemiskinan pedesaan Jawa tertolong; di sisi lain program ini menjadi mesin konflik agraria - hak ulayat adat digilir untuk transmigran, masyarakat lokal menjadi minoritas di kampung sendiri. Kebijakan yang menolong sekaligus merampas, tergantung Anda lahir di mana.
  source_ids:
    - buku-kahin-nationalism-revolution-1952
    - buku-ricklefs-history-modern-indonesia-1981
  dimension_ids:
    - sila-3
- id: ev-soeharto-kb-program
  term_id: presiden-soeharto
  date: "1974"
  category: kebijakan
  title_id: Program Keluarga Berencana nasional (BKKBN)
  summary_id: "Lahir dari Inpres 1970 dan dilembagakan sebagai BKKBN 1974, KB Orde Baru menjadi salah satu program paling sukses dunia: angka kelahiran turun dari lebih lima anak per wanita (1971) menjadi sekitar dua setengah pada akhir 1990-an, dipuji FAO hingga PBB. Metodenya juga punya bayang-bayang - target yang dipaksakan ke kepala desa dan insentif sterilisasi yang menuai kritik hak reproduksi."
  source_ids:
    - buku-kahin-nationalism-revolution-1952
    - buku-ricklefs-history-modern-indonesia-1981
  dimension_ids:
    - sila-5
    - tujuan-2
- id: ev-soeharto-malari
  term_id: presiden-soeharto
  date: 1974-01
  category: krisis
  title_id: Malari dan pembredelan pertama gelombang pers
  summary_id: "15 Januari 1974, kunjungan PM Tanaka berujung kerusuhan Jakarta: gedung-gedung asosiasi Jepang dibakar, sebelas orang tewas. Negara menjawab bukan dengan dialog melainkan pembredelan dua belas media termasuk Indonesia Raya dan Nusantara, penahanan tokoh-tokoh mahasiswa, dan pemecatan pejabat yang tak sepaham. Malari adalah momen Orde Baru memilih jalan: kritik ekonomi-politik akan dihargai dengan penjara, bukan jawaban."
  source_ids:
    - buku-kahin-nationalism-revolution-1952
    - buku-ricklefs-history-modern-indonesia-1981
  dimension_ids:
    - negara-hukum
    - tujuan-2
- id: ev-soeharto-petrus
  term_id: presiden-soeharto
  date: "1983"
  category: krisis
  title_id: Petrus - penembakan misterius ribuan preman
  summary_id: 1983-1985, mayat-mayat ditembak mati dan ditinggalkan di tempat umum dari Aceh sampai Jawa - korban resmi disebut para preman, narasi resminya "preman lawan preman". Ribuan jiwa lenyap tanpa pengadilan; keluarga tak pernah mendapat kepastian. Bertahun-tahun kemudian, keterlibatan aparat diakui secara setengah-setengah bahkan dalam otobiografi presiden itu sendiri. Impunitas paling telanjang dalam sejarah republik modern.
  source_ids:
    - buku-kahin-nationalism-revolution-1952
    - buku-ricklefs-history-modern-indonesia-1981
  dimension_ids:
    - sila-2
- id: ev-soeharto-tanjung-priok
  term_id: presiden-soeharto
  date: 1984-09
  category: krisis
  title_id: Tragedi Tanjung Priok
  summary_id: "12 September 1984, pasukan menyerbu Masjid Raya Tanjung Priok seusia ceramah yang mengkritik pemerintah; puluhan warga tewas - angka resmi 18, kesaksian warga jauh lebih banyak. Baru pada era Reformasi beberapa prajurit diadili, lalu semuanya dibebaskan Habibie lewat amnesti. Pola yang berulang sampai hari ini: kekerasan aparat ditutup rapor, korban diminta berdamai tanpa keadilan."
  source_ids:
    - buku-kahin-nationalism-revolution-1952
    - buku-ricklefs-history-modern-indonesia-1981
  dimension_ids:
    - sila-2
- id: ev-habibie-trisakti-semanggi
  term_id: presiden-habibie
  date: 1998-05
  category: krisis
  title_id: Penembakan Trisakti dan Semanggi I-II
  summary_id: "12 Mei 1998 empat mahasiswa Trisakti ditembak mati oleh aparat bersenjata - percikan kerusuhan Mei yang menumbangkan Soeharto tiga hari kemudian. Kekerasan berlanjut ke era Habibie: Semanggi I (November 1998) dan Semanggi II (September 1999) kembali menewaskan mahasiswa dan warga. Komnas HAM menyimpulkan ada pelaku aparat, tapi berpuluh tahun kemudian tidak satu pun kasus ini sampai vonis - pembuka bab panjang impunitas pasca-Reformasi."
  source_ids:
    - komnas-ham-trisakti-semanggi
  dimension_ids:
    - sila-2
- id: ev-megawati-papua-otsus
  term_id: presiden-megawati
  date: 2001-11
  category: produk-hukum
  title_id: UU Otonomi Khusus Papua No. 21/2001
  summary_id: "Setelah Theys Eluay dibunuh dan konflik Papua memanas, Megawati mengesahkan UU otonomi khusus paling dermawan di republik ini: dana otsus 2% APBN selama dua puluh tahun, MRP penjaga hak orang asli, pengakuan kebudayaan Papua. Dua dekade kemudian neracanya pahit: dana mengalir ratusan triliun sementara kekerasan dan ketidakpercayaan justru menguat - bukti bahwa otonomi uang tanpa penyelesaian politik dan keadilan sejarah tak memadamkan api."
  source_ids:
    - uu-21-2001
  dimension_ids:
    - sila-3
    - tujuan-3
- id: ev-megawati-munir
  term_id: presiden-megawati
  date: 2004-09
  category: krisis
  title_id: Pembunuhan Munir Said Thalib
  summary_id: "7 September 2004, pembela HAM terdepan Indonesia diracun arsenik di penerbangan Garuda menuju Amsterdam. Pengemudi Garuda Pollycarpus divonis seumur hidup, tetapi mantan pejabat BIN Muchdi PR dibebaskan majelis hakim - meski jejak teleponnya mengular ke markas intelijjen. Pembunuhan paling politis dalam sejarah Reformasi ini tidak pernah sampai ke dalangnya. Pesannya dingin: siapa pun yang menggali terlalu dalam akan dilindungi hukum - selama bukan lawan hukum itu sendiri."
  source_ids:
    - putusan-munir-2008
  dimension_ids:
    - sila-2
    - negara-hukum
- id: ev-sby2-bibit-chandra
  term_id: presiden-sby-ii
  date: 2009-10
  category: krisis
  title_id: Perang praperadilan Bibit-Chandra
  summary_id: Oktober 2009, dua pimpinan KPK ditetapkan tersangka dugaan suap - beberapa hari setelah mereka menangani perkara besar yang menyentuh elite kepolisian dan kejaksaan. Praperadilan Pengadilan Negeri Jakarta Selatan memvonis penetapan itu melawan hukum; jutaan warga mendukung lewat Facebook, kemeja "Cicak vs Buaya" menjadi busana nasional. Episode ini membuka mata publik bahwa antikorupsi bisa diserang dengan senjata hukumnya sendiri.
  source_ids:
    - berita-praperadilan-kpk-2009
  dimension_ids:
