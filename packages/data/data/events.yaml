# ------------------------- PRESIDEN HABIBIE -------------------------

- id: ev-habibie-tap-xvii
  term_id: presiden-habibie
  date: "1998-11"
  category: produk-hukum
  title_id: TAP MPR XVII/MPR/1998 tentang Hak Asasi Manusia
  summary_id: >-
    Empat bulan setelah Soeharto lengser, Sidang Umum MPR mengesahkan piagam HAM
    nasional yang mengadopsi semangat Deklarasi Universal HAM - dokumen yang 32
    tahun dihindari rezim karena dianggap barang "barat". Piagam ini menjadi payung
    seluruh legislasi HAM berikutnya, dari penguatan Komnas HAM sampai pengadilan
    HAM ad hoc. Catatan pedasnya: piagam lahir tanpa gigi - negara menandatangani
    pengakuan pada kertas jauh sebelum pada meja pengadilan.
  source_ids: [tap-mpr-xvii-1998]
  dimension_ids: [sila-2]

- id: ev-habibie-kemerdekaan-sipil
  term_id: presiden-habibie
  date: "1998-10"
  category: produk-hukum
  title_id: UU Kemerdekaan Menyatakan Pendapat di Muka Umum
  summary_id: >-
    Ditandatangani 20 Oktober 1998, undang-undang ini membebaskan unjuk rasa yang
    selama Orde Baru diberi label "subversif". Tahanan politik dilepas bertahap;
    buruh dan mahasiswa kembali boleh berdemo tanpa izin polisi. Dalam hitungan
    bulan jumlah aksi melonjak dari belasan menjadi ribuan per tahun - ruang sipil
    paling terbuka sejak 1950-an.
  source_ids: [uu-9-1998]
  dimension_ids: [sila-4]

- id: ev-habibie-referendum-timtim
  term_id: presiden-habibie
  date: "1999-05"
  category: kebijakan
  title_id: Konsultasi Rakyat Timor Timur
  summary_id: >-
    Keputusan yang membuat Habibie dicemooh elite Jakarta tetapi disegani dunia:
    setelah 23 tahun integrasi berdarah, nasib Timor Timur diserahkan ke kotak
    suara lewat kesepakatan tripartit Indonesia-Portugal-PBB (5 Mei 1999). Pada
    30 Agustus 1999, 78,5% memilih merdeka - diikuti gelombang kehancuran oleh
    milisi pro-integrasi. Prosedurnya damai, pelaksanaannya tragis.
  source_ids: [tripartit-timtim-1999]
  dimension_ids: [sila-3, tujuan-4]

- id: ev-habibie-pemilu-1999
  term_id: presiden-habibie
  date: "1999-06"
  category: peristiwa
  title_id: Pemilu multipartai pertama pasca-Orde Baru
  summary_id: >-
    7 Juni 1999: 48 partai bertanding dan untuk pertama kali sejak 1955 rakyat
    memilih tanpa asas tunggal dan tanpa Golkar yang menang otomatis. PDI-P menang
    33,7%; Golkar jatuh ke 22,4% - kalah pertama dalam enam pemilu. Pengamat
    internasional menyebutnya bebas dan adil meski kerusuhan Kupang dan Atambua
    meninggalkan luka. Inilah fondasi legitimasi demokrasi modern Indonesia.
  source_ids: [uu-3-1999]
  dimension_ids: [sila-4, kedaulatan-rakyat]

- id: ev-habibie-otda
  term_id: presiden-habibie
  date: "1999-05"
  category: produk-hukum
  title_id: UU Otonomi Daerah dan Perimbangan Keuangan
  summary_id: >-
    Reaksi cepat atas pelajaran sentralisasi: saat Jakarta runtuh, Aceh, Papua,
    dan Riau menyuarakan perpisahan. UU No. 22 dan No. 25 Tahun 1999 membalik logika
    Orde Baru - daerah mengurus semua urusan kecuali yang eksplisit dipusatkan,
    lengkap dengan bagi hasil SDA. Implementasinya kacau di banyak tempat, namun
    arah desentralisasi tak pernah bisa dibalik lagi.
  source_ids: [uu-22-1999, uu-25-1999]
  dimension_ids: [sila-3]

- id: ev-habibie-uu-pers-ham
  term_id: presiden-habibie
  date: "1999-09"
  category: produk-hukum
  title_id: UU Pers dan UU Hak Asasi Manusia
  summary_id: >-
    Dua undang-undang kembar ditetapkan 23 September 1999, hari-hari terakhir
    Habibie di Istana. UU Pers membunuh SIUPP - izin terbit yang bisa dicabut
    sewaktu-waktu, senjata pembredelan Soeharto - dan menggantinya dengan hak jawab.
    UU HAM memberi Komnas HAM mandat penyelidikan formal. Pers Indonesia melonjak
    dari satu dominasi menjadi ribuan media dalam lima tahun.
  source_ids: [uu-40-1999, uu-39-1999]
  dimension_ids: [sila-4, sila-2]

# ------------------------- PRESIDEN GUSDUR -------------------------

- id: ev-gusdur-depen
  term_id: presiden-gusdur
  date: "1999-10"
  category: kebijakan
  title_id: Pembubaran Departemen Penerangan
  summary_id: >-
    Dalam pekan pertama jabatannya, Gus Dur membubarkan departemen yang 54 tahun
    menjadi corong propaganda negara - dari manipulasi era konfrontasi hingga
    pencucian otak Orde Baru. Ribuan pegawai Depen kehilangan fungsi; pers bebas
    mewarisi tugas "penerangan". Simbolisme yang tajam: negara mengakui bahwa
    informasi milik warga, bukan monopoli istana.
  source_ids: [keppres-125-1999]
  dimension_ids: [sila-4]

- id: ev-gusdur-imlek
  term_id: presiden-gusdur
  date: "2000-01"
  category: kebijakan
  title_id: Keppres 6/2000 - Imlek dirayakan terbuka
  summary_id: >-
    17 Januari 2000, Gus Dur mencabut Inpres 14/1967 yang membatasi agama,
    kepercayaan, dan tradisi Tionghoa. Imlek kembali menjadi hari raya nasional
    setelah 32 tahun harus dirayakan diam-diam; barongsai yang dulu diburu polisi
    tampil di istana. Satu keputusan presiden menghapus tiga dekade diskriminasi
    budaya - bukti bahwa pelarasan bisa sesederhana itu.
  source_ids: [keppres-6-2000]
  dimension_ids: [sila-1, sila-3]

- id: ev-gusdur-ssm
  term_id: presiden-gusdur
  date: "2001-07"
  category: krisis
  title_id: Sidang Istimewa MPR memberhentikan Presiden Wahid
  summary_id: >-
    Konflik Gus Dur-DPR yang memanas sepanjang 2001 - dari Buloggate hingga ancaman
    mendekrit - berakhir di Sidang Istimewa MPR 23 Juli 2001. Presiden pertama
    hasil pemilu bebas diberhentikan lewat prosedur konstitusi, bukan tank di jalan.
    Kritikus menyebutnya kudeta berjubah toga; pembelanya menyebut dewasanya
    checks and balances. Keduanya benar sekaligus.
  source_ids: [tap-mpr-iii-2001]
  dimension_ids: [checks-balances]

# ------------------------ PRESIDEN MEGAWATI ------------------------

- id: ev-megawati-pengadilan-timtim
  term_id: presiden-megawati
  date: "2001-12"
  category: pengadilan
  title_id: Pengadilan HAM Ad Hoc Timor Timur dibentuk
  summary_id: >-
    Keppres 53/2001 membentuk pengadilan ad hoc untuk kekerasan pasca-jajak pendapat
    1999. Hasilnya memalukan: dari 18 tertuduhan, semua pejabat Indonesia dibebaskan
    atau bebas banding, sementara dua orang Timor Leste jadi kambing hitam. PBB
    menyebut prosesnya "secara sistematik gagal menegakkan keadilan" - contoh klasik
    bagaimana negara bisa punya pengadilan tanpa punya keinginan menghukum.
  source_ids: [keppres-53-2001]
  dimension_ids: [sila-2]

- id: ev-megawati-kpk
  term_id: presiden-megawati
  date: "2002-12"
  category: produk-hukum
  title_id: UU Komisi Pemberantasan Korupsi
  summary_id: >-
    Disahkan 27 Desember 2002 di tengah skeptisisme parlemen sendiri, UU ini melahirkan
    KPK dengan kewenangan super: penyadapan, penangkapan, dan penuntutan dalam satu
    atap - hal yang ditolak elite karena "berbahaya bagi politisi". Delapan tahun
    kemudian KPK memenjarakan ketua partai penguasa parlemen. Institusi antikorupsi
    paling ditakuti Asia Tenggara lahir dari rezim yang tidak terkenal bersih.
  source_ids: [uu-30-2002]
  dimension_ids: [negara-hukum]

- id: ev-megawati-presiden-langsung
  term_id: presiden-megawati
  date: "2003-07"
  category: produk-hukum
  title_id: UU Pemilihan Presiden dan Wakil Presiden
  summary_id: >-
    Disahkan Juli 2003, undang-undang ini menerjemahkan amandemen ketiga konstitusi
    menjadi mesin elektoral: rakyat langsung memilih presiden, bukan lagi MPR. Ironi
    sejarahnya tebal - Megawati menandatangani aturan yang setahun kemudian
    menjatuhkannya lewat kotak suara rakyat, kalah telak dari SBY. Negara yang matang
    adalah yang pemimpinnya rela dikalahkan oleh aturan yang ia buat sendiri.
  source_ids: [uu-23-2003]
  dimension_ids: [kedaulatan-rakyat, sila-4]

- id: ev-megawati-antiteror
  term_id: presiden-megawati
  date: "2003-04"
  category: produk-hukum
  title_id: UU Pemberantasan Tindak Pidana Terorisme
  summary_id: >-
    Bom Bali 12 Oktober 2002 - 202 korban jiwa - memaksa legislasi kilat lewat Perppu
    yang kemudian menjadi UU No. 15/2003. Hasilnya nyata: Densus 88 dibentuk, jaringan
    JI dibongkar, para pelaku dieksekusi. Harga-harganya juga nyata: definisi terorisme
    yang luas kelak menjadi preseden perluasan makna "ancaman" dalam hukum pidana
    Indonesia.
  source_ids: [uu-15-2003]
  dimension_ids: [tujuan-1]

- id: ev-megawati-mk-dilantik
  term_id: presiden-megawati
  date: "2003-08"
  category: pengangkatan
  title_id: Majelis Mahkamah Konstitusi pertama dilantik
  summary_id: >-
    13 Agustus 2003, sembilan hakim dari tiga jalur (MA, DPR, Presiden) dilantik -
    realisasi janji amandemen yang tertunda dua tahun. MK langsung membuktikan diri:
    dalam bulan-bulan pertamanya menerima puluhan permohonan uji UU dan membuka sidang
    kepada publik, sesuatu yang belum pernah dilakukan MA. Penjaga konstitusi resmi
    lahir; sejarah membuktikan ia akan menjadi lembaga paling digemari sekaligus
    paling digoda politik.
  source_ids: [uu-24-2003]
  dimension_ids: [checks-balances]

# ------------------------- PRESIDEN SBY I -------------------------

- id: ev-sby1-damai-aceh
  term_id: presiden-sby-i
  date: "2005-08"
  category: kebijakan
  title_id: MoU Helsinki mengakhiri konflik Aceh
  summary_id: >-
    Tsunami Desember 2004 yang menewaskan 167 ribu orang di Aceh membuka pintu yang
    tak terduga: 15 Agustus 2005 pemerintah dan GAM menandatangani MoU Helsinki
    setelah 29 tahun perang dan puluhan ribu korban jiwa. GAM melucuti 840 senjata,
    pasukan nonorganik mundur, partai lokal dilegalkan. Konflik separatis terlama di
    Asia Tenggara berakhir di atas meja - bukti langka bahwa integrasi bisa dicapai
    dengan martabat, bukan hanya peluru.
  source_ids: [mou-helsinki-2005]
  dimension_ids: [sila-3, tujuan-1]

- id: ev-sby1-log-aceh
  term_id: presiden-sby-i
  date: "2006-07"
  category: produk-hukum
  title_id: UU Pemerintahan Aceh
  summary_id: >-
    Disahkan 11 Juli 2006, undang-undang ini menerjemahkan MoU Helsinki menjadi hukum:
    Aceh jadi satu-satunya provinsi dengan partai lokal, menerima dana otonomi khusus
    2% APBN selama 15 tahun, dan pilkada pertamanya dimenangkan mantan panglima GAM
    Irwandi Yusuf. Provinsi paling militeristik Indonesia berubah menjadi laboratorium
    perdamaian - meski paket syariat yang menyertainya memunculkan pertanyaan baru
    tentang perlindungan minoritas.
  source_ids: [uu-11-2006]
  dimension_ids: [sila-3]

- id: ev-sby1-ite
  term_id: presiden-sby-i
  date: "2008-03"
  category: produk-hukum
  title_id: UU Informasi dan Transaksi Elektronik disahkan
  summary_id: >-
    Dirancang untuk kepastian ekonomi digital, UU No. 11/2008 justru melahirkan
    instrumen lain: Pasal 27 ayat (3) tentang "berita bohong" dan pasal karet lainnya
    tanpa definisi tegas. Dalam satu dekade lebih dari 400 orang dilaporkan pidana
    karena unggahan - dari pengkritik kepala daerah sampai tetangga yang bertengkar.
    Kepastian hukum bagi e-commerce dibayar mahal oleh kebebasan berekspresi warga.
  source_ids: [uu-11-2008]
  dimension_ids: [sila-4]

- id: ev-sby1-antirasial
  term_id: presiden-sby-i
  date: "2008-10"
  category: produk-hukum
  title_id: UU Penghapusan Diskriminasi Rasial dan Etnik
  summary_id: >-
    Setelah enam dekade konstitusi menjanjikan kesetaraan, akhirnya lahir instrumen
    pidana anti-diskriminasi (UU No. 40/2008) - lanjutan logis pencabutan SBKRI pada
    2003. Implementasinya lesu: segelintir perkara sejak disahkan, sementara diskriminasi
    bergeser ke praktik administratif harian. Namun fondasinya tertanam permanen:
    negara tak lagi punya dasar hukum untuk membedakan warganya.
  source_ids: [uu-40-2008]
  dimension_ids: [sila-3]

- id: ev-sby1-century
  term_id: presiden-sby-i
  date: "2008-11"
  category: krisis
  title_id: Bailout Bank Century Rp6,7 triliun
  summary_id: >-
    November 2008, pemerintah menyelamatkan bank mungil milik Robert Tantular dengan
    Rp6,7 triliun - sepuluh kali lipat rencana awal Rp620 miliar. Dana menguap,
    pemiliknya sempat melarikan diri, dan pansus DPR terbelah persis di garis koalisi
    saat memvonis bailout itu "tidak salah hukum". Tidak ada pejabat tinggi yang
    dimintai pertanggungjawaban. Century adalah pelajaran abadi tentang bagaimana
    akuntabilitas bisa dikalahkan oleh aritmetika kursi parlemen.
  source_ids: [laporan-bpk-century]
  dimension_ids: [negara-hukum]

# ------------------------- PRESIDEN SBY II -------------------------

- id: ev-sby2-tppu
  term_id: presiden-sby-ii
  date: "2010-10"
  category: produk-hukum
  title_id: UU Pencegahan dan Pemberantasan Pencucian Uang
  summary_id: >-
    Revisi total rezim antimonecucian memberi PPATK akses analisis transaksi finansial
    yang lebih luas dan menjadikan pencucian uang tindak pidana mandiri - tak perlu
    menunggu kejahatan asal terbukti. Instrumen ini kelak menjadi mata-mata paling
    efektif aparat antikorupsi: mayoritas tersangka korupsi besar jatuh bukan karena
    tertangkap tangan, melainkan karena jejak rupiahnya.
  source_ids: [uu-8-2010]
  dimension_ids: [negara-hukum]

- id: ev-sby2-bpjs
  term_id: presiden-sby-ii
  date: "2011-11"
  category: produk-hukum
  title_id: UU Badan Penyelenggara Jaminan Sosial
  summary_id: >-
    Perjuangan sembilan tahun pasca-amandemen Pasal 34 menghasilkan UU No. 24/2011:
    BPJS Kesehatan dan BPJS Ketenagakerjaan. Pengusaha dan asuransi swasta melobi
    keras menolaknya; serikat buruh turun ke jalan memperjuangkannya. Saat beroperasi,
    JKN menjadi skema asuransi kesehatan tunggal terbesar di dunia - kini melebihi
    200 juta peserta. Tulang punggung negara kesejahteraan Indonesia akhirnya ada.
  source_ids: [uu-24-2011]
  dimension_ids: [sila-5, tujuan-2]

- id: ev-sby2-moratorium-hutan
  term_id: presiden-sby-ii
  date: "2011-05"
  category: kebijakan
  title_id: Moratorium izin hutan alam primer dan gambut
  summary_id: >-
    Buah dari kerja sama iklim Norwegia senilai US$1 miliar, Inpres No. 10/2011
    membekukan izin baru pada sekitar 64 juta hektare hutan primer dan gambut -
    diperpanjang berkala hingga 2019. Emisi deforestasi melambat nyata meski bocornya
    izin di lapangan tak kunjung kering. Preseden internasional penting: negara
    berkembang membuktikan hutan bisa menjadi aset iklim, bukan sekadar tambang kayu.
  source_ids: [inpres-10-2011]
  dimension_ids: [tujuan-4]

- id: ev-sby2-md3
  term_id: presiden-sby-ii
  date: "2014-04"
  category: produk-hukum
  title_id: UU MD3 memperkuat elite parlemen
  summary_id: >-
    Digodok tanpa sorotan lalu disahkan April 2014, UU No. 17/2014 mengangkat MPR-DPR-DPD
    menjadi "lembaga negara" dengan anggaran raksasa dan hak inisiatif RUU. Pimpinan
    dewan mendapat kekuasaan alokasi masif; anggota biasa meredup; publik nyaris tak
    tahu undang-undang ini lahir. Contoh sempurna legislasi melayani diri sendiri:
    aturan yang ditulis elite, untuk elite, oleh elite.
  source_ids: [uu-17-2014]
  dimension_ids: [checks-balances, kedaulatan-rakyat]

# ------------------------ PRESIDEN JOKOWI I ------------------------

- id: ev-jokowi1-dana-desa
  term_id: presiden-jokowi-i
  date: "2015-01"
  category: kebijakan
  title_id: Dana Desa mulai mengalir besar-besaran
  summary_id: >-
    Maret 2015, Rp20 triliun pertama mengalir ke 74 ribu desa - transfer fiskal langsung
    terbesar dalam sejarah republik, terus naik hingga lebih dari Rp100 triliun setahun.
    Ratusan ribu kilometer jalan desa dibangun; kasus korupsi kepala desa juga membubung
    ratusan tersangka per tahun. Eksperimen paling ambisius ini membuktikan dua hal
    sekaligus: negara sanggup sampai ke pelosok, dan pengawasan belum sanggup
    mengikutinya.
  source_ids: [uu-6-2014]
  dimension_ids: [sila-5]

- id: ev-jokowi1-eksekusi-narkoba
  term_id: presiden-jokowi-i
  date: "2015-01"
  category: peristiwa
  title_id: Gelombang eksekusi mati narkotika
  summary_id: >-
    18 Januari 2015 enam orang ditembak mati di Nusakambangan - eksekusi pertama setelah
    moratorium empat tahun - disusul gelombang April dengan delapan orang, termasuk enam
    warga asing dari Bali Nine. Brazil dan Australia menarik dutanya; PBB dan Komnas HAM
    memprotes keras. Jokowi bertahan dengan narasi "krisis narkoba", sementara proses
    hukum para terpidana dipertanyakan karena akses advokat dan ujian clemensi yang
    sempit.
  source_ids: [laporan-komnas-ham-eksekusi-2015]
  dimension_ids: [sila-2]

- id: ev-jokowi1-perluasan-pkh
  term_id: presiden-jokowi-i
  date: "2017-08"
  category: kebijakan
  title_id: Perluasan Program Keluarga Harapan nasional
  summary_id: >-
    Perpres 63/2017 melembagakan PKH - bantuan tunai bersyarat ala Brasil dan Meksiko -
    menjadi program nasional: dari 800 ribu keluarga (2014) menjadi 10 juta keluarga.
    Ibu hamil wajib imunisasi, anak wajib sekolah; pelanggarannya memotong bantuan.
    Evaluasi mencatat stunting dan putus sekolah menurun di rumah tangga penerima.
    Kelemahan klasiknya tetap data kemiskinan yang usang, membuat jutaan orang layak
    tak terdaftar.
  source_ids: [perpres-63-2017]
  dimension_ids: [sila-5, tujuan-2]

- id: ev-jokowi1-aksi-2019
  term_id: presiden-jokowi-i
  date: "2019-09"
  category: peristiwa
  title_id: Aksi mahasiswa nasional dan penindakannya
  summary_id: >-
    September 2019, mahasiswa dan warga di puluhan kota turun menolak revisi UU KPK
    dan RKUHP - aksi terbesar sejak 1998. DPR akhirnya menunda penetapan RKUHP, tapi
    revisi KPK sudah sah. Komnas HAM mencatat ratusan mahasiswa terluka akibat tembakan
    gas dan pemukulan aparat di Jakarta, Bandung, Makassar, Kendari. Pesannya jelas:
    jalan bisa mengalahkan agenda parlemen, tapi selalu dengan risiko darah.
  source_ids: [laporan-komnas-ham-aktivis-2019]
  dimension_ids: [sila-4, sila-2]

# ----------------------- PRESIDEN JOKOWI II -----------------------

- id: ev-jokowi2-shutdown-papua
  term_id: presiden-jokowi-ii
  date: "2019-08"
  category: kebijakan
  title_id: Pembatasan akses internet di Papua
  summary_id: >-
    Pasca-kerusuhan Surabaya atas rasisme terhadap mahasiswa Papua, pemerintah memblokir
    internet di Papua dan Papua Barat selama berpekan - shutdown terbesar dalam sejarah
    Indonesia. Koalisi LSM membawanya ke pengadilan; MK menyatakan pemutusan sepihak
    tanpa dasar hukum inkonstitusional (2020). Negara memilih memutus mata dan telinga
    warga ketika cerita yang menyebar tidak sesuai versi resmi.
  source_ids: [laporan-lsm-kebebasan-sipil-2019-2024]
  dimension_ids: [sila-4, sila-3]

- id: ev-jokowi2-ciptaker
  term_id: presiden-jokowi-ii
  date: "2020-02"
  category: produk-hukum
  title_id: Proses omnibus UU Cipta Kerja
  summary_id: >-
    Ribuan pasal dari puluhan UU dilebur jadi satu paket 944 halaman dalam hitungan bulan.
    Partisipasi publik nyaris nol: draf tidak dipublikasikan tuntas, pendapat ditampung
    simbolik. Buruh menggelar mogok nasional Oktober 2020; MK kemudian menyatakannya
    "inkonstitusional bersyarat" karena cacat formal. Preseden paling telanjang tentang
    bagaimana efisiensi bisa dibunuhnya prosedur demokrasi.
  source_ids: [uu-11-2020]
  dimension_ids: [checks-balances, sila-4]

- id: ev-jokowi2-respons-pandemi
  term_id: presiden-jokowi-ii
  date: "2020-03"
  category: krisis
  title_id: Penanganan pandemi COVID-19
  summary_id: >-
    Respons awal lambat - presiden lebih dulu sibuk meremehkan virus di Januari 2020 -
    hingga kasus meledak Maret. Lalu negara banting setir: Perppu 1/2020 membuka belanja
    Rp1.700 triliun, PSBB-PKKM diselenggarakan, bansos mengalir ke puluhan juta keluarga,
    vaksinasi massal menyentuh 200 juta dosis dalam satu tahun. Akhirnya salah satu
    respons kesehatan publik terbesar dalam sejarah republik - dengan catatan transparansi
    data awal yang buruk dan korupsi bansos daerah yang merajalela.
  source_ids: [uu-2-2020]
  dimension_ids: [tujuan-1, sila-5]

- id: ev-jokowi2-putusan-mk-91
  term_id: presiden-jokowi-ii
  date: "2021-11"
  category: pengadilan
  title_id: Putusan MK No. 91/PUU-XVIII/2020
  summary_id: >-
    Dengan suara bulat, sembilan hakim menyatakan UU Cipta Kerja "inkonstitusional
    bersyarat": cacat formalnya - partisipasi publik diabaikan, draf tak dipublikasikan -
    membuat proses pembuatannya melanggar konstitusi. Putusan ini menjadi rujukan global
    tentang pentingnya proses legislasi partisipatif. Pertanyaannya kemudian bukan lagi
    apakah putusan dihormati, melainkan apa yang dilakukan pemerintah sesudahnya.
  source_ids: [putusan-mk-91-2021]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-jokowi2-perppu-ciptaker
  term_id: presiden-jokowi-ii
  date: "2022-12"
  category: produk-hukum
  title_id: Perppu Cipta Kerja diterbitkan sebelum revisi selesai
  summary_id: >-
    Tepat dua tahun setelah putusan MK, 30 Desember 2022, pemerintah menerbitkan Perppu
    No. 2/2022 yang menetapkan substansi lama menjadi berlaku kini - padahal revisi UU
    belum tuntas dan uji materi atas Perppu masih akan diajukan. DPR mempercepat
    persetujuan. Langkah ini dibaca luas sebagai jawaban eksekutif kepada penjaga
    konstitusi: putusan Anda benar, tapi kami tetap jalan.
  source_ids: [perppu-2-2022]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-jokowi2-uu-ciptaker-permanen
  term_id: presiden-jokowi-ii
  date: "2023-03"
  category: produk-hukum
  title_id: DPR menetapkan Perppu Cipta Kerja menjadi UU
  summary_id: >-
    31 Maret 2023, DPR mengesahkan Perppu menjadi UU No. 6/2023 meski sejumlah gugatan
    uji materi atas Perppu itu masih hidup di MK. Hakim konstitusi sendiri sempat
    mempertanyakan mengapa pengesahan tidak menunggu putusan. Dengan ini lingkaran
    tertutup: cacat proses yang ditegaskan MK pada 2021 kini menjadi hukum permanen
    tanpa perbaikan prosedur apa pun.
  source_ids: [uu-6-2023]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-jokowi2-rkuhp
  term_id: presiden-jokowi-ii
  date: "2022-12"
  category: produk-hukum
  title_id: RKUHP disahkan menjadi UU No. 1/2023
  summary_id: >-
    6 Desember 2022, DPR mengesahkan KUHP baru - yang pertama bukan warisan kolonial -
    setelah dua kali ditunda karena protes. Pasal-pasal sensitif tetap masuk: kriminalisasi
    kritik terhadap presiden, "hidup bersama sebagai suami-istri di luar nikah", dan
    pengetahuan kontrasepsi oleh pihak ketiga. Presiden menandatanganinya 2 Januari
    2023 dengan catatan bahwa berlaku baru tiga tahun lagi - memberi waktu bagi generasi
    berikutnya untuk merevisinya.
  source_ids: [uu-1-2023]
  dimension_ids: [sila-4, sila-2]

- id: ev-jokowi2-ikn
  term_id: presiden-jokowi-ii
  date: "2022-01"
  category: produk-hukum
  title_id: UU Ibu Kota Negara disahkan
  summary_id: >-
    Disahkan 18 Januari 2022 dalam hitungan pekan, UU No. 3/2022 memindahkan ibu kota ke
    Nusantara, Kalimantan Timur - proyek strategis terbesar pasca-Reformasi dengan estimasi
    Rp466 triliun. Argumennya kuat: pemerataan keluar dari Jawa, ikut risiko Jakarta tenggelam.
    Prosesnya lemah: RUU digodok kilat, kajian alternatif tak dipublikasikan, dan beban
    fiskal di tengah pemulihan pandemi diperdebatkan akademisi fiskal.
  source_ids: [uu-3-2022]
  dimension_ids: [tujuan-2, kedaulatan-rakyat]

- id: ev-jokowi2-whoosh
  term_id: presiden-jokowi-ii
  date: "2023-10"
  category: kebijakan
  title_id: Kereta cepat Whoosh mulai operasi komersial
  summary_id: >-
    2 Oktober 2023, presiden naik kereta cepat pertama Asia Tenggara dari Halim ke Padalarang,
    142 km ditempuh dalam sekitar 45 menit. Whoosh adalah simbol ambisi infrastruktur Jokowi -
    dan simbol polemiknya juga: biaya membengkak dari US$6 miliar, utang korporasi ke Tiongkok
    yang dibayar negara saat gagal bayar, serta pertanyaan apakah proyek prestise ini layak
    dibandingkan investasi transportasi massal Jabodetabek yang lebih menyentuh jutaan rakyat.
  source_ids: [whoosh-kcjb-2023]
  dimension_ids: [tujuan-2]

- id: ev-jokowi2-dinasti-politik
  term_id: presiden-jokowi-ii
  date: "2024-02"
  category: peristiwa
  title_id: Konsolidasi politik dinasti keluarga presiden petahana
  summary_id: >-
    Trilogi yang mengubah lanskap elektoral: Putusan MK 90/2023 membuka jalan Gibran Rakabuming
    (36 tahun) menjadi cawapres; Kaesang Pangarep merebut kursi ketua umum PSI (2023);
    Bobby Nasution dilantik gubernur Sumatera Utara (2025) usai menjabat walikota Medan.
    Keluarga petahana kini menguasai tiga level eksekutif sekaligus. Pengamat tata negara
    menyebutnya pewarisan kekuasaan paling sistematis sejak Orde Baru - sah secara prosedur,
    meragukan secara semangat konstitusi.
  source_ids: [putusan-mk-90-2023, mkmk-anwar-usman-2023, berita-dinasti-politik-2024]
  dimension_ids: [kedaulatan-rakyat, negara-hukum]

# ------------------------ PRESIDEN PRABOWO ------------------------

- id: ev-prabowo-mbg
  term_id: presiden-prabowo
  date: "2025-01"
  category: kebijakan
  title_id: Program Makan Bergizi Gratis dimulai
  summary_id: >-
    6 Januari 2025, program andalan Prabowo beroperasi: makan bergizi gratis untuk
    pelajar, santri, ibu hamil, dan balita melalui Badan Gizi Nasional. Target akhir
    80 juta penerima dengan anggaran yang bisa mencapai Rp400+ triliun per tahun -
    program sosial tunggal termahal dalam sejarah Indonesia. Capaian gizi awal nyata
    di dapur-dapur SPPG; tantangannya serius: kasus keracunan massal berulang, struktur
    biaya yang belum efisien, dan pertanyaan apakah APBN sanggup menanggungnya.
  source_ids: [perpres-83-2024]
  dimension_ids: [sila-5, tujuan-2, tujuan-3]

- id: ev-prabowo-danantara
  term_id: presiden-prabowo
  date: "2025-02"
  category: produk-hukum
  title_id: UU Badan Pengelola Investasi Danantara
  summary_id: >-
    24 Februari 2025 lahir Daya Anagata Nusantara: holding aset BUMN senilai sekitar
    Rp10.000 triliun - salah satu dana kedaulatan terbesar dunia - dijalankan di luar
    mekanisme BUMN biasa. Laporan keuangannya tidak wajib diaudit BPK; presiden dan
    menteri menduduki posisi penasihat. ICW dan ekonomi menyebutnya potensi "zona
    abu-abu akuntabilitas" terbesar dekade ini. Sejarah SOE Indonesia memberi alasan
    untuk waspada.
  source_ids: [uu-danantara-2025]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-prabowo-agustus-2025
  term_id: presiden-prabowo
  date: "2025-08"
  category: krisis
  title_id: Gelombang protes nasional Agustus 2025
  summary_id: >-
    Kematian Affan Kurniawan - ojek daring yang dilindas kendaraan Brimob saat aksi 28 Agustus -
    menyulut kemarahan nasional terbesar era Prabowo. Aksi meluas dari tunjangan DPR ke
    isu pengangguran dan kesenjangan; gedung DPRD di beberapa daerah dibakar; Komnas HAM
    mencatat sepuluh korban jiwa dan ribuan luka dalam penindakan. Presiden membatalkan
    sejumlah fasilitas pejabat dan menahan beberapa polisi. Titik uji klasik: apakah
    reformasi polri akhirnya benar-benar dimulai.
  source_ids: [komnas-ham-protes-agustus-2025]
  dimension_ids: [sila-2, sila-4]

# ============================ DPR RI ============================

- id: ev-dpr99-amandemen-uud
  term_id: dpr-1999-2004
  date: "2002-08"
  category: produk-hukum
  title_id: Empat tahap amandemen UUD 1945 diselesaikan
  summary_id: >-
    Dalam empat sidang tahunan (1999-2002), MPR menulis ulang konstitusi paling
    fundamental sejak 1945: pembatasan masa jabatan presiden, pilpres langsung,
    Bab HAM lengkap 10 pasal, Mahkamah Konstitusi, Komisi Yudisial, BPK modern,
    pemakzulan berprosedur, dan penghapusan DPA. Tidak ada satu pun korban nyawa -
    kebalikan dari perubahan konstitusi di banyak negara. Reformasi konstitusi paling
    damai dan menyeluruh di dunia pasca-Soviet.
  source_ids: [tap-amandemen-uud-1999-2002, uud-nri-1945]
  dimension_ids: [checks-balances, kedaulatan-rakyat, sila-4]

- id: ev-dpr99-kpk
  term_id: dpr-1999-2004
  date: "2002-12"
  category: produk-hukum
  title_id: DPR mengesahkan UU KPK
  summary_id: >-
    Banyak fraksi awalnya keberatan memberi satu lembaga kewenangan penyadapan
    sekaligus penuntutan - "terlalu berbahaya", kata mereka. Akhirnya disahkan dengan
    desain super-ketat: hanya boleh menangani kasus besar, melibatkan aparat lain,
    dan mengawasi pejabat penegak hukum juga. Produk legislasi antikorupsi paling
    berdampak dalam sejarah Indonesia ini kelak menjadi target revisi yang sama
    parlemen yang melahirkannya.
  source_ids: [uu-30-2002]
  dimension_ids: [negara-hukum]

- id: ev-dpr99-pilpres-langsung
  term_id: dpr-1999-2004
  date: "2003-07"
  category: produk-hukum
  title_id: DPR mengesahkan UU Pilpres langsung
  summary_id: >-
    Pertarungan sengit antara elite partai yang ingin mempertahankan hak memilih
    presiden di MPR versus tuntutan publik atas amandemen konstitusi. Rakyat menang:
    UU No. 23/2003 menetapkan pilpres langsung mulai 2004. Legislator yang sama yang
    menikmati legitimasi MPR rela melepasnya - salah satu momen langka parlemen
    Indonesia mengurangi kekuasaannya sendiri.
  source_ids: [uu-23-2003]
  dimension_ids: [kedaulatan-rakyat]

- id: ev-dpr04-ky
  term_id: dpr-2004-2009
  date: "2004-08"
  category: produk-hukum
  title_id: UU Komisi Yudisial
  summary_id: >-
    Mandat Pasal 24B hasil amandemen ketiga diwujudkan Agustus 2004: KY lahir sebagai
    pencari utama hakim agung dan pengawas etik hakim. Sejak itu KY menerima puluhan
    ribu laporan masyarakat tentang perilaku hakim - meski giginya tumpul oleh Putusan
    MK 005/PUU-IV/2006 yang mencabut wewenangnya atas hakim konstitusi dan membatasi
    rekomendasi terhadap MA. Pengawasan eksternal atas kehakiman tetap setengah jadi
    sampai hari ini.
  source_ids: [uu-27-2004]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-dpr04-kepemilihan
  term_id: dpr-2004-2009
  date: "2007-04"
  category: produk-hukum
  title_id: UU Penyelenggara Pemilihan Umum
  summary_id: >-
    Setelah KPU terjerat skandal logistik pemilu 2004, DPR merespons dengan arsitektur
    baru: KPU dan Bawaslu dipisahkan, anggota diseleksi independen lewat tim penguji,
    dana digelontorkan via kanal khusus. Model "penyelenggara ganda" ini ditiru beberapa
    negara. Kepercayaan pada pemilu pulih bertahap - hingga generasi berikutnya
    memperdebatkan lagi siapa yang boleh menunjuk penyelenggara.
  source_ids: [uu-22-2007]
  dimension_ids: [sila-4]

- id: ev-dpr04-tipikor
  term_id: dpr-2004-2009
  date: "2009-09"
  category: produk-hukum
  title_id: UU Pengadilan Tipikor
  summary_id: >-
    Melengkapi KPK dengan ruang sidang khusus: majelis campuran hakim karier-ad-hoc,
    beban pembalikan beban pembuktian, dan proses cepat. Pengadilan Tipikor menjadi
    panggung publik tempat ratusan pejabat - bupati, gubernur, menteri, anggota DPR
    sendiri - dipenjara. Efisiensinya tinggi; kritiknya konsisten: vonis ringan dan
    seragam dibanding kerugian negara yang dicabut dari negara.
  source_ids: [uu-46-2009]
  dimension_ids: [negara-hukum]

- id: ev-dpr04-ite-disahkan
  term_id: dpr-2004-2009
  date: "2008-03"
  category: produk-hukum
  title_id: UU ITE disahkan dengan pasal yang kelak dipersoalkan
  summary_id: >-
    DPR mengesahkan undang-undang pertama tentang dunia digital tanpa membayangkan
    bahwa satu pasalnya akan mengubah hidup ribuan orang. Pasal 27 ayat (3) tentang
    "pencemaran nama baik" lewat elektronik menjadi pasal paling dilaporkan dalam
    hukum pidana Indonesia modern. Parlemen butuh 12 tahun untuk akhirnya merevisi
    pasal-pasal itu - setelah ratusan nyawa dan karier hancur.
  source_ids: [uu-11-2008]
  dimension_ids: [sila-4]

- id: ev-dpr09-bpjs
  term_id: dpr-2009-2014
  date: "2011-11"
  category: produk-hukum
  title_id: DPR mengesahkan UU BPJS
  summary_id: >-
    Setelah sembilan tahun UU SJSN tak punya anak implementasi, tekanan serikat buruh
    dan putusan pengadilan memaksa DPR menyelesaikan UU BPJS November 2011. Lima UU
    lama dicabut; sistem asuransi sosial pecahan era kolonial dilebur menjadi dua badan
    nasional. Salah satu contoh jarang di mana mobilisasi publik benar-benar menentukan
    agenda legislasi.
  source_ids: [uu-24-2011]
  dimension_ids: [sila-5, tujuan-2]

- id: ev-dpr09-pp3
  term_id: dpr-2009-2014
  date: "2011-08"
  category: produk-hukum
  title_id: UU Pembentukan Peraturan Perundang-undangan
  summary_id: >-
    Kodifikasi proses legislasi yang ditunggu kalangan hukum: hierarki norma, kewajiban
    partisipasi publik, dan aturan harmonisasi. Namun kritik tajam menyasar ketentuan
    yang membuat Perppu bisa "diam-diam sah" jika DPR tak menyatakan penolakan, serta
    hilangnya status khusus bagi beberapa instrumen. UU ini kelak jadi senjata dua
    mata: alat kontrol proses sekaligus celah legalisasi legislasi kilat.
  source_ids: [uu-12-2011]
  dimension_ids: [negara-hukum]

- id: ev-dpr09-md3
  term_id: dpr-2009-2014
  date: "2014-04"
  category: produk-hukum
  title_id: UU MD3 memperkuat posisi pimpinan dewan
  summary_id: >-
    Digodok senyap di rapat-rapat internal pimpinan, disahkan April 2014: MPR-DPR-DPD
    jadi "lembaga negara" beranggaran besar, tunjangan dan fasilitas pimpinan naik
    signifikan, hak inisiatif RUU diperluas. Publik tahu belakangan - saat anggota
    dewan periode berikutnya menikmati fasilitas barunya. Pola legislasi self-serving
    ini menjadi cetakan yang diwariskan sampai revisi MD3 2025.
  source_ids: [uu-17-2014]
  dimension_ids: [checks-balances, kedaulatan-rakyat]

- id: ev-dpr14-des
  term_id: dpr-2014-2019
  date: "2014-09"
  category: produk-hukum
  title_id: UU Desa disahkan
  summary_id: >-
    Disahkan 30 September 2014 di penghujung masa sidang, UU No. 6/2014 mengubah desa
    dari objek pembangunan menjadi subjek pemerintahan: badan permusyawaratan desa,
    APBDes transparan, dan jalur dana langsung yang kelak mencapai Rp100+ triliun setahun.
    Warisan legislasi terbaik periode ini - sekaligus medan uji baru bagi integritas
    ribuan kepala desa.
  source_ids: [uu-6-2014]
  dimension_ids: [sila-5, tujuan-2]

- id: ev-dpr14-pemilu
  term_id: dpr-2014-2019
  date: "2017-08"
  category: produk-hukum
  title_id: UU Pemilihan Umum No. 7/2017
  summary_id: >-
    Kodifikasi elektoral raksasa - 560+ pasal menggabungkan delapan UU lama. Ambang
    batas parlemen 4% dipertahankan meski MK dua kali memperingatkan; pencalonan tetap
    dikunci partai; sanksi pelanggaran administratif diperkuat dengan pembubaran partai.
    Undang-undang yang menyelenggarakan pemilu 2019 dan 2024 ini juga menjadi akar
    gugatan ambang batas yang dimenangkan petisi di MK pada 2024.
  source_ids: [uu-7-2017]
  dimension_ids: [sila-4, kedaulatan-rakyat]

- id: ev-dpr14-revisi-kpk
  term_id: dpr-2014-2019
  date: "2019-09"
  category: produk-hukum
  title_id: Revisi UU KPK melemahkan independensi
  summary_id: >-
    Disepakati empat fraksi koalisi dalam hitungan pekan, disahkan 17 September 2019:
    KPK jadi "lembaga negara" (bukan independen), pegawai di-ASN-kan, Dewan Pengarah
    beranggotapolitisi dibentuk, izin penyadapan butuh persetujuan eksternal, dan masa
    jabatan pimpinan diperpendek untuk mengganti semua pemimpinnya. Jutaan tanda tangan
    online dan aksi mahasiswa nasional menolaknya - DPR tetap jalan. Kinerja penindakan
    KPK anjlok tajam dalam dua tahun berikutnya.
  source_ids: [uu-19-2019, laporan-komnas-ham-aktivis-2019]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-dpr19-ciptaker-legislasi
  term_id: dpr-2019-2024
  date: "2020-02"
  category: produk-hukum
  title_id: UU Cipta Kerja lahir dari proses dipercepat
  summary_id: >-
    Dua bulan konsultasi publik simbolik untuk paket regulasi 944 halaman yang mengubah
    perizinan, ketenagakerjaan, dan lingkungan hidup sekaligus. Draf final tidak
    dipublikasikan saat dewan bicara; amandemen dadakan masuk di jam-jam akhir. Putusan
    MK 91/2021 kemudian merinci cacat formalnya secara telak - dokumen yang jadi bukti
    klasik di fakultas hukum tentang bagaimana JANGAN membuat undang-undang.
  source_ids: [uu-11-2020, putusan-mk-91-2021]
  dimension_ids: [checks-balances, kedaulatan-rakyat]

- id: ev-dpr19-pdp
  term_id: dpr-2019-2024
  date: "2022-09"
  category: produk-hukum
  title_id: UU Pelindungan Data Pribadi disahkan
  summary_id: >-
    Setelah enam tahun tertunda, Indonesia akhirnya punya hukum data pribadi (UU No.
    27/2022): hak subjek data, kewajiban pengendali, denda hingga 2% pendapatan tahunan,
    dan pidana untuk pembocoran. Lahir di tengah kebocoran data SIM, BPJS, dan KPU yang
    memalukan. Taringnya masih ditanyakan: lembaga pengawasnya belum jelas dan penegakan
    pertama lambat - tapi kerangkanya setara GDPR regional.
  source_ids: [uu-27-2022]
  dimension_ids: [sila-4]

- id: ev-dpr19-rkuhp-final
  term_id: dpr-2019-2024
  date: "2022-12"
  category: produk-hukum
  title_id: RKUHP disahkan menjadi UU No. 1/2023
  summary_id: >-
    6 Desember 2022, delapan fraksi mengangkat tangan mengesahkan KUHP baru - pertama
    kali bukan warisan kolonial. Kemajuan substansi nyata (hukum adat diakui, pidana mati
    jadi "ancaman alternatif"), tapi pasal-pasal sensitif lolos: kritik presiden, kohabitasi
    di luar nikah, promosi kontrasepsi. Presiden menandatanganinya dengan penundaan
    pemberlakuan tiga tahun - de facto mengundang generasi berikutnya merevisi.
  source_ids: [uu-1-2023]
  dimension_ids: [sila-4, sila-2]

- id: ev-dpr19-uu-ciptaker-permanen
  term_id: dpr-2019-2024
  date: "2023-03"
  category: produk-hukum
  title_id: UU No. 6/2023 penetapan Perppu Cipta Kerja
  summary_id: >-
    Meski uji materi atas Perppu masih berjalan, DPR mengesahkannya jadi undang-undang
    permanen 31 Maret 2023. Hakim konstitusi sendiri bertanya-tanya kenapa tidak menunggu.
    Siklus yang dimulai dari putusan MK 91/2021 berakhir tanpa satu pun perbaikan prosedur
    partisipasi - pesan institusional yang mengkhawatirkan bagi kepatuhan antarlembaga.
  source_ids: [uu-6-2023]
  dimension_ids: [checks-balances, negara-hukum]

- id: ev-dpr19-kesehatan-omnibus
  term_id: dpr-2019-2024
  date: "2023-08"
  category: produk-hukum
  title_id: UU Kesehatan omnibus disahkan cepat
  summary_id: >-
    Sembilan UU kesehatan dilebur jadi satu dalam waktu singkat; IDI dan organisasi profesi
    memprotes pasal yang membuka praktik asing massal dan mengubah struktur dinas. DPR
    menjalankan proses tanpa mendengar bantahan substantif serius. Pola omnibus kedua -
    efisien di atas kertas, rapuh di legitimasi profesional lapangan.
  source_ids: [uu-17-2023]
  dimension_ids: [checks-balances, tujuan-2]

- id: ev-dpr24-revisi-pemilu-mk60
  term_id: dpr-2024-2029
  date: "2024-11"
  category: produk-hukum
  title_id: Revisi UU Pemilu mematuhi Putusan MK No. 60/PUU-XI/2024
  summary_id: >-
    Menyusul putusan MK yang menyatakan ambang batas parlemen inkonstitusional untuk
    pemilu mendatang, DPR menyusun revisi UU Pemilu pada November 2024 - salah satu
    contoh jarang kepatuhan cepat parlemen terhadap putusan penjaga konstitusi dalam
    hal yang mengurangi keuntungan partai besar. Detail implementasinya masih akan
    diperjuangkan di ruang-ruang komisi.
  source_ids: [putusan-mk-60-2024]
  dimension_ids: [checks-balances]

- id: ev-dpr24-revisi-md3
  term_id: dpr-2024-2029
  date: "2025-03"
  category: produk-hukum
  title_id: Revisi UU MD3 disahkan di tengah protes
  summary_id: >-
    20 Maret 2025, DPR mengesahkan revisi MD3 yang memperbesar hak anggota: tunjangan
    rumah dinas Rp50 juta/bulan, perluasan fasilitas, dan mekanisme internal yang lebih
    tertutup. Disahkan sambil mahasiswa dan warga berdemo di gerbang parlemen menolaknya.
    Presiden awalnya menandatanganinya, lalu dinamika publik Agustus memaksa pencabutan
    tunjangan kontroversial itu oleh pimpinan DPR sendiri.
  source_ids: [revisi-md3-2025]
  dimension_ids: [kedaulatan-rakyat, checks-balances]

- id: ev-dpr24-protes-tunjangan
  term_id: dpr-2024-2029
  date: "2025-08"
  category: krisis
  title_id: Gelombang protes nasional soal tunjangan DPR
  summary_id: >-
    Pernyataan anggota DPR soal tunjangan Rp50 juta di tengah PHK massal dan harga kebutuhan
    pokok menjadi bara. Kematian ojek daring Affan Kurniawan dilindas kendaraan Brimob pada
    28 Agustus 2025 mengubah demo standar menjadi gelombang nasional; gedung DPRD beberapa
    daerah terbakar. Dalam hitungan hari, pimpinan DPR mencabut kebijakan tunjangan dan
    presiden membatalkan sejumlah fasilitas pejabat. Rakyat kalah argumen di ruang sidang,
    menang di jalan - dengan harga sepuluh nyawa menurut Komnas HAM.
  source_ids: [komnas-ham-protes-agustus-2025]
  dimension_ids: [kedaulatan-rakyat, sila-4]

# ========================= MAHKAMAH KONSTITUSI =========================

- id: ev-mk1-pelantikan
  term_id: mk-2003-2008
  date: "2003-08"
  category: pengangkatan
  title_id: Majelis MK pertama mulai bertugas
  summary_id: >-
    13 Agustus 2003, sembilan hakim dari tiga jalur pengusulan dilantik - Jimly
    Asshiddiqie menjadi motor penggeraknya sebagai sekretaris jenderal pertama. Dalam
    hitungan bulan, MK membuka sidang uji materi kepada publik dan media - sesuatu yang
    tak pernah dilakukan MA selama puluhan tahun. Standar keterbukaan peradilan Indonesia
    ditulis ulang dari ruang sidang di Jalan Medan Merdeka Barat ini.
  source_ids: [uu-24-2003]
  dimension_ids: [checks-balances, negara-hukum]

- id: ev-mk2-narkoba-46
  term_id: mk-2008-2013
  date: "2010-10"
  category: pengadilan
  title_id: Putusan MK No. 46/PUU-VIII/2010
  summary_id: >-
    Gugatan dua mantan pecandu mengubah paradigma narkotika Indonesia: pecandu adalah
    korban penyakit yang wajib direhabilitasi, bukan penjahat yang dipenjara. Dasar bagi
    UU Narkotika revisi dan jutaan kasus rehabilitasi. Putusan paling humanis dalam sejarah
    MK ini juga menjadi bantalan hukum ketika eksekusi mati terpidana narkoba diperdebatkan -
    logika korban vs pelakunya sendiri sering bertabrakan.
  source_ids: [putusan-mk-46-2010]
  dimension_ids: [sila-2]

- id: ev-mk2-akil-mochtar
  term_id: mk-2008-2013
  date: "2013-10"
  category: krisis
  title_id: Ketua MK Akil Mochtar ditangkap kasus suap
  summary_id: >-
    2 Oktober 2013, KPK menangkap tangan Ketua MK saat menerima uang suap sengketa pilkada
    - pekerjaan sampingannya selama memimpin lembaga tertinggi kehormatan negara. Vonis
    seumur hidup. Kepercayaan publik pada MK jatuh ke titik terendah; jam malam pilkada
    dikeluarkan darurat; reformasi tata kelola etik dimulai dari puing-puing skandal ini.
    Pelajaran abadi: integritas lembaga hanya setinggi integritas manusianya.
  source_ids: [putusan-ma-akil-2014]
  dimension_ids: [negara-hukum]

- id: ev-mk3-pilkada-independen
  term_id: mk-2013-2018
  date: "2015-01"
  category: pengadilan
  title_id: Putusan MK No. 100/PUU-XII/2014
  summary_id: >-
    Jalur pencalonan independen (perseorangan) dibuka kembali untuk pilkada setelah DPR
    menghapusnya dari UU Pilkada - putusan yang melahirkan gelombang calon perseorangan,
    termasuk kelak Jokowi-Ahok era DKI. Pola klasik checks and balances: parlemen menutup
    pintu partisipasi, penjaga konstitusi membukanya lewat jendela.
  source_ids: [putusan-mk-100-2014]
  dimension_ids: [sila-4, kedaulatan-rakyat]

- id: ev-mk4-ciptaker-91
  term_id: mk-2018-2023
  date: "2021-11"
  category: pengadilan
  title_id: Putusan MK 91/PUU-XVIII/2020 menegakkan prosedur legislasi
  summary_id: >-
    Sembilan hakim bulat menyatakan UU Cipta Kerja inkonstitusional bersyarat karena cacat
    formal - draf tidak dipublikasikan, partisipasi publik simbolik. Putusan ini dikutip
    pengadilan konstitusi luar negeri sebagai preseden pentingnya PROSES demokratis, bukan
    hanya isi. Sayangnya, epilog enam belas bulan kemudian (Perppu 2/2022) menunjukkan
    kemenangan prosedur bisa sementara.
  source_ids: [putusan-mk-91-2021]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-mk4-usia-capres
  term_id: mk-2018-2023
  date: "2023-10"
  category: pengadilan
  title_id: Putusan MK No. 90/PUU-XI/2023 soal batas usia
  summary_id: >-
    Atas gugatan Partai Buruh, MK mengubah syarat usia calon presiden-wapres: di bawah
    40 tahun boleh jika "pernah/sedang menjabat kepala daerah yang dipilih pemilu". Pasal
    itu disusun dalam majelis yang ketuanya adalah kakak ipar pasangan calon yang
    langsung diuntungkan - Gibran Rakabuming Raka, wali kota Solo, dicapreskan keesokan
    harinya. Dua hakim menulis dissenting opinion tajam. MKMK kelak menyebut ada konflik
    kepentingan serius yang dilanggar.
  source_ids: [putusan-mk-90-2023]
  dimension_ids: [kedaulatan-rakyat, negara-hukum]

- id: ev-mk4-etik-anwar-usman
  term_id: mk-2018-2023
  date: "2023-11"
  category: krisis
  title_id: Ketua MK Anwar Usman melanggar etik
  summary_id: >-
    November 2023, Majelis Kehormatan Etik MK memberhentikan Anwar Usman dari kursi ketua:
    ia gagal netral dan tidak melaporkan konflik kepentingan dalam perkara yang menguntungkan
    kakak iparnya sendiri. Hakim konstitusi tetap bermajelis; kursi ketua berganti. Skandal
    ini menjadi studi kasus nasional tentang bagaimana kekuasaan menafsirkan konstitusi
    bisa digerogoti dari dalam oleh kepentingan keluarga.
  source_ids: [mkmk-anwar-usman-2023]
  dimension_ids: [negara-hukum, kedaulatan-rakyat]

- id: ev-mk5-ambang-batas
  term_id: mk-2023-sekarang
  date: "2024-11"
  category: pengadilan
  title_id: Putusan MK No. 60/PUU-XI/2024 soal ambang batas
  summary_id: >-
    Petisi empat alumni 1998 (termasuk mantan panglima TNI Gatot Nurmantyo) berhasil:
    MK menyatakan ambang batas parlemen 4% inkonstitusional untuk pemilu mendatang karena
    membatasi kedaulatan rakyat tanpa alasan kuat. DPR merespons dengan revisi UU Pemilu
    November 2024 - salah satu kepatuhan antarlembaga tercepat atas putusan yang mengurangi
    kepentingan partai penguasa dewan.
  source_ids: [putusan-mk-60-2024]
  dimension_ids: [kedaulatan-rakyat]

- id: ev-mk5-lantikan-adies-kadir
  term_id: mk-2023-sekarang
  date: "2026-02"
  category: pengangkatan
  title_id: Adies Kadir dilantik hakim konstitusi di tengah kontroversi
  summary_id: >-
    Setelah DPR menetapkan Inosentius Samsul pada Agustus 2025, Komisi III mendadak
    mengganti kuda hitam: uji kelayakan Adies Kadir - Wakil Ketua DPR aktif dari partai
    penguasa - berlangsung kurang dari 30 menit pada 26 Januari 2026, paripurna menyetujuinya
    keesokan hari, dan pelantikan berlangsung 5 Februari 2026. Akademisi hukum tata negara
    menyebut prosesnya melanggar prinsip transparansi; MKMK memproses laporan etik sementara
    DPR menolak kewenangannya. Politisi berjubah toga resmi duduk di majelis penafsir
    konstitusi.
  source_ids: [berita-adies-kadir-mk-2026]
  dimension_ids: [negara-hukum, kedaulatan-rakyat]

# ================ ERA REVOLUSI & DEMOKRASI LIBERAL ================

- id: ev-soekarno1-proklamasi-uud
  term_id: presiden-soekarno-i
  date: "1945-08-18"
  category: pengangkatan
  title_id: Pengesahan UUD 1945 oleh PPKI
  summary_id: >-
    Sehari setelah proklamasi, PPKI mengesahkan konstitusi pertama republik dan melantik
    Sukarno-Hatta - dalam satu rapat yang juga memutus pembentukan kementerian pertama.
    Konstitusi 65 pasal itu dirancang untuk "masa genting"; tak seorang pun membayangkan
    ia akan berlaku puluhan tahun dengan penyimpangan-penyimpangan besar. Negara lahir
    dengan konstitusi darurat dan semangat yang belum selesai diperdebatkan.
  source_ids: [proklamasi-ppki-1945]
  dimension_ids: [kedaulatan-rakyat]

- id: ev-soekarno1-madiun
  term_id: presiden-soekarno-i
  date: "1948-09"
  category: krisis
  title_id: Peristiwa Madiun 1948
  summary_id: >-
    September 1948, FDR-PKI mendeklarasikan "Republik Soviet" di Madiun saat republik
    terdesak agresi Belanda. Dalam hitungan pekan, konflik bersaudara ini menelan ribuan
    nyawa dari kedua pihak - eksekusi sandera oleh pihak PKI, lalu pemukulan balik oleh
    Siliwangi dan para komandan republik. Luka Madiun menjadi prolog trauma 1965: dua
    kekerasan besar yang saling mengunci ingatan nasional selama setengah abad.
  source_ids: [proklamasi-ppki-1945]
  dimension_ids: [sila-2]

- id: ev-soekarno1-kmb
  term_id: presiden-soekarno-i
  date: "1949-12"
  category: kebijakan
  title_id: Konferensi Meja Bundar dan pengakuan kedaulatan
  summary_id: >-
    Setelah empat tahun perang dan diplomasi - dari Linggarjati yang diangkat senjata,
    Renville yang dikhianati, hingga serangan umum 1 Maret 1949 yang membuat dunia malu -
    Belanda akhirnya duduk di meja bundar Den Haag. 27 Desember 1949 kedaulatan diserahkan.
    Harga-harganya menyakitkan: negara federal RIS sementara dan isu Irian Barat yang
    ditunda - dua bom waktu ketatanegaraan yang meledak bertahun-tahun kemudian.
  source_ids: [konferensi-meja-bundar-1949]
  dimension_ids: [tujuan-1]

- id: ev-soekarno1-nkri-uuds
  term_id: presiden-soekarno-i
  date: "1950-08"
  category: produk-hukum
  title_id: Kembalinya NKRI dan berlakunya UUDS 1950
  summary_id: >-
    Dalam hitungan bulan, republik menyerap negara-negara bagian RIS - sebagian lewat
    perundingan damai, sebagian lewat tekanan tentara - dan pada 17 Agustus 1950 kembali
    menjadi negara kesatuan dengan konstitusi baru bergaya parlementer. Demokrasi kabinet
    lima tahun berikutnya menghasilkan tujuh kabinet jatuh-bangun, tapi juga pers bebas,
    parlemen hidup, dan pemilu terbaik di Asia Tenggara. Eksperimen demokrasi pertama:
    gagal secara stabilitas, patut dicontoh secara kebebasan.
  source_ids: [uuds-1950]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-soekarno1-pemilu-1955
  term_id: presiden-soekarno-i
  date: "1955-09"
  category: peristiwa
  title_id: Pemilu nasional pertama
  summary_id: >-
    September sampai Desember 1955, 37 juta pemilih - 91% partisipasi - memberikan suara
    tanpa paksaan di negeri yang separuhnya buta huruf. Empat partai besar berbagi suara
    hampir merata; tidak ada pemenang mutlak, dan itulah potret masyarakat Indonesia yang
    sesungguhnya. Pengamat asing menyebutnya pemilu terbersih di Asia pasca-kolonial.
    Ironisnya, hasilnya justru dianggap bencana oleh elite yang ingin Indonesia lebih
    "tegas" - dan delapan tahun kemudian demokrasi ini dimatikan.
  source_ids: [pemilu-1955]
  dimension_ids: [sila-4, kedaulatan-rakyat]

- id: ev-soekarno1-kaa
  term_id: presiden-soekarno-i
  date: "1955-04"
  category: kebijakan
  title_id: Konferensi Asia-Afrika Bandung
  summary_id: >-
    April 1955, 29 negara Asia-Afrika - mayoritas baru merdeka - berkumpul di Gedung
    Merdeka Bandung atas prakarsa Indonesia. Komunike sepuluh poinnya menjadi embrio
    Gerakan Non-Blok dan bahasa bersama dunia ketiga: anti-kolonialisme, perdamaian,
    kesetaraan bangsa. Nehru, Nasser, Zhou Enlai berjalan bersama di kota yang dingin.
    Satu-satunya momen Indonesia benar-benar memimpin tatanan dunia - warisan yang masih
    dikutip diplomat hingga hari ini.
  source_ids: [kaa-bandung-1955]
  dimension_ids: [tujuan-4]

# ==================== DEMOKRASI TERPIMPIN ====================

- id: ev-soekarno2-dekrit
  term_id: presiden-soekarno-ii
  date: "1959-07"
  category: krisis
  title_id: Dekrit Presiden 5 Juli 1959
  summary_id: >-
    Konstituante buntu dua tahun memperdebatkan dasar negara; kabinet jatuh-bangun.
    Solusinya bukan musyawarah melainkan maklumat: 5 Juli 1959 Sukarno membubarkan
    Konstituante hasil pemilu, memberlakukan kembali UUD 1945 yang kekuasaan eksekutifnya
    paling besar. Demokrasi parlementer Indonesia mati bukan oleh kudeta, tapi oleh dekrit -
    dengan TNI dan PKI berebut mendekat ke pusat kekuasaan baru.
  source_ids: [dekrit-presiden-1959]
  dimension_ids: [checks-balances, negara-hukum]

- id: ev-soekarno2-irian-barat
  term_id: presiden-soekarno-ii
  date: "1962-08"
  category: kebijakan
  title_id: New York Agreement dan pengembalian Irian Barat
  summary_id: >-
    Trikora dan diplomasi keras memaksa Belanda menandatangani New York Agreement (Agustus
    1962): Irian Barat lewat administrasi PBB masuk ke Indonesia pada 1963 - penepian
    kedaulatan paling emosional bagi revolusi. Catatan gelapnya menetap: janji penentuan
    nasib sendiri bagi orang Papua baru "dilaksanakan" lewat Pepera 1969 dengan seribu
    tangan terpilih, proses yang dipersoalkan dunia hingga kini.
  source_ids: [new-york-agreement-1962]
  dimension_ids: [tujuan-1, sila-3]

- id: ev-soekarno2-konfrontasi
  term_id: presiden-soekarno-ii
  date: "1963-09"
  category: kebijakan
  title_id: Dwikora dan konfrontasi dengan Malaysia
  summary_id: >-
    "Ganyang Malaysia" menggerakkan massa sambil menghancurkan ekonomi. Konfrontasi militer
    tiga tahun - penyusupan Kalimantan, serangan Semenanjung Singapura, hingga Indonesia
    keluar dari PBB (1965) - menguras kas negara, mengisolasi diplomasi, dan memperkaya
    para komandan. Warisan yang diterima Soeharto adalah kehancuran total: inflasi menuju
    600% dan cadangan devisa nyaris kosong.
  source_ids: [dwikora-konfrontasi-1963]
  dimension_ids: [tujuan-4, sila-3]

- id: ev-soekarno2-gestapu
  term_id: presiden-soekarno-ii
  date: "1965-10"
  category: krisis
  title_id: G30S dan gelombang kekerasan 1965-1966
  summary_id: >-
    Pagi 1 Oktober 1965 enam jenderal dibunuh; malamnya Mayjen Suharto menguasai Jakarta.
    Berikutnya adalah salah satu pembunuhan massal tercepat abad ke-20: dalam lima bulan,
    ratusan ribu sampai sejuta orang dicurigai simpatisan PKI dibunuh oleh pasukan,
    kelompok agama, dan warga yang dimobilisasi - didokumentasikan Komnas HAM sebagai
    pelanggaran HAM berat sistemik. Sukarno menyaksikan kekuasaannya terkikis peristiwa
    demi peristiwa; kebenaran historis masih diperjuangkan korban hingga hari ini.
  source_ids: [komnas-ham-temuan-1965]
  dimension_ids: [sila-2, tujuan-1]

- id: ev-soekarno2-supersemar
  term_id: presiden-soekarno-ii
  date: "1966-03"
  category: krisis
  title_id: Supersemar
  summary_id: >-
    11 Maret 1966, di tengah rumor kudeta dan suasana panik Istana Bogor, Sukarno
    menandatangani surat perintah kepada Mayjen Suharto untuk "memulihkan keamanan dan
    ketertiban". Naskah aslinya hilang - hanya salinan di Arsip Nasional; misteri arsip
    paling terkenal republik. Dalam sembilan belas bulan, satu lembar surat itu ditafsirkan
    menjadi mandat membubarkan PKI, membersihkan kabinet, lalu merebut kursi presiden itu
    sendiri.
  source_ids: [supersemar-1966]
  dimension_ids: [checks-balances]

# ======================= ORDE BARU =======================

- id: ev-soeharto-tap-iii-1967
  term_id: presiden-soeharto
  date: "1967-03"
  category: produk-hukum
  title_id: TAP MPRS III/MPRS/1967 - Suharto menjadi Pejabat Presiden
  summary_id: >-
    Sidang Istimewa MPRS mencabut mandat Sukarno dan menunjuk Jenderal Suharto sebagai
    Pejabat Presiden; setahun kemudian dilantik penuh. MPRS yang banyak diisi unsur militer
    menjadi mesin legitimasi: apa yang tak bisa didapat lewat pemilu didapat lewat sidang.
    Pola "MPR sebagai penentu arah" berjalan mulus tiga puluh tahun - sampai mahasiswa 1998
    turun ke jalan.
  source_ids: [tap-mprs-iii-1967]
  dimension_ids: [checks-balances]

- id: ev-soeharto-inpres-14
  term_id: presiden-soeharto
  date: "1967-12"
  category: kebijakan
  title_id: Inpres 14/1967 membatasi tradisi dan kepercayaan Tionghoa
  summary_id: >-
    Satu instruksi presiden menutup sekolah, media, dan ritual keagamaan Tionghoa:
    barongsai dilarang, Imlek dirayakan diam-diam, nama Tionghoa dipaksa diganti. Selama
    32 tahun jutaan warga keturunan hidup dengan kodifikasi diskriminasi resmi - baru dicabut
    Gus Dur pada 2000. Bukti bahwa satu lembar birokrasi bisa mewariskan trauma lintas
    generasi.
  source_ids: [inpres-14-1967]
  dimension_ids: [sila-1, sila-3]

- id: ev-soeharto-fusi-partai
  term_id: presiden-soeharto
  date: "1973-01"
  category: kebijakan
  title_id: Fusi paksa partai politik
  summary_id: >-
    Januari 1973, sepuluh partai Islam dilebur paksa menjadi PPP; lima partai nasionalis
    dan Kristen menjadi PDI; Golkar berdiri sebagai kendaraan pemerintah tanpa oposisi
    efektif. Dari sembilan partai pemilu 1955, rakyat kini cuma punya tiga pilihan yang dua
    di antaranya dikendalikan istana. Fondasi hegemoni politik Orde Baru diletakkan lewat
    tekanan, bukan musyawarah.
  source_ids: [fusi-partai-1973]
  dimension_ids: [sila-4, kedaulatan-rakyat]

- id: ev-soeharto-sd-inpres
  term_id: presiden-soeharto
  date: "1973-04"
  category: kebijakan
  title_id: Program SD Inpres membangun puluhan ribu sekolah
  summary_id: >-
    Rezeki minyak 1973 dilempar ke desa: puluhan ribu sekolah dasar dibangun dalam beberapa
    tahun - salah satu ekspansi pendidikan tercepat di dunia berkembang. Angka partisipasi SD
    melonjak dari sekitar separuh anak ke hampir universal; Bank Dunia menjadikannya studi
    kasus klasik. Kritiknya menyusul lama kemudian: gedung ada, guru dan mutu mengikuti dengan
    tertinggal satu generasi.
  source_ids: [sd-inpres-1973]
  dimension_ids: [tujuan-3]

- id: ev-soeharto-timtim
  term_id: presiden-soeharto
  date: "1976-07"
  category: produk-hukum
  title_id: Integrasi Timor Timur lewat UU No. 7/1976
  summary_id: >-
    Delapan belas hari setelah invasi Desember 1975 yang tak disetujui DK PBB, "petisi
    integrasi" diselenggarakan dan UU No. 7/1976 menyatakan Timor Timur provinsi ke-27.
    Operasi militer panjang dan kelaparan yang dibatasi akses bantuan menelan korban yang
    ditaksir hingga ratusan ribu - proporsionalitas yang membuatnya salah satu tragedi
    terbesar dekade ini. PBB tetap mengakui Portugal sebagai kuasa pengurus sampai 2002.
  source_ids: [uu-7-1976]
  dimension_ids: [sila-2, tujuan-4]

- id: ev-soeharto-asas-tunggal
  term_id: presiden-soeharto
  date: "1985-08"
  category: produk-hukum
  title_id: UU Ormas 8/1985 - Pancasila asas tunggal
  summary_id: >-
    Seluruh organisasi massa dan partai wajib Pancasila sebagai asas tunggal; PNS wajib
    monoloyalitas. Kaderisasi P4 masuk sekolah dan kantor; siapa yang ragu dicurigai.
    Konsep ideologi yang dirancang penyatuan berubah menjadi instrumen ujian kesetiaan
    politik - dan dicabut barulah oleh MPR pada 2000. Contoh sempurna bagaimana nilai luhur
    bisa dijadikan alat kontrol.
  source_ids: [uu-8-1985]
  dimension_ids: [sila-4, kedaulatan-rakyat]

- id: ev-soeharto-swasembada
  term_id: presiden-soeharto
  date: "1984-11"
  category: kebijakan
  title_id: Swasembada beras diakui FAO
  summary_id: >-
    1984 Indonesia - negara pengimpor beras terbesar dunia - mencapai swasembada; FAO
    menganugerahkan medali kepada Soeharto pada 1985. Hasil kombinasi intensifikasi massal,
    subsidi pupuk, dan insentif harga bagi petani. Kemiskinan turun dari sekitar enam puluh
    persen (1970) ke belasan persen (1990-an) - capaian kesejahteraan nyata rezim ini,
    yang sayangnya dibayar oleh utang luar negeri dan oligarki cronies yang tumbuh paralel
    di sektor-sektor sama.
  source_ids: [fao-swasembada-1985]
  dimension_ids: [sila-5, tujuan-2]

- id: ev-soeharto-mej-1998
  term_id: presiden-soeharto
  date: "1998-05"
  category: krisis
  title_id: Krismon, Trisakti, kerusuhan Mei, dan lengsernya Soeharto
  summary_id: >-
    Rupiah anjlok dari Rp2.500 ke Rp16.000 per dolar; perusahaan runtuh; PHK jutaan orang.
    Penembakan Trisakti 12 Mei 1998 menewaskan empat mahasiswa; dua hari kemudian kerusuhan
    Mei membakar Jakarta - TGPF mencatat 1.190 orang tewas dan puluhan perempuan Tionghoa
    diperkosa secara sistematis. 21 Mei 1998, Soeharto mengucapkan lengser di Istana Merdeka,
    didampingi Habibie. Tiga puluh dua tahun berakhir dalam delapan menit pidato - dan
    akuntabilitas atas segala yang terjadi belum pernah benar-benar datang.
  source_ids: [tgpf-mei-1998]
  dimension_ids: [sila-2, kedaulatan-rakyat]

- id: ev-dpr24-calon-hakim-mk
  term_id: dpr-2024-2029
  date: "2026-01"
  category: krisis
  title_id: DPR mengganti calon hakim konstitusi lewat proses kilat
  summary_id: >-
    Agustus 2025, paripurna sudah menetapkan Inosentius Samsul sebagai calon hakim konstitusi
    pengganti Arief Hidayat. Januari 2026, Komisi III mendadak membatalkannya dan menjalankan
    uji kelayakan Adies Kadir - Wakil Ketua DPR dari partai penguasa - dalam rapat kurang dari
    tiga puluh menit; paripurna menyetujui keesokan harinya. Tanpa seleksi terbuka, tanpa
    pendalaman publik. Akademisi menyebut proses ini melanggar prinsip keterbukaan yang menjadi
    justru tugas lembaga yang diusulkannya.
  source_ids: [berita-adies-kadir-mk-2026]
  dimension_ids: [kedaulatan-rakyat, negara-hukum]

# ========================= MAHKAMAH AGUNG =========================

- id: ev-ma-pembentukan
  term_id: ma-revolusi-liberal
  date: "1946-08"
  category: pengangkatan
  title_id: Mahkamah Agung dibentuk lewat UU No. 1 Tahun 1946
  summary_id: >-
    Tujuh bulan setelah proklamasi, republik yang sedang berperang tetap menulis
    undang-undang tentang mahkamah agungnya; Sutjipto dilantik sebagai ketua pertama.
    Di masa demokrasi liberal, MA cukup dihormati hingga sanggup membebaskan terdakwa
    yang tidak disukai pemerintah - kenangan yang kelak membuat Orde Baru memastikan
    hal serupa tak terulang.
  source_ids: [uu-1-1946, sejarah-ma-arsip]
  dimension_ids: [negara-hukum]

- id: ev-ma-dikooptasi-orba
  term_id: ma-dt-orde-baru
  date: "1980-01"
  category: krisis
  title_id: Peradilan tunduk pada eksekutif sepanjang Orde Baru
  summary_id: >-
    Secara organisasi MA berada di bawah Departemen Kehakiman; karier, gaji tunjangan,
    bahkan pensiun hakim ditentukan eksekutif. Perkara sensitif - Malari, media yang
    dibredel, tanah rakyat untuk proyek - nyaris selalu dimenangkan penguasa; advokat
    berani seperti Adnan Buyung Nasution justru diberhentikan. Supremasi hukum menjadi
    slogan pidato, bukan realitas persidangan.
  source_ids: [sejarah-ma-arsip, tap-mprs-iii-1967]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-ma-otonomi-penuh
  term_id: ma-reformasi-sekarang
  date: "2004-03"
  category: produk-hukum
  title_id: Otonomi organisasi penuh MA lepas dari eksekutif
  summary_id: >-
    Pasca-amandemen konstitusi, 31 Maret 2004 tanggung jawab pembinaan MA resmi lepas
    dari Departemen Kehakiman ke MA sendiri (dikonsolidasikan UU No. 48/2009). Untuk
    pertama kali sejak 1946 karier hakim tidak lagi ditentukan menteri politik.
    Independensi struktural tercapai - budaya internal dan kas-kusuen butuh waktu
    lebih lama direformasi.
  source_ids: [uu-48-2009]
  dimension_ids: [checks-balances, negara-hukum]

- id: ev-ma-suap-hakim-modern
  term_id: ma-reformasi-sekarang
  date: "2017-09"
  category: krisis
  title_id: Serangkaian OTT suap hakim dari Bandar Jiwa hingga PN Tipikor
  summary_id: >-
    Reformasi organisasi tidak otomatis membersihkan manusianya: OTT KPK menangkap hakim
    Bandar Jiwa Suanto (2017), disusul gelombang penangkapan hakim dan panitera Pengadilan
    Tipikor daerah (2023-2025) yang memperlihatkan pasar vonis terselubung. Laporan tahunan
    KY mencatat ribuan aduan etik per tahun dengan sanksi berat yang jarang sampai
    pemberhentian. Independensi sudah ada; integritas masih dalam peradilan panjang.
  source_ids: [laporan-ky-tahunan]
  dimension_ids: [negara-hukum]

- id: ev-prabowo-bop
  term_id: presiden-prabowo
  date: "2026-01"
  category: kebijakan
  title_id: Indonesia bergabung ke Board of Peace Gaza pimpinan Trump
  summary_id: >-
    22 Januari 2026 di Davos, Prabowo menandatangani Board of Peace Charter - badan baru
    ciptaan Trump untuk mengawasi administrasi, stabilisasi, dan rekonstruksi Gaza lewat
    mandat Resolusi DK PBB 2803 (2025). Keanggotaan diundang langsung oleh sang ketua;
    pada 11 Februari Netanyahu pun menandatanganinya, membuat negara pendudukan duduk satu
    meja dengan negara yang konstitusinya mewajibkan pembebasan Palestina. Pemerintah
    membaca langkah ini sebagai jalan mendorong solusi dua negara dari dalam; pakar hukum
    internasional membalas tajam - struktur pengawasan atas wilayah terjajara tanpa
    kedaulatan Palestina penuh "menyerupai kolonialisme", dan sejumlah kalangan mendesak
    Indonesia keluar sebagai pengkhianatan politik bebas-aktif. Pertemuan perdana BoP
    digelar 19 Februari di Washington dengan Prabowo hadir.
  source_ids: [setpres-bop-charter-2026, kritik-bop-pakar-2026]
  dimension_ids: [tujuan-4]

# ------------- TAMBAHAN HISTORIS & PERIODE BERJALAN -------------

- id: ev-soekarno1-serangan-umum
  term_id: presiden-soekarno-i
  date: "1949-03"
  category: peristiwa
  title_id: Serangan Umum 1 Maret 1949
  summary_id: >-
    Enam jam republik merebut kembali Yogyakarta dari tangan Belanda - lalu sengaja
    melepasnya lagi. Serangan yang dipimpin Letkol Soeharto ini bukan soal mempertahankan
    kota, melainkan bukti kepada dunia bahwa TNI masih hidup dan pemerintah republik
    berdaulat, membantah propaganda Belanda tentang "republik yang sudah hancur". Tekanan
    internasional bergeser dalam hitungan pekan; jalannya menuju KMB terbuka lebar.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [tujuan-1]

- id: ev-soekarno1-di-tii
  term_id: presiden-soekarno-i
  date: "1949-08"
  category: krisis
  title_id: Pemberontakan DI/TII Kartosuwiryo (1949-1962)
  summary_id: >-
    Agustus 1949, S.M. Kartosuwiryo memproklamasikan Negara Islam Indonesia di Jawa Barat -
    pemberontakan yang menyebar ke Sulawesi Selatan dan Kalimantan Selatan serta menggigit
    belasan tahun. Ditumpas dengan operasi militer panjang; Kartosuwiryo ditangkap 1962 dan
    dieksekusi. Warisannya dua sisi: negara menegaskan bahwa syariat tidak boleh dipaksakan
    lewat senjata, sekaligus meninggalkan catatan pelanggaran kedua belah pihak yang jarang
    dibicarakan.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [sila-1, sila-3]

- id: ev-soekarno1-prri-permesta
  term_id: presiden-soekarno-i
  date: "1958-02"
  category: krisis
  title_id: Pemberontakan PRRI/Permesta
  summary_id: >-
    Februari 1958, perwira menengah Sumatera Tengah dan Sulawesi Utara memberontak - bukan
    demi separatisme, melainkan protes dana pembangunan yang tak pernah sampai ke daerah
    penghasil devisa. Dalam lima bulan pemberontakan militer ditumpam, tetapi keluhannya
    tidak pernah dijawab; malah jadi dalil bagi sentralisasi makin ketat. PRRI/Permesta adalah
    tagihan otonomi daerah yang baru dibayar Indonesia empat puluh tahun kemudian.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [sila-3, tujuan-2]

- id: ev-soeharto-transmigrasi
  term_id: presiden-soeharto
  date: "1975"
  category: kebijakan
  title_id: Transmigrasi skala besar era minyak
  summary_id: >-
    Dengan uang migas, ratusan ribu keluarga Jawa-Bali dipindahkan ke Sumatera, Kalimantan,
    dan Papua dengan janji tanah dan hidup baru. Di satu sisi kemiskinan pedesaan Jawa
    tertolong; di sisi lain program ini menjadi mesin konflik agraria - hak ulayat adat
    digilir untuk transmigran, masyarakat lokal menjadi minoritas di kampung sendiri.
    Kebijakan yang menolong sekaligus merampas, tergantung Anda lahir di mana.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [sila-3]

- id: ev-soeharto-kb-program
  term_id: presiden-soeharto
  date: "1974"
  category: kebijakan
  title_id: Program Keluarga Berencana nasional (BKKBN)
  summary_id: >-
    Lahir dari Inpres 1970 dan dilembagakan sebagai BKKBN 1974, KB Orde Baru menjadi salah
    satu program paling sukses dunia: angka kelahiran turun dari lebih lima anak per wanita
    (1971) menjadi sekitar dua setengah pada akhir 1990-an, dipuji FAO hingga PBB. Metodenya
    juga punya bayang-bayang - target yang dipaksakan ke kepala desa dan insentif sterilisasi
    yang menuai kritik hak reproduksi.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [sila-5, tujuan-2]

- id: ev-soeharto-malari
  term_id: presiden-soeharto
  date: "1974-01"
  category: krisis
  title_id: Malari dan pembredelan pertama gelombang pers
  summary_id: >-
    15 Januari 1974, kunjungan PM Tanaka berujung kerusuhan Jakarta: gedung-gedung asosiasi
    Jepang dibakar, sebelas orang tewas. Negara menjawab bukan dengan dialog melainkan
    pembredelan dua belas media termasuk Indonesia Raya dan Nusantara, penahanan tokoh-tokoh
    mahasiswa, dan pemecatan pejabat yang tak sepaham. Malari adalah momen Orde Baru memilih
    jalan: kritik ekonomi-politik akan dihargai dengan penjara, bukan jawaban.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [negara-hukum, tujuan-2]

- id: ev-soeharto-petrus
  term_id: presiden-soeharto
  date: "1983"
  category: krisis
  title_id: Petrus - penembakan misterius ribuan preman
  summary_id: >-
    1983-1985, mayat-mayat ditembak mati dan ditinggalkan di tempat umum dari Aceh sampai
    Jawa - korban resmi disebut para preman, narasi resminya "preman lawan preman". Ribuan
    jiwa lenyap tanpa pengadilan; keluarga tak pernah mendapat kepastian. Bertahun-tahun
    kemudian, keterlibatan aparat diakui secara setengah-setengah bahkan dalam otobiografi
    presiden itu sendiri. Impunitas paling telanjang dalam sejarah republik modern.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [sila-2]

- id: ev-soeharto-tanjung-priok
  term_id: presiden-soeharto
  date: "1984-09"
  category: krisis
  title_id: Tragedi Tanjung Priok
  summary_id: >-
    12 September 1984, pasukan menyerbu Masjid Raya Tanjung Priok seusia ceramah yang
    mengkritik pemerintah; puluhan warga tewas - angka resmi 18, kesaksian warga jauh lebih
    banyak. Baru pada era Reformasi beberapa prajurit diadili, lalu semuanya dibebaskan
    Habibie lewat amnesti. Pola yang berulang sampai hari ini: kekerasan aparat ditutup
    rapor, korban diminta berdamai tanpa keadilan.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [sila-2]

- id: ev-habibie-trisakti-semanggi
  term_id: presiden-habibie
  date: "1998-05"
  category: krisis
  title_id: Penembakan Trisakti dan Semanggi I-II
  summary_id: >-
    12 Mei 1998 empat mahasiswa Trisakti ditembak mati oleh aparat bersenjata - percikan
    kerusuhan Mei yang menumbangkan Soeharto tiga hari kemudian. Kekerasan berlanjut ke era
    Habibie: Semanggi I (November 1998) dan Semanggi II (September 1999) kembali menewaskan
    mahasiswa dan warga. Komnas HAM menyimpulkan ada pelaku aparat, tapi berpuluh tahun
    kemudian tidak satu pun kasus ini sampai vonis - pembuka bab panjang impunitas
    pasca-Reformasi.
  source_ids: [komnas-ham-trisakti-semanggi]
  dimension_ids: [sila-2]

- id: ev-megawati-papua-otsus
  term_id: presiden-megawati
  date: "2001-11"
  category: produk-hukum
  title_id: UU Otonomi Khusus Papua No. 21/2001
  summary_id: >-
    Setelah Theys Eluay dibunuh dan konflik Papua memanas, Megawati mengesahkan UU otonomi
    khusus paling dermawan di republik ini: dana otsus 2% APBN selama dua puluh tahun,
    MRP penjaga hak orang asli, pengakuan kebudayaan Papua. Dua dekade kemudian neracanya
    pahit: dana mengalir ratusan triliun sementara kekerasan dan ketidakpercayaan justru
    menguat - bukti bahwa otonomi uang tanpa penyelesaian politik dan keadilan sejarah tak
    memadamkan api.
  source_ids: [uu-21-2001]
  dimension_ids: [sila-3]

- id: ev-megawati-munir
  term_id: presiden-megawati
  date: "2004-09"
  category: krisis
  title_id: Pembunuhan Munir Said Thalib
  summary_id: >-
    7 September 2004, pembela HAM terdepan Indonesia diracun arsenik di penerbangan Garuda
    menuju Amsterdam. Pengemudi Garuda Pollycarpus divonis seumur hidup, tetapi mantan pejabat
    BIN Muchdi PR dibebaskan majelis hakim - meski jejak teleponnya mengular ke markas
    intelijjen. Pembunuhan paling politis dalam sejarah Reformasi ini tidak pernah sampai ke
    dalangnya. Pesannya dingin: siapa pun yang menggali terlalu dalam akan dilindungi hukum -
    selama bukan lawan hukum itu sendiri.
  source_ids: [putusan-munir-2008]
  dimension_ids: [sila-2, negara-hukum]

- id: ev-sby2-bibit-chandra
  term_id: presiden-sby-ii
  date: "2009-10"
  category: krisis
  title_id: Perang praperadilan Bibit-Chandra
  summary_id: >-
    Oktober 2009, dua pimpinan KPK ditetapkan tersangka dugaan suap - beberapa hari setelah
    mereka menangani perkara besar yang menyentuh elite kepolisian dan kejaksaan. Praperadilan
    Pengadilan Negeri Jakarta Selatan memvonis penetapan itu melawan hukum; jutaan warga
    mendukung lewat Facebook, kemeja "Cicak vs Buaya" menjadi busana nasional. Episode ini
    membuka mata publik bahwa antikorupsi bisa diserang dengan senjata hukumnya sendiri.
  source_ids: [berita-praperadilan-kpk-2009]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-jokowi1-ahok-212
  term_id: presiden-jokowi-i
  date: "2016-12"
  category: krisis
  title_id: Perkara blasfemi Ahok dan aksi 212
  summary_id: >-
    Kutipan Al-Qur'an dalam pidato Kepulauan Seribu (Oktober 2016) memicu mobilisasi Islam
    terbesar pasca-Reformasi: aksi 212 Desember menghimpun ratusan ribu orang. Gubernur
    Jakarta non-Muslim etnis Tionghoa itu kalah di pemilu Februari 2017 lalu divonis dua
    tahun penjara atas blasfemi pada Mei - lebih berat dari tuntutan jaksa, dan langsung
    dipenjarakan. Kasus ini menjadi titik balik intoleransi: retorika identitas terbukti bisa
    menjatuhkan pejabat tertinggi daerah, dan preseden pidana blasfemi menguat.
  source_ids: [berita-ahok-blasfemi-2017]
  dimension_ids: [sila-1]

- id: ev-jokowi1-ektp-setnov
  term_id: presiden-jokowi-i
  date: "2018-04"
  category: pengadilan
  title_id: Vonis Setya Novanto dalam kasus e-KTP
  summary_id: >-
    Korupsi kartu e-KTP merugikan negara Rp2,3 triliun dan menjatuhkan Ketua Umum Golkar
    yang juga Ketua DPR - jabatan legislatif tertinggi - ke penjara lima belas tahun. KPK
    memenangkan duel paling dramatis melawan parlemen sejak era Bibit-Chandra. Namun angkanya
    juga pengingat: dari perkara terbesar dekade ini, hanya satu kepala yang jatuh, sementara
    aliran uang politik ke banyak partai tak pernah benar-benar dibongkar.
  source_ids: [berita-ektp-setnov-2018]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-jokowi2-fpi-dibubarkan
  term_id: presiden-jokowi-ii
  date: "2020-12"
  category: kebijakan
  title_id: Pembubaran FPI lewat SKB enam pejabat dan penangkapan Rizieq Shihab
  summary_id: >-
    30 Desember 2020, enam pejabat negara - menteri, kapolri, jaksa agung - menandatangani
    Surat Keputusan Bersama membubarkan FPI, tanpa putusan pengadilan. Dua minggu sebelumnya
    Rizieq Shihab ditangkap; enam pengurus FPI tewas dalam insiden jalan tol yang polisi
    sebut "penembakan karena melawan", publik menyebutnya pembunuhan. Mahkamah Agung kemudian
    menyatakan SKB itu bertentangan dengan UU (2021) - tetapi organisasinya sudah bubar dan
    pemimpinnya di penjara. Preseden berbahaya: lembaga eksekutif bisa membunuh organisasi
    sipil lewat rapat meja.
  source_ids: [berita-fpi-skb-2020]
  dimension_ids: [negara-hukum, sila-4]

- id: ev-jokowi2-juliari-bansos
  term_id: presiden-jokowi-ii
  date: "2020-12"
  category: krisis
  title_id: Menteri Sosial ditangkap KPK - suap uang pangkal bansos pandemi
  summary_id: >-
    6 Desember 2020, di tengah pandemi ketika jutaan keluarga bergantung bansos, KPK
    menangkap Menteri Sosial Juliari Batubara - anak politisi senior - atas uang pangkal dari
    distribusi bantuan COVID-19; divonis dua belas tahun. Wajah nasional program perlindungan
    sosial ternyata mencuri dari porsi rakyat paling lapar. Simbol sempurna dari celah tata
    kelola darurat: dana besar mengalir cepat, pengawasan tak sanggup mengikuti.
  source_ids: [berita-juliari-bansos-2020]
  dimension_ids: [sila-5, negara-hukum]

- id: ev-jokowi2-kanjuruhan
  term_id: presiden-jokowi-ii
  date: "2022-10"
  category: krisis
  title_id: Tragedi Kanjuruhan - 135 tewas oleh gas air mata di tribun
  summary_id: >-
    1 Oktober 2022, usai Arema kalah dari Persebaya, polisi menembakkan gas air mata ke arah
    tribun yang penuh sesak - pelanggaran langsung aturan FIFA. Ribuan orang panik menuju pintu
    keluar terkunci; 135 jiwa melayang, 583 luka. TGIPF yang dibentuk presiden menunjuk enam
    tersangka termasuk tiga perwira polisi, tetapi prosesnya berjalan lamban dan vonis-restitusi
    jauh di bawah harapan korban (Rp1,02 miliar dari tuntutan Rp17,5 miliar). Negara merespons
    dengan UU Keolahragaan baru - setelah, seperti biasa, nyawa sudah hilang lebih dahulu.
  source_ids: [berita-kanjuruhan-tgipf-2022, uu-11-2022-keolahragaan]
  dimension_ids: [tujuan-1, sila-2]

- id: ev-jokowi2-g20-bali
  term_id: presiden-jokowi-ii
  date: "2022-11"
  category: kebijakan
  title_id: Presidensi G20 Indonesia dan KTT Bali di tengah perang Ukraina
  summary_id: >-
    Di tengah perang Rusia-Ukraina yang memecah dunia, Indonesia memimpin G20 dan memaksakan
    satu-satunya KTT yang dihadiri Biden dan para pemimpin G7 sekaligus Lavrov (15-16 November
    2022, Bali). Diplomasi kursi roda Jokowi - ke Kiev, Moskwa, Beijing - mengangkat citra
    Indonesia sebagai jembatan Global South. Warisan diplomasi luar negeri terbesar era ini,
    meski komitmen hasil KTT banyak yang tinggal dokumen.
  source_ids: [berita-g20-bali-2022]
  dimension_ids: [tujuan-4]

- id: ev-jokowi2-pemekaran-papua
  term_id: presiden-jokowi-ii
  date: "2022-07"
  category: produk-hukum
  title_id: Pemekaran tiga provinsi Papua tanpa konsultasi DPRP
  summary_id: >-
    Juli 2022, pemerintah dan DPR mengesahkan lahirnya Papua Selatan, Papua Tengah, dan Papua
    Pegunungan - meski DPRP Papua secara resmi menolaknya dan UU Otsus mensyaratkan persetujuan
    MRP. Masyarakat sipil dan sebagian gereja menyebutnya strategi militeristik memecah gerakan
    Papua; pemerintah menyebut pemerataan layanan. Kontradiksi hukum dan politiknya menganga:
    otonomi khusus dilanggar oleh undang-undang yang seharusnya melindunginya.
  source_ids: [berita-pemekaran-papua-2022]
  dimension_ids: [sila-3]

- id: ev-prabowo-brics
  term_id: presiden-prabowo
  date: "2025-01"
  category: kebijakan
  title_id: Indonesia resmi anggota penuh BRICS
  summary_id: >-
    6 Januari 2025, Brasil selaku ketua BRICS mengumumkan Indonesia sebagai anggota penuh -
    negara Asia Tenggara pertama di blok Global South yang dipimpin China-Rusia itu. Pilihan
    Prabowo yang dieksekusi cepat setelah pencalonannya disetujui Johannesburg 2023. Bagi
    pendukungnya, langkah strategis diversifikasi aliansi; bagi kritikusnya, geseran dari
    bebas-aktif ke berkembar ganda - bergabung BRICS sambil berproses masuk OECD Barat. Arah
    kebijakan luar negeri pertama era ini yang benar-benar menguji doktrin.
  source_ids: [berita-brics-ri-2025]
  dimension_ids: [tujuan-4]

# --------- GELOMBANG PERLUASAN: DIMENSI YANG MASIH TIPIS ---------

- id: ev-soekarno1-pasukan-garuda
  term_id: presiden-soekarno-i
  date: "1957-09"
  category: kebijakan
  title_id: Pasukan Garuda I dikirim ke Mesir (UNEF)
  summary_id: >-
    September 1957, 559 personel TNI mendarat di Sinai sebagai kontingen pertama pasukan
    perdamaian PBB - hanya dua tahun setelah KAA Bandung. Dari misi Garuda I itu lahir
    tradisi lima puluh lebih misi dan puluhan ribu peacekeeper Indonesia hingga hari ini,
    salah satu kontributor terbesar dunia. Bukti bahwa politik luar negeri bebas-aktif
    pernah punya kaki di lapangan, bukan cuma di mimbar.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [tujuan-4]

- id: ev-soeharto-asean-1967
  term_id: presiden-soeharto
  date: "1967-08"
  category: kebijakan
  title_id: Pendirian ASEAN - Deklarasi Bangkok
  summary_id: >-
    Setelah konfrontasi yang menghancurkan, Indonesia justru menjadi pendiri ASEAN bersama
    lima tetangga pada 8 Agustus 1967. Dari sini lahir ZOPFAN, TAC 1976, dan arsitektur
    keamanan regional tempat Jakarta selalu jadi motor. Satu dari sedikit babak dalam
    sejarah ketika kebijakan luar negeri Indonesia mengubah peta kawasan secara permanen -
    warisan positif Orde Baru yang tak terbantahkan.
  source_ids: [deklarasi-bangkok-1967]
  dimension_ids: [tujuan-4, sila-3]

- id: ev-soeharto-dom-aceh-papua
  term_id: presiden-soeharto
  date: "1989"
  category: krisis
  title_id: Daerah Operasi Militer Aceh dan Papua
  summary_id: >-
    Status DOM diberlakukan di Aceh (1989-1998) dan diperkuat di Papua: pembumian rumah,
    penyiksaan, hilangnya ribuan orang yang namanya tidak pernah dicatat. Ketika DOM dicabut
    1998, mayat massal digali dari bekas markas militer di Aceh. Warisan kebijakan ini -
    menjawab pemberontakan dengan teror terhadap warga sipil - adalah akar dari luka yang
    MoU Helsinki hanya sebagian menyembuhkan.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [sila-2]

- id: ev-soekarno2-pnps-1965
  term_id: presiden-soekarno-ii
  date: "1966-01"
  category: produk-hukum
  title_id: Lahirnya kitab blasfemi - UU No. 1/PNPS/1965
  summary_id: >-
    Ditandatangani Sukarno pada pekan-pekan terakhir Demokrasi Terpimpin (27 Januari 1966),
    undang-undang ini melarang penafsiran agama yang menyimpang dari doktrin utama - dan
    secara efektif membekukan aliran-aliran baru seperti Ahmadiyah dalam posisi hukum abu-abu.
    Lima puluh tahun kemudian, kitab lima pasal ini menjadi dasar ratusan penangkapan dan
    penutupan rumah ibadah. Pasal karet tertua yang masih hidup dalam hukum kebebasan
    beragama Indonesia.
  source_ids: [pnps-1965]
  dimension_ids: [sila-1]

- id: ev-gusdur-uu-pengadilan-ham
  term_id: presiden-gusdur
  date: "2000-11"
  category: produk-hukum
  title_id: UU No. 26/2000 tentang Pengadilan HAM
  summary_id: >-
    November 2000, Indonesia akhirnya punya payung yuridis untuk mengadili pelanggaran HAM
    berat - genosida dan kejahatan kemanusiaan - termasuk retroaktif untuk Timor Timur dan
    kasus-kasus Orde Baru. Di atas kertas, jawaban atas impunitas 1965 dan 1998 terbuka lebar.
    Praksinya: hanya Timor Timur ad hoc yang pernah berjalan, dan gagal. Undang-undang bagus,
    keberanian politiknya tidak pernah ikut disahkan.
  source_ids: [uu-26-2000]
  dimension_ids: [sila-2, negara-hukum]

- id: ev-gusdur-konflik-komunal
  term_id: presiden-gusdur
  date: "1999-01"
  category: krisis
  title_id: Konflik komunal Maluku dan Poso meledak
  summary_id: >-
    Januari 1999 Ambon terbakar; Poso menyusul 2000. Dalam tiga tahun, konflik Muslim-Kristen
    menewaskan perkiraan sepuluh ribu jiwa dan memaksa lebih sejuta orang mengungsi - kekerasan
    komunal terbesar pasca-Reformasi. Negara lambat meredam, Laskar Jihad melintasi provinsi
    tanpa halangan, dan rekonsiliasi Baku Bae baru datang setelah darah. Pesan Bhinneka Tunggal
    Ika Gus Dur tidak cukup kuat mengalahkan mesin provokasi di lapangan.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [sila-2, sila-3]

- id: ev-megawati-sisdiknas
  term_id: presiden-megawati
  date: "2003-07"
  category: produk-hukum
  title_id: UU Sistem Pendidikan Nasional No. 20/2003
  summary_id: >-
    Disahkan 8 Juli 2003, UU Sisdiknas menjadi kerangka induk pendidikan modern: wajib belajar,
    kurikulum berbasis kompetensi, jaminan anggaran, dan definisi pendidikan yang inklusif.
    Semua reformasi pendidikan sesudahnya - BOS, Kurikulum Merdeka - berdiri di atas fondasi
    ini. Kelemahannya juga mewarisi: mutu guru dan hasil belajar tetap menjadi PR yang belum
    selesai dua dekade kemudian.
  source_ids: [uu-20-2003]
  dimension_ids: [tujuan-3]

- id: ev-megawati-sipadan-ligitan
  term_id: presiden-megawati
  date: "2002-12"
  category: pengadilan
  title_id: ICJ menangkan Sipadan-Ligitan untuk Indonesia
  summary_id: >-
    17 Desember 2002, Mahkamah Internasional menetapkan kedaulatan dua pulau kecil di Selat
    Celebes kepada Indonesia, menutup sengketa tiga dekade dengan Malaysia. Kemenangan dibangun
    bukan dengan kapal perang melainkan dokumen efektifitas pengelolaan sejak era kolonial -
    kemenangan arsip. Preseden penting bagi seluruh sengketa maritim Nusantara dan bukti bahwa
    diplomasi hukum adalah senjata negara kepulauan.
  source_ids: [icj-sipadan-ligitan-2002]
  dimension_ids: [tujuan-1]

- id: ev-sby1-ratifisasi-icescr
  term_id: presiden-sby-i
  date: "2005-09"
  category: produk-hukum
  title_id: Ratifikasi Konvenan Ekonomi-Sosial-Budaya (UU No. 11/2005)
  summary_id: >-
    Hampir empat puluh tahun Indonesia menunda meratifikasi ICESCR - takut kewajiban hak
    ekonomi mengikat. Akhirnya September 2005 sah juga, menyusul ICCPR setahun sebelumnya.
    Sejak itu seluruh pasal 28E-28J konstitusi punya jangkar traktat internasional, dan laporan
    berkala Indonesia diuji Komite PBB. Langkah kecil di kertas, besar dalam bahasa: negara
    resmi mengaku bisa diaudit soal hak-hak dasar rakyatnya.
  source_ids: [uu-11-2005]
  dimension_ids: [tujuan-4, sila-2]

- id: ev-sby1-blt-perdana
  term_id: presiden-sby-i
  date: "2005-10"
  category: kebijakan
  title_id: BLT perdana untuk 19 juta rumah tangga miskin
  summary_id: >-
    Saat subsidi BBM dipotong Oktober 2005, pemerintah membayar kompensasi sosialnya langsung:
    Rp300 ribu per bulan bagi 19 juta rumah tangga termiskin - program perlindungan sosial
    berskala massal pertama republik. Distribusinya berantakan di lapangan, data kemiskinan
    usang, tapi preseden lahir: sejak BLT ini, setiap kenaikan harga energi wajib dibayar
    tebusan sosial. Fondasi bagi PKH, bansos pandemi, sampai MBG hari ini.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [sila-5, tujuan-2]

- id: ev-sby1-dana-bos
  term_id: presiden-sby-i
  date: "2005"
  category: kebijakan
  title_id: Dana BOS dimulai - sekolah bebas biaya
  summary_id: >-
    Tahun ajaran 2005/2006 Dana BOS pertama mengalir ke ratusan ribu SD-SMP negeri dan swasta
    terakreditasi: sekolah dilarang memungut biaya, negara yang membayarnya per siswa. Angka
    partisipasi SMP melonjak nyata dalam beberapa tahun. Masalahnya klasik menyusul: verifikasi
    murid fiktif, penyelewengan oleh kepala sekolah, dan mutu yang tidak otomatis naik ikut
    kantong yang naik.
  source_ids: [dana-bos-2005]
  dimension_ids: [tujuan-3]

- id: ev-sby1-penanaman-modal
  term_id: presiden-sby-i
  date: "2007-03"
  category: produk-hukum
  title_id: UU Penanaman Modal No. 25/2007
  summary_id: >-
    Setelah satu dekade krisis membuat investor lari, Indonesia menulis ulang rezim investasi:
    perlakukan asing-domestik setara, kepastian tanah, fasilitas pajak, dan larangan
    nasionalisasi tanpa kompensasi. Arus masuk FDI berbalik tajam bertahun-tahun sesudahnya.
    Sisi gelapnya kelak tampak di Cipta Kerja: pintu yang dibuka lebar ini tanpa pagar lingkungan
    dan hak buruh yang memadai.
  source_ids: [uu-25-2007]
  dimension_ids: [tujuan-2]

- id: ev-jokowi1-perppu-ormas-hti
  term_id: presiden-jokowi-i
  date: "2017-07"
  category: produk-hukum
  title_id: Perppu Ormas dan pembubaran HTI
  summary_id: >-
    Julu 2017, pemerintah menerbitkan Perppu Ormas yang mempermudah pembubaran organisasi
    kemasyarakatan tanpa putusan pengadilan - dua pekan kemudian HTI dilumat karena menolak
    Pancasila sebagai asas negara. Perppu disahkan jadi UU meski Komnas HAM dan puluhan LSM
    menyebutnya pintu represi terhadap semua ormas. Preseden yang sama kelak dipakai membubarkan
    FPI pada 2020 - alat yang dibuat untuk satu lawan akhirnya tersedia untuk siapa saja yang
    berkuasa.
  source_ids: [berita-fpi-skb-2020]
  dimension_ids: [negara-hukum, sila-4]

- id: ev-jokowi2-revisi-uumk
  term_id: presiden-jokowi-ii
  date: "2020-07"
  category: produk-hukum
  title_id: Revisi UU Mahkamah Konstitusi mengubah masa jabatan pimpinan
  summary_id: >-
    Diam-diam digodok, UU No. 7/2020 mengubah aturan masa jabatan Ketua dan Wakil Ketua MK -
    periode 2015-2020 dihitung sebagai periode baru sehingga petahana bisa maju lagi. Anwar
    Usman akhirnya menjabat ketua hingga 2023, persis sampai skandal etik Putusan 90/2023
    memberhentikannya. Legislatif membuka pintu; isi rumahnya yang kelak memalukan. Contoh
    sempurna bagaimana revisi teknis kecil bisa mengubah nasib konstitusi.
  source_ids: [uu-7-2020, mkmk-anwar-usman-2023]
  dimension_ids: [checks-balances]

- id: ev-soeharto-skb-1969
  term_id: presiden-soeharto
  date: "1969"
  category: kebijakan
  title_id: SKB 2 Menteri tentang rumah ibadah
  summary_id: >-
    Dua menteri menandatangani surat bersama yang mensyaratkan "dukungan warga sekitar"
    untuk membangun rumah ibadah minoritas - dalam praktiknya diterjemahkan birokrasi menjadi
    angka 90 tanda tangan tetangga. Selama lebih dari lima puluh tahun, dokumen teknis ini
    adalah akar dari ratusan kasus penutupan paksa gereja dan pura di seluruh Indonesia.
    Konflik yang terlihat sebagai intoleransi warga sering kali lahir dari satu lembar SKB.
  source_ids: [skb-rumah-ibadah-1969]
  dimension_ids: [sila-1]

- id: ev-soeharto-uuperkawinan-1974
  term_id: presiden-soeharto
  date: "1974"
  category: produk-hukum
  title_id: UU Perkawinan No. 1/1974
  summary_id: >-
    Undang-undang pertama tentang perkawinan menutup perdebatan panjang dengan formula
    kompromi: perkawinan sah bila dilakukan menurut agama masing-masing, tetapi Pasal 11 tak
    menjelaskan status perkawinan beda agama - celah yang membuat pasukan pencatat sipil dan
    pengadilan saling melempar tanggung jawab sampai hari ini. Negara memilih mengunci
    keragaman ke dalam ambiguitas daripada menyelesaikannya.
  source_ids: [uu-1-1974]
  dimension_ids: [sila-1]

- id: ev-soeharto-krismon-blbi
  term_id: presiden-soeharto
  date: "1998-01"
  category: krisis
  title_id: Krismon, likuidasi bank, dan skandal BLBI
  summary_id: >-
    Rupiah runtuh; di bawah tekanan IMF, puluhan bank dilikuidasi sementara BLBI Rp130+
    triliun dialirkan ke pemilik bank - sebagian besar tidak kembali. Para taipan yang
    membawa uang keluar negeri hidup bebas; rakyat menanggung inflasi 78% dan PHK massal.
    Skandal BLBI kemudian jadi daftar panjang impunitas oligarki yang tidak pernah benar-benar
    dituntaskan hingga kini.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [negara-hukum, sila-5]

- id: ev-soeharto-udin-jurnalis
  term_id: presiden-soeharto
  date: "1996-08"
  category: krisis
  title_id: Pembunuhan jurnalis Udin di Yogyakarta
  summary_id: >-
    10 Agustus 1996, wartawan Monitor Fuad Muhammad Syafruddin yang gali korupsi bupati
    Bantul ditusuk di depan rumahnya. Seorang buruh bangunan disiksa hingga mengaku, lalu
    dibebaskan pengadilan karena keterangannya dipaksakan. Pembunuh sejati dan otaknya tak
    pernah ditemukan. Kasus Udin menjadi simbol abadi: membongkar korupsi di era Orde Baru
    bisa berarti mati, dan negara melindungi pembunuhnya lebih baik daripada saksi.
  source_ids: [berita-udin-1996]
  dimension_ids: [sila-4, sila-2]

- id: ev-megawati-sampit-sambas
  term_id: presiden-megawati
  date: "2001-02"
  category: krisis
  title_id: Kerusuhan Sampit dan Sambas - konflik Dayak-Madura
  summary_id: >-
    Melanjutkan Sambas 1999, kerusuhan Sampit Februari-Maret 2001 menewaskan setidaknya lima
    ratus orang dan memaksa puluhan ribu etnis Madura mengungsi permanen dari Kalimantan
    Tengah. Kekerasan paling brutal antaretnis era Reformasi ini berakhir bukan lewat
    penegakan hukum melainkan karena satu kelompok berhasil dibersihkan dari wilayahnya -
    perdamaian tanpa keadilan yang menjadi template konflik agraria-etnis berikutnya.
  source_ids: [literatur-sejarah-nasional]
  dimension_ids: [sila-2, sila-3]

- id: ev-sby1-tsunami-aceh-respons
  term_id: presiden-sby-i
  date: "2004-12"
  category: krisis
  title_id: Gempa dan tsunami Samudra Hindia - respons bencana terbesar republik
  summary_id: >-
    26 Desember 2004, gempa M9,1 dan tsunami menewaskan sekitar 167 ribu orang di Aceh dan
    Nias - bencana nasional terbesar sepanjang ingatan. Indonesia membuka pintu bantuan dunia,
    TNI berubah fungsi menjadi logistik kemanusiaan, dan rekonstruksi via BRR Aceh-Nias
    dijalankan relatif bersih dibanding standar saat itu. Dari puing-puing juga lahir damai:
    bencana yang sama-sama diderita membuka jalan MoU Helsinki tujuh bulan kemudian.
  source_ids: [literatur-sejarah-nasional, mou-helsinki-2005]
  dimension_ids: [tujuan-1]

- id: ev-sby1-uuguru-dosen
  term_id: presiden-sby-i
  date: "2005-12"
  category: produk-hukum
  title_id: UU Guru dan Dosen No. 14/2005
  summary_id: >-
    Diundangkan 14 Desember 2005 dengan janji megah: tunjangan profesi sebesar gaji pokok
    bagi semua guru - gaji guru naik dua kali lipat. Empat belas tahun kemudian jutaan guru
    non-PNS masih menunggu janji itu penuh; sertifikasi mengubah status tanpa mengubah mutu
    kelas secara signifikan menurut berbagai studi. UU yang dimaksudkan mencerdaskan justru
    menjadi contoh bagaimana anggaran besar tanpa desain insentif hanya menghasilkan
    birokrasi baru.
  source_ids: [uu-14-2005]
  dimension_ids: [tujuan-3]

- id: ev-sby2-gayus-pajak
  term_id: presiden-sby-ii
  date: "2010"
  category: krisis
  title_id: Kasus Gayus Tambunan - mafia pajak yang berlibur
  summary_id: >-
    Pajak rendahan Gayus Tambunan terbongkar menerima miliaran dari perusahaan, lalu dunia
    dikejutkan foto dirinya berlibur ke Bali dan Gili saat statusnya tahanan - bukti telanjang
    bahwa uang bisa membeli penjara. Jaringannya menyentuh polisi, jaksa, hakim, dan advokat.
    Reformasi DJP diluncurkan setelahnya; kepercayaan publik kepada sistem perpajakan dan
    penegakan hukum tidak pernah benar-benar pulih.
  source_ids: [berita-gayus-2010]
  dimension_ids: [negara-hukum]

- id: ev-sby2-hambalang
  term_id: presiden-sby-ii
  date: "2013-01"
  category: krisis
  title_id: Korupsi proyek Hambalang Rp2,5 triliun
  summary_id: >-
    Proyek pusat pelatihan atlet nasional membengkak menjadi sekitar Rp2,5 triliun penuh
    mark-up; KPK menetapkan pejabat Kemenpora dan kontraktor sebagai tersangka, termasuk
    politisi senior partai penguasa. Dana yang seharusnya mencetak medali habis di rekening.
    Hambalang menjadi lambang bagaimana anggaran prestasi olahraga Indonesia dibunuh oleh
    rakusnya pengelolanya sendiri - dua dekade kemudian hasilnya masih kita tanggung.
  source_ids: [berita-hambalang-2013]
  dimension_ids: [negara-hukum]

- id: ev-jokowi1-paris-agreement
  term_id: presiden-jokowi-i
  date: "2016-10"
  category: produk-hukum
  title_id: Indonesia meratifikasi Paris Agreement lebih awal
  summary_id: >-
    Oktober 2016, DPR mengesahkan UU No. 16/2016 sehingga Indonesia masuk jajaran negara
    pertama yang meratifikasi Paris Agreement sebelum perjanjian itu berlaku efektif -
    diklaim sebagai negara berkembang pertama lewat jalur parlemen. Komitmen NDC: menurunkan
    emisi hingga 29% sendiri, 41% dengan bantuan internasional pada 2030. Realisasinya masih
    diperdebatkan tiap tahun; tetapi secara hukum, Indonesia mengikat dirinya ke rezim iklim
    global.
  source_ids: [uu-16-2016]
  dimension_ids: [tujuan-4]

- id: ev-jokowi2-kip-kuliah
  term_id: presiden-jokowi-ii
  date: "2020"
  category: kebijakan
  title_id: Peluncuran KIP Kuliah
  summary_id: >-
    Tengah pandemi, pemerintah melebur Bidikmisi dan berbagai beasiswa menjadi satu KIP
    Kuliah: biaya kuliah ditanggung penuh plus biaya hidup bagi mahasiswa dari keluarga
    tidak mampu. Dalam beberapa tahun jumlah penerima melonjak hingga jutaan per angkatan -
    salah satu program afirmasi pendidikan tinggi terbesar di Asia Tenggara. Tantangan klasik
    menyusul: data penerima yang bocor dijual daring, dan mutu lulusan yang tak otomatis ikut
    naik bersama kuotanya.
  source_ids: [kip-kuliah-2020]
  dimension_ids: [tujuan-3]

- id: ev-jokowi2-jiwasraya-vonis
  term_id: presiden-jokowi-ii
  date: "2022-03"
  category: pengadilan
  title_id: Vonis Jiwasraya - Rp16,8 triliun hilang di asuransi negara
  summary_id: >-
    Maret 2022 majelis hakim menjatuhkan vonis dalam skandal investasi PT Asuransi Jiwasraya:
    kerugian negara Rp16,8 triliun - dana tabungan polis jutaan rakyat yang dipakai saham-
    sahaman spekulatif oleh eks-direktur dan jaringan broker politik. Salah satu kerugian
    terbesar dalam sejarah korupsi Indonesia, dan seperti biasa: para eksdir divonis, sementara
    pertanyaan siapa pemilik kepentingan di baliknya tidak pernah benar-benar dijawab.
  source_ids: [berita-jiwasraya-2022]
  dimension_ids: [negara-hukum]

- id: ev-jokowi2-revisi-ite-2024
  term_id: presiden-jokowi-ii
  date: "2024-01"
  category: produk-hukum
  title_id: Revisi kedua UU ITE (UU No. 1/2024)
  summary_id: >-
    Setelah lebih dari 700 orang dipidana lewat pasal karet, revisi kedua UU ITE akhirnya
    mengubah pencemaran nama baik menjadi delik aduan dan menambah bab "hormat serta privasi".
    Kemajuannya nyata di atas kertas; praktik lapangan belum banyak berubah - pasal-pasal baru
    tentang martabat dan privasi justru rawan dipakai cara lama. Perbaikan setengah hati atas
    luka yang diciptakan undang-undang itu sendiri enam belas tahun sebelumnya.
  source_ids: [uu-1-2024]
  dimension_ids: [sila-4]

# ---- peristiwa baru (hasil import massal, WAJIB DIKURASI) ----
- id: ev-soekarno1-hatta-mundur
  term_id: presiden-soekarno-i
  date: 1956-12
  category: pengangkatan
  title_id: Mohammad Hatta mengundurkan diri dari wakil presiden
  summary_id: 1 Desember 1956, Bung Hatta meletakkan jabatan - protes tenang atas
    kultus individu yang tumbuh dan ketidaksetujuan pada arah politik Sukarno.
    Tanpa wakil presiden, republik kehilangan rem moralnya di detik kritis
    menjelang Dekrit 1959. Perdebatan apakah Indonesia butuh wakil presiden
    aktif baru selesai hanya lewat amandemen 44 tahun kemudian.
  source_ids:
    - literatur-sejarah-nasional
  dimension_ids:
    - checks-balances
- id: ev-soekarno2-seumur-hidup
  term_id: presiden-soekarno-ii
  date: 1963-05
  category: produk-hukum
  title_id: TAP MPRS III/MPRS/1963 - Sukarno Presiden Seumur Hidup
  summary_id: "Sidang Istimewa MPRS Mei 1963 menobatkan Sukarno presiden seumur
    hidup - tanpa pemilu, tanpa batasan, atas nama revolusi. Satu ketetapan
    menutup seluruh pintu pergantian kekuasaan secara damai selamanya; dua tahun
    kemudian satu lembar Supersemar membuka pintu itu dengan cara paling
    berdarah. Pelajaran klasik: kursi tanpa batas waktu selalu berakhir tanpa
    aturan."
  source_ids:
    - tap-mprs-iii-1963
  dimension_ids:
    - checks-balances
    - kedaulatan-rakyat
- id: ev-dpr99-uu-polri
  term_id: dpr-1999-2004
  date: 2002-01
  category: produk-hukum
  title_id: UU Kepolisian - Polri resmi lepas dari militer
  summary_id: "Disahkan Januari 2002 menyusul pemisahan Polri dari ABRI sejak
    April 1999, undang-undang ini menata ulang kepolisian sebagai institusi
    sipil yang melindungi-mengayomi-melayani masyarakat. Reformasi keamanan
    paling fundamental pasca-dwifungsi: tentara keluar dari urusan kamtibmas.
    Implementasinya masih diperjuangkan sampai hari ini - reformasi polri
    ternyata lebih mudah ditulis daripada dilakukan."
  source_ids:
    - uu-2-2002
  dimension_ids:
    - tujuan-1
    - negara-hukum
- id: ev-jokowi1-pengepungan-kpk
  term_id: presiden-jokowi-i
  date: 2015-01
  category: krisis
  title_id: Pengepungan gedung KPK oleh aparat kepolisian
  summary_id: "18 Januari 2015, beberapa hari setelah KPK menetapkan seorang
    jenderal bintang tiga tersangka, puluhan aparat Brimob mengepung gedung KPK
    untuk menangkap dua penyidiknya. Publik menyebutnya hari tergelap
    antikorupsi; presiden memilih jalan tengah yang tidak menyenangkan siapa
    pun. Pesan yang tertinggal: lembaga antikorupsi bisa digerogoti bahkan oleh
    institusi yang seharusnya menjadi sekutunya."
  source_ids:
    - berita-kpk-2015
  dimension_ids:
    - checks-balances
    - negara-hukum
- id: ev-jokowi2-hilirisasi-nikel
  term_id: presiden-jokowi-ii
  date: 2020-01
  category: kebijakan
  title_id: Larangan ekspor bijih nikel dan era hilirisasi paksa
  summary_id: "Januari 2020 larangan ekspor bijih nikel mentah berlaku - WTO
    sempat memenangkan gugatan atasnya, Indonesia banding dan tetap jalan.
    Hasilnya nyata: puluhan smelter dibangun, nilai ekspor produk nikel melonjak
    berpuluh kali lipat, ratusan ribu lapangan kerja industri baru. Bayangannya
    sama nyata: ekspansi tambah kapal keruk laut, deforestasi Raja
    Ampat-Halmahera, dan dominasi modal tunggal asing di kawasan industri."
  source_ids:
    - berita-hilirisasi-2020
  dimension_ids:
    - tujuan-2
- id: ev-jokowi2-pemilu-terbesar
  term_id: presiden-jokowi-ii
  date: 2024-02
  category: peristiwa
  title_id: Pemilu 14 Februari 2024 - pemilihan satu hari terbesar dunia
  summary_id: Sehari dalam sebulan penuh, sekitar 204,8 juta pemilih terdaftar
    memilih lima tingkat jabatan sekaligus di lebih dari 800 ribu TPS -
    pemilihan umum satu hari terbesar dalam sejarah manusia. Berlangsung damai
    dan meriah meski korban jiwa petugas logistik serta polemik etika netralitas
    Anies-Ganjar-Prabowo vs Istana mencoretnya. Kapasitas elektoral republik tak
    diragukan lagi; mutu integritasnya masih diuji tiap lima tahun.
  source_ids:
    - berita-kpu-2024
    - uu-7-2017
  dimension_ids:
    - sila-4
    - kedaulatan-rakyat


