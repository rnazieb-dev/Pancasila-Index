- id: ev-sby1-gempa-yogya
  term_id: presiden-sby-i
  date: 2006-05
  category: krisis
  title_id: Gempa Yogyakarta dan Jawa Tengah
  summary_id: 27 Mei 2006, gempa M5,9 meratakan ribuan rumah di Yogyakarta-Klaten; sekitar 5.800 orang tewas. Respons darurat berjalan cepat dengan bantuan komunitas terbesar dalam sejarah bencana Indonesia saat itu, namun rekonstruksi via dana swadaya masyarakat justru lebih cepat dan lebih akuntabel daripada kanal negara - pelajaran tata kelola yang kelak diulang di Palu.
  source_ids:
