- id: ev-mk4-ciptaker-91
  term_id: mk-2018-2023
  date: 2021-11
  category: pengadilan
  title_id: Putusan MK 91/PUU-XVIII/2020 menegakkan prosedur legislasi
  summary_id: 'Dengan suara bulat, sembilan hakim menyatakan UU Cipta Kerja
    "inkonstitusional bersyarat": cacat formalnya - partisipasi publik
    diabaikan, draf tak dipublikasikan - membuat proses pembuatannya melanggar
    konstitusi. Putusan ini menjadi rujukan global tentang pentingnya proses
    legislasi partisipatif. Pertanyaannya kemudian bukan lagi apakah putusan
    dihormati, melainkan apa yang dilakukan pemerintah sesudahnya.'
  source_ids:
