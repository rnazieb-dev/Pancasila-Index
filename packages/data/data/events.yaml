- id: ev-dpr19-pdp
  term_id: dpr-2019-2024
  date: 2022-09
  category: produk-hukum
  title_id: UU Pelindungan Data Pribadi disahkan
  summary_id: "Setelah enam tahun tertunda, Indonesia akhirnya punya hukum data pribadi (UU No. 27/2022): hak subjek data, kewajiban pengendali, denda hingga 2% pendapatan tahunan, dan pidana untuk pembocoran. Lahir di tengah kebocoran data SIM, BPJS, dan KPU yang memalukan. Taringnya masih ditanyakan: lembaga pengawasnya belum jelas dan penegakan pertama lambat - tapi kerangkanya setara GDPR regional."
  source_ids:
    - uu-27-2022
  dimension_ids:
    - sila-4
- id: ev-dpr19-uu-ciptaker-permanen
  term_id: dpr-2019-2024
  date: 2023-03
  category: produk-hukum
  title_id: UU No. 6/2023 penetapan Perppu Cipta Kerja
  summary_id: Meski uji materi atas Perppu masih berjalan, DPR mengesahkannya jadi undang-undang permanen 31 Maret 2023. Hakim konstitusi sendiri bertanya-tanya kenapa tidak menunggu. Siklus yang dimulai dari putusan MK 91/2021 berakhir tanpa satu pun perbaikan prosedur partisipasi - pesan institusional yang mengkhawatirkan bagi kepatuhan antarlembaga.
  source_ids:
    - uu-6-2023
  dimension_ids:
    - checks-balances
    - negara-hukum
- id: ev-dpr19-kesehatan-omnibus
  term_id: dpr-2019-2024
  date: 2023-08
  category: produk-hukum
  title_id: UU Kesehatan omnibus disahkan cepat
  summary_id: Sembilan UU kesehatan dilebur jadi satu dalam waktu singkat; IDI dan organisasi profesi memprotes pasal yang membuka praktik asing massal dan mengubah struktur dinas. DPR menjalankan proses tanpa mendengar bantahan substantif serius. Pola omnibus kedua - efisien di atas kertas, rapuh di legitimasi profesional lapangan.
  source_ids:
