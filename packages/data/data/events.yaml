  summary_id: Rupiah anjlok dari Rp2.500 ke Rp16.000 per dolar; perusahaan runtuh; PHK jutaan orang. Penembakan Trisakti 12 Mei 1998 menewaskan empat mahasiswa; dua hari kemudian kerusuhan Mei membakar Jakarta - TGPF mencatat 1.190 orang tewas dan puluhan perempuan Tionghoa diperkosa secara sistematis. 21 Mei 1998, Soeharto mengucapkan lengser di Istana Merdeka, didampingi Habibie. Tiga puluh dua tahun berakhir dalam delapan menit pidato - dan akuntabilitas atas segala yang terjadi belum pernah benar-benar datang.
