- id: ev-jokowi1-ahok-212
  term_id: presiden-jokowi-i
  date: 2016-12
  category: krisis
  title_id: Perkara blasfemi Ahok dan aksi 212
  summary_id: "Kutipan Al-Qur'an dalam pidato Kepulauan Seribu (Oktober 2016) memicu mobilisasi Islam terbesar pasca-Reformasi: aksi 212 Desember menghimpun ratusan ribu orang. Gubernur Jakarta non-Muslim etnis Tionghoa itu kalah di pemilu Februari 2017 lalu divonis dua tahun penjara atas blasfemi pada Mei - lebih berat dari tuntutan jaksa, dan langsung dipenjarakan. Kasus ini menjadi titik balik intoleransi: retorika identitas terbukti bisa menjatuhkan pejabat tertinggi daerah, dan preseden pidana blasfemi menguat."
  source_ids:
    - berita-ahok-blasfemi-2017
  dimension_ids:
    - sila-1
    - tujuan-1
    - kedaulatan-rakyat
- id: ev-jokowi1-ektp-setnov
  term_id: presiden-jokowi-i
  date: 2018-04
  category: pengadilan
  title_id: Vonis Setya Novanto dalam kasus e-KTP
  summary_id: "Korupsi kartu e-KTP merugikan negara Rp2,3 triliun dan menjatuhkan Ketua Umum Golkar yang juga Ketua DPR - jabatan legislatif tertinggi - ke penjara lima belas tahun. KPK memenangkan duel paling dramatis melawan parlemen sejak era Bibit-Chandra. Namun angkanya juga pengingat: dari perkara terbesar dekade ini, hanya satu kepala yang jatuh, sementara aliran uang politik ke banyak partai tak pernah benar-benar dibongkar."
  source_ids:
    - berita-ektp-setnov-2018
  dimension_ids:
    - negara-hukum
    - checks-balances
  actor_ids:
    - setya-novanto
- id: ev-jokowi2-fpi-dibubarkan
  term_id: presiden-jokowi-ii
  date: 2020-12
  category: kebijakan
  title_id: Pembubaran FPI lewat SKB enam pejabat dan penangkapan Rizieq Shihab
  summary_id: '30 Desember 2020, enam pejabat negara - menteri, kapolri, jaksa agung - menandatangani Surat Keputusan Bersama membubarkan FPI, tanpa putusan pengadilan. Dua minggu sebelumnya Rizieq Shihab ditangkap; enam pengurus FPI tewas dalam insiden jalan tol yang polisi sebut "penembakan karena melawan", publik menyebutnya pembunuhan. Mahkamah Agung kemudian menyatakan SKB itu bertentangan dengan UU (2021) - tetapi organisasinya sudah bubar dan pemimpinnya di penjara. Preseden berbahaya: lembaga eksekutif bisa membunuh organisasi sipil lewat rapat meja.'
  source_ids:
    - berita-fpi-skb-2020
  dimension_ids:
    - negara-hukum
    - sila-4
    - sila-1
- id: ev-jokowi2-juliari-bansos
  term_id: presiden-jokowi-ii
  date: 2020-12
  category: krisis
  title_id: Menteri Sosial ditangkap KPK - suap uang pangkal bansos pandemi
  summary_id: "6 Desember 2020, di tengah pandemi ketika jutaan keluarga bergantung bansos, KPK menangkap Menteri Sosial Juliari Batubara - anak politisi senior - atas uang pangkal dari distribusi bantuan COVID-19; divonis dua belas tahun. Wajah nasional program perlindungan sosial ternyata mencuri dari porsi rakyat paling lapar. Simbol sempurna dari celah tata kelola darurat: dana besar mengalir cepat, pengawasan tak sanggup mengikuti."
  source_ids:
    - berita-juliari-bansos-2020
  dimension_ids:
