- id: ev-dpr19-ciptaker-legislasi
  term_id: dpr-2019-2024
  date: 2020-02
  category: produk-hukum
  title_id: UU Cipta Kerja lahir dari proses dipercepat
  summary_id: Dua bulan konsultasi publik simbolik untuk paket regulasi 944 halaman yang mengubah perizinan, ketenagakerjaan, dan lingkungan hidup sekaligus. Draf final tidak dipublikasikan saat dewan bicara; amandemen dadakan masuk di jam-jam akhir. Putusan MK 91/2021 kemudian merinci cacat formalnya secara telak - dokumen yang jadi bukti klasik di fakultas hukum tentang bagaimana JANGAN membuat undang-undang.
  source_ids:
