  summary_id: Delapan belas hari setelah invasi Desember 1975 yang tak disetujui DK PBB, "petisi integrasi" diselenggarakan dan UU No. 7/1976 menyatakan Timor Timur provinsi ke-27. Operasi militer panjang dan kelaparan yang dibatasi akses bantuan menelan korban yang ditaksir hingga ratusan ribu - proporsionalitas yang membuatnya salah satu tragedi terbesar dekade ini. PBB tetap mengakui Portugal sebagai kuasa pengurus sampai 2002.
