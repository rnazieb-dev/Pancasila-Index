- id: ev-soeharto-sd-inpres
  term_id: presiden-soeharto
  date: 1973-04
  category: kebijakan
  title_id: Program SD Inpres membangun puluhan ribu sekolah
  summary_id: "Rezeki minyak 1973 dilempar ke desa: puluhan ribu sekolah dasar
    dibangun dalam beberapa tahun - salah satu ekspansi pendidikan tercepat di
    dunia berkembang. Angka partisipasi SD melonjak dari sekitar separuh anak ke
    hampir universal; Bank Dunia menjadikannya studi kasus klasik. Kritiknya
    menyusul lama kemudian: gedung ada, guru dan mutu mengikuti dengan
    tertinggal satu generasi."
  source_ids:
    - sd-inpres-1973
  dimension_ids:
    - tujuan-3
- id: ev-soeharto-timtim
  term_id: presiden-soeharto
  date: 1976-07
  category: produk-hukum
  title_id: Integrasi Timor Timur lewat UU No. 7/1976
  summary_id: Delapan belas hari setelah invasi Desember 1975 yang tak disetujui
    DK PBB, "petisi integrasi" diselenggarakan dan UU No. 7/1976 menyatakan
    Timor Timur provinsi ke-27. Operasi militer panjang dan kelaparan yang
    dibatasi akses bantuan menelan korban yang ditaksir hingga ratusan ribu -
    proporsionalitas yang membuatnya salah satu tragedi terbesar dekade ini. PBB
    tetap mengakui Portugal sebagai kuasa pengurus sampai 2002.
  source_ids:
    - uu-7-1976
  dimension_ids:
