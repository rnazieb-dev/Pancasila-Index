  summary_id: 'Sidang Istimewa MPRS mencabut mandat Sukarno dan menunjuk Jenderal Suharto sebagai Pejabat Presiden; setahun kemudian dilantik penuh. MPRS yang banyak diisi unsur militer menjadi mesin legitimasi: apa yang tak bisa didapat lewat pemilu didapat lewat sidang. Pola "MPR sebagai penentu arah" berjalan mulus tiga puluh tahun - sampai mahasiswa 1998 turun ke jalan.'
