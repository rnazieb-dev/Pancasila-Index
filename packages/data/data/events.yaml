  title_id: Putusan MK No. 100/PUU-XII/2014
  summary_id: "Jalur pencalonan independen (perseorangan) dibuka kembali untuk pilkada setelah DPR menghapusnya dari UU Pilkada - putusan yang melahirkan gelombang calon perseorangan, termasuk kelak Jokowi-Ahok era DKI. Pola klasik checks and balances: parlemen menutup pintu partisipasi, penjaga konstitusi membukanya lewat jendela."
