- id: ev-soekarno1-proklamasi-uud
  term_id: presiden-soekarno-i
  date: 1945-08-18
  category: pengangkatan
  title_id: Pengesahan UUD 1945 oleh PPKI
  summary_id: Sehari setelah proklamasi, PPKI mengesahkan konstitusi pertama
    republik dan melantik Sukarno-Hatta - dalam satu rapat yang juga memutus
    pembentukan kementerian pertama. Konstitusi 65 pasal itu dirancang untuk
    "masa genting"; tak seorang pun membayangkan ia akan berlaku puluhan tahun
    dengan penyimpangan-penyimpangan besar. Negara lahir dengan konstitusi
    darurat dan semangat yang belum selesai diperdebatkan.
  source_ids:
