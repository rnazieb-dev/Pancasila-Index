    - negara-hukum
  actor_ids:
    - juliari-batubara
- id: ev-jokowi2-kanjuruhan
  term_id: presiden-jokowi-ii
  date: 2022-10
  category: krisis
  title_id: Tragedi Kanjuruhan - 135 tewas oleh gas air mata di tribun
  summary_id: 1 Oktober 2022, usai Arema kalah dari Persebaya, polisi menembakkan
    gas air mata ke arah tribun yang penuh sesak - pelanggaran langsung aturan
    FIFA. Ribuan orang panik menuju pintu keluar terkunci; 135 jiwa melayang,
    583 luka. TGIPF yang dibentuk presiden menunjuk enam tersangka termasuk tiga
    perwira polisi, tetapi prosesnya berjalan lamban dan vonis-restitusi jauh di
    bawah harapan korban (Rp1,02 miliar dari tuntutan Rp17,5 miliar). Negara
    merespons dengan UU Keolahragaan baru - setelah, seperti biasa, nyawa sudah
    hilang lebih dahulu.
  source_ids:
    - berita-kanjuruhan-tgipf-2022
    - uu-11-2022-keolahragaan
  dimension_ids:
    - tujuan-1
    - sila-2
- id: ev-jokowi2-g20-bali
  term_id: presiden-jokowi-ii
  date: 2022-11
  category: kebijakan
  title_id: Presidensi G20 Indonesia dan KTT Bali di tengah perang Ukraina
  summary_id: Di tengah perang Rusia-Ukraina yang memecah dunia, Indonesia
    memimpin G20 dan memaksakan satu-satunya KTT yang dihadiri Biden dan para
    pemimpin G7 sekaligus Lavrov (15-16 November 2022, Bali). Diplomasi kursi
    roda Jokowi - ke Kiev, Moskwa, Beijing - mengangkat citra Indonesia sebagai
    jembatan Global South. Warisan diplomasi luar negeri terbesar era ini, meski
    komitmen hasil KTT banyak yang tinggal dokumen.
  source_ids:
    - berita-g20-bali-2022
  dimension_ids:
    - tujuan-4
- id: ev-jokowi2-pemekaran-papua
  term_id: presiden-jokowi-ii
  date: 2022-07
  category: produk-hukum
  title_id: Pemekaran tiga provinsi Papua tanpa konsultasi DPRP
  summary_id: "Juli 2022, pemerintah dan DPR mengesahkan lahirnya Papua Selatan,
    Papua Tengah, dan Papua Pegunungan - meski DPRP Papua secara resmi
    menolaknya dan UU Otsus mensyaratkan persetujuan MRP. Masyarakat sipil dan
    sebagian gereja menyebutnya strategi militeristik memecah gerakan Papua;
    pemerintah menyebut pemerataan layanan. Kontradiksi hukum dan politiknya
    menganga: otonomi khusus dilanggar oleh undang-undang yang seharusnya
    melindunginya."
  source_ids:
    - berita-pemekaran-papua-2022
  dimension_ids:
    - sila-3
- id: ev-prabowo-brics
  term_id: presiden-prabowo
  date: 2025-01
  category: kebijakan
  title_id: Indonesia resmi anggota penuh BRICS
  summary_id: 6 Januari 2025, Brasil selaku ketua BRICS mengumumkan Indonesia
    sebagai anggota penuh - negara Asia Tenggara pertama di blok Global South
    yang dipimpin China-Rusia itu. Pilihan Prabowo yang dieksekusi cepat setelah
    pencalonannya disetujui Johannesburg 2023. Bagi pendukungnya, langkah
    strategis diversifikasi aliansi; bagi kritikusnya, geseran dari bebas-aktif
    ke berkembar ganda - bergabung BRICS sambil berproses masuk OECD Barat. Arah
    kebijakan luar negeri pertama era ini yang benar-benar menguji doktrin.
  source_ids:
    - berita-brics-ri-2025
  dimension_ids:
    - tujuan-4
- id: ev-soekarno1-pasukan-garuda
  term_id: presiden-soekarno-i
  date: 1957-09
  category: kebijakan
  title_id: Pasukan Garuda I dikirim ke Mesir (UNEF)
  summary_id: September 1957, 559 personel TNI mendarat di Sinai sebagai kontingen
    pertama pasukan perdamaian PBB - hanya dua tahun setelah KAA Bandung. Dari
    misi Garuda I itu lahir tradisi lima puluh lebih misi dan puluhan ribu
    peacekeeper Indonesia hingga hari ini, salah satu kontributor terbesar
    dunia. Bukti bahwa politik luar negeri bebas-aktif pernah punya kaki di
    lapangan, bukan cuma di mimbar.
  source_ids:
    - literatur-sejarah-nasional
