  summary_id: 22 Januari 2026 di Davos, Prabowo menandatangani Board of Peace Charter - badan baru ciptaan Trump untuk mengawasi administrasi, stabilisasi, dan rekonstruksi Gaza lewat mandat Resolusi DK PBB 2803 (2025). Keanggotaan diundang langsung oleh sang ketua; pada 11 Februari Netanyahu pun menandatanganinya, membuat negara pendudukan duduk satu meja dengan negara yang konstitusinya mewajibkan pembebasan Palestina. Pemerintah membaca langkah ini sebagai jalan mendorong solusi dua negara dari dalam; pakar hukum internasional membalas tajam - struktur pengawasan atas wilayah terjajara tanpa kedaulatan Palestina penuh "menyerupai kolonialisme", dan sejumlah kalangan mendesak Indonesia keluar sebagai pengkhianatan politik bebas-aktif. Pertemuan perdana BoP digelar 19 Februari di Washington dengan Prabowo hadir.
