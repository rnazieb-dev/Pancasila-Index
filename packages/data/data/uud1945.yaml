# ============================================================
# UUD NRI TAHUN 1945 - SATU NASKAH HASIL EMPAT AMANDMEN (2002)
# ============================================================
# Peta lengkap batang tubuh konstitusi: setiap pasal dipetakan ke
# dimensi rubrik agar tidak ada norma yang lolos dari penilaian.
# Sumber teks: Wikisumber/MKRI "Satu Naskah" (Risalah Paripurna
# ke-5 Sidang Tahunan MPR 2002).
#
# Catatan penomoran:
#   - Bab IV (DPA) DIHAPUS oleh Perubahan Keempat.
#   - Pasal 16 tetap ada, diubah menjadi dewan pertimbangan presiden.
#   - Pasal 6A/7A/7B/7C, 18A/18B, 20A, 22A-22E, 23A-23G,
#     24A/24B/24C, 25A, 28A-28J, 36A/36B/36C lahir dari amandemen.

title_id: Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 (Satu Naskah Hasil Amandemen)
description_id: >
  Batang tubuh lengkap konstitusi hasil empat tahap amandemen
  (1999-2002). Setiap pasal dipetakan ke dimensi Rubrik
  Kepancasilaan sebagai jaminan cakupan penuh norma konstitusi.

babs:

  - nomor: "I"
    nama_id: Bentuk dan Kedaulatan
    pasal:
      - nomor: "1"
        ringkas_id: Negara Indonesia negara kesatuan berbentuk republik; kedaulatan di tangan rakyat dilaksanakan menurut UUD; Indonesia adalah negara hukum.
        dimension_ids: [kedaulatan-rakyat, negara-hukum]

  - nomor: "II"
    nama_id: Majelis Permusyawaratan Rakyat
    pasal:
      - nomor: "2"
        ringkas_id: MPR terdiri atas anggota DPR dan anggota DPD yang dipilih melalui pemilu; bersidang sekurang-kurangnya sekali dalam lima tahun.
        dimension_ids: [checks-balances]
      - nomor: "3"
        ringkas_id: MPR berwenang mengubah dan menetapkan UUD, melantik Presiden/Wapres, dan hanya dapat memberhentikan mereka menurut UUD.
        dimension_ids: [kedaulatan-rakyat, checks-balances]

  - nomor: "III"
    nama_id: Kekuasaan Pemerintahan Negara
    pasal:
      - nomor: "4"
        ringkas_id: Presiden memegang kekuasaan pemerintahan menurut UUD dan dibantu seorang Wakil Presiden.
        dimension_ids: [checks-balances]
      - nomor: "5"
        ringkas_id: Presiden berhak mengajukan RUU kepada DPR dan menetapkan peraturan pemerintah untuk menjalankan undang-undang.
        dimension_ids: [negara-hukum]
      - nomor: "6"
        ringkas_id: Calon presiden/wapres warga Indonesia sejak kelahiran, tidak pernah menerima kewarganegaraan lain atas kehendak sendiri, tidak pernah mengkhianati negara, mampu rohani-jasmani.
        dimension_ids: [kedaulatan-rakyat]
      - nomor: "6A"
        ringkas_id: Presiden dan Wakil Presiden dipilih dalam satu pasangan secara langsung oleh rakyat; ambang 50%+ tersebar 20% di lebih dari setengah provinsi.
        dimension_ids: [sila-4, kedaulatan-rakyat]
      - nomor: "7"
        ringkas_id: Masa jabatan presiden-wapres lima tahun; dapat dipilih kembali hanya untuk satu kali masa jabatan.
        dimension_ids: [kedaulatan-rakyat]
      - nomor: "7A"
        ringkas_id: Presiden/wapres dapat diberhentikan oleh MPR atas usul DPR karena pengkhianatan, korupsi, penyuapan, tindak pidana berat lain, perbuatan tercela, atau tidak lagi memenuhi syarat.
        dimension_ids: [checks-balances, sila-2]
      - nomor: "7B"
        ringkas_id: Usul pemberhentian harus melalui putusan MK atas pendapat DPR; dukungan 2/3 anggota hadir pada paripurna 2/3; MK memutus maksimal 90 hari.
        dimension_ids: [checks-balances, negara-hukum]
      - nomor: "7C"
        ringkas_id: Presiden tidak dapat membekukan dan/atau membubarkan DPR.
        dimension_ids: [checks-balances]
      - nomor: "8"
        ringkas_id: Jika presiden mangkat/berhenti/diberhentikan digantikan wapres; prosedur pengisian kekosongan dan pelaksana tugas presiden.
        dimension_ids: [checks-balances]
      - nomor: "9"
        ringkas_id: Sumpah/janji presiden dan wakil presiden sebelum memangku jabatan.
        dimension_ids: []
      - nomor: "10"
        ringkas_id: Presiden memegang kekuasaan tertinggi atas AD, AL, dan AU.
        dimension_ids: [tujuan-1]
      - nomor: "11"
        ringkas_id: Dengan persetujuan DPR presiden menyatakan perang, membuat perdamaian dan perjanjian dengan negara lain; perjanjian internasional berdampak luas perlu persetujuan DPR.
        dimension_ids: [tujuan-4, checks-balances]
      - nomor: "12"
        ringkas_id: Presiden menyatakan keadaan bahaya; syarat dan akibatnya ditetapkan undang-undang.
        dimension_ids: [tujuan-1, checks-balances]
      - nomor: "13"
        ringkas_id: Presiden mengangkat duta dan konsul serta menerima penempatan duta negara lain dengan memperhatikan pertimbangan DPR.
        dimension_ids: [tujuan-4]
      - nomor: "14"
        ringkas_id: Presiden memberi grasi dan rehabilitasi dengan pertimbangan MA; amnesti dan abolisi dengan pertimbangan DPR.
        dimension_ids: [sila-2]
      - nomor: "15"
        ringkas_id: Presiden memberi gelar, tanda jasa, dan tanda kehormatan lain yang diatur undang-undang.
        dimension_ids: []
      - nomor: "16"
        ringkas_id: Presiden membentuk dewan pertimbangan yang bertugas memberi nasihat dan pertimbangan kepada presiden (Wantimpres).
        dimension_ids: [checks-balances]

  - nomor: "IV"
    nama_id: Dewan Pertimbangan Agung
    catatan_id: Dihapus oleh Perubahan Keempat (2002); fungsinya digantikan dewan pertimbangan presiden pada Pasal 16.
    pasal: []

  - nomor: "V"
    nama_id: Kementerian Negara
    pasal:
      - nomor: "17"
        ringkas_id: Presiden dibantu menteri-menteri negara yang diangkat-diberhentikan presiden; pembentukan/pembubaran kementerian diatur undang-undang.
        dimension_ids: [checks-balances]

  - nomor: "VI"
    nama_id: Pemerintahan Daerah
    pasal:
      - nomor: "18"
        ringkas_id: NKRI dibagi provinsi lalu kabupaten/kota dengan pemerintahan daerah; otonomi seluas-luasnya dan tugas pembantuan; kepala daerah dipilih demokratis.
        dimension_ids: [sila-3, kedaulatan-rakyat]
      - nomor: "18A"
        ringkas_id: Hubungan wewenang dan keuangan pusat-daerah diatur undang-undang dengan memperhatikan kekhususan dan keragaman daerah, adil dan selaras.
        dimension_ids: [sila-3]
      - nomor: "18B"
        ringkas_id: Negara mengakui satuan pemerintahan khusus/istimewa serta kesatuan masyarakat hukum adat beserta hak tradisionalnya sepanjang masih hidup dan sesuai perkembangan zaman.
        dimension_ids: [sila-3, sila-1]

  - nomor: "VII"
    nama_id: Dewan Perwakilan Rakyat
    pasal:
      - nomor: "19"
        ringkas_id: Anggota DPR dipilih melalui pemilihan umum; susunan DPR diatur undang-undang.
        dimension_ids: [kedaulatan-rakyat]
      - nomor: "20"
        ringkas_id: DPR memegang kekuasaan membentuk undang-undang; setiap RUU dibahas DPR dan presiden untuk persetujuan bersama; disahkan dalam 30 hari.
        dimension_ids: [checks-balances]
      - nomor: "20A"
        ringkas_id: Fungsi legislasi, anggaran, dan pengawasan; hak interpelasi, hak angket, hak menyatakan pendapat, serta hak imunitas anggota.
        dimension_ids: [checks-balances, kedaulatan-rakyat]
      - nomor: "21"
        ringkas_id: Anggota DPR berhak mengajukan usul rancangan undang-undang.
        dimension_ids: [kedaulatan-rakyat]
      - nomor: "22"
        ringkas_id: Dalam ihwal kegentingan yang memaksa presiden menetapkan Perppu yang wajib mendapat persetujuan DPR pada sidang berikutnya; jika tidak disetujui harus dicabut.
        dimension_ids: [negara-hukum, checks-balances]
      - nomor: "22A"
        ringkas_id: Tata cara pembentukan undang-undang diatur dengan undang-undang.
        dimension_ids: [negara-hukum]
      - nomor: "22B"
        ringkas_id: Anggota DPR dapat diberhentikan dari jabatan dengan syarat dan tata cara yang diatur undang-undang.
        dimension_ids: [negara-hukum]

  - nomor: "VIIA"
    nama_id: Dewan Perwakilan Daerah
    pasal:
      - nomor: "22C"
        ringkas_id: Anggota DPD dipilih dari setiap provinsi melalui pemilu; jumlah antarprovinsi sama, tidak melebihi sepertiga anggota DPR.
        dimension_ids: [sila-3, kedaulatan-rakyat]
      - nomor: "22D"
        ringkas_id: DPD dapat mengajukan RUU terkait otonomi daerah, hubungan pusat-daerah, SDA, dan perimbangan keuangan; ikut membahas serta mengawasi pelaksanaannya.
        dimension_ids: [sila-3, checks-balances]

  - nomor: "VIIB"
    nama_id: Pemilihan Umum
    pasal:
      - nomor: "22E"
        ringkas_id: Pemilu langsung umum bebas rahasia jujur adil setiap lima tahun; peserta pemilu legislatif partai politik; penyelenggara komisi pemilu nasional tetap dan mandiri.
        dimension_ids: [sila-4, kedaulatan-rakyat]

  - nomor: "VIII"
    nama_id: Hal Keuangan
    pasal:
      - nomor: "23"
        ringkas_id: APBN sebagai wujud pengelolaan keuangan negara ditetapkan setiap tahun dengan UU untuk sebesar-besarnya kemakmuran rakyat; diajukan presiden dibahas DPR dengan pertimbangan DPD.
        dimension_ids: [tujuan-2, checks-balances]
      - nomor: "23A"
        ringkas_id: Pajak dan pungutan lain yang bersifat memaksa untuk keperluan negara diatur dengan undang-undang.
        dimension_ids: [negara-hukum]
      - nomor: "23B"
        ringkas_id: Macam dan harga mata uang ditetapkan dengan undang-undang.
        dimension_ids: [negara-hukum]
      - nomor: "23C"
        ringkas_id: Hal-hal lain mengenai keuangan negara diatur dengan undang-undang.
        dimension_ids: [negara-hukum]
      - nomor: "23D"
        ringkas_id: Negara memiliki bank sentral dengan susunan, kedudukan, kewenangan, tanggung jawab, dan independensi yang diatur undang-undang.
        dimension_ids: [negara-hukum]

  - nomor: "VIIIA"
    nama_id: Badan Pemeriksa Keuangan
    pasal:
      - nomor: "23E"
        ringkas_id: BPK dibentuk bebas dan mandiri untuk memeriksa pengelolaan dan tanggung jawab keuangan negara; hasilnya diserahkan kepada DPR, DPD, dan DPRD.
        dimension_ids: [checks-balances, negara-hukum]
      - nomor: "23F"
        ringkas_id: Anggota BPK dipilih DPR dengan memperhatikan pertimbangan DPD dan diresmikan presiden; pimpinan dipilih dari dan oleh anggota.
        dimension_ids: [checks-balances]
      - nomor: "23G"
        ringkas_id: BPK berkedudukan di ibu kota negara dan memiliki perwakilan di setiap provinsi.
        dimension_ids: []

  - nomor: "IX"
    nama_id: Kekuasaan Kehakiman
    pasal:
      - nomor: "24"
        ringkas_id: Kekuasaan kehakiman merdeka untuk menyelenggarakan peradilan guna menegakkan hukum dan keadilan; dilakukan MA dan badan peradilan di bawahnya serta Mahkamah Konstitusi.
        dimension_ids: [negara-hukum]
      - nomor: "24A"
        ringkas_id: MA mengadili tingkat kasasi dan menguji peraturan di bawah UU terhadap UU; hakim agung harus berintegritas; calon diusulkan KY kepada DPR lalu ditetapkan presiden.
        dimension_ids: [negara-hukum]
      - nomor: "24B"
        ringkas_id: Komisi Yudisial bersifat mandiri, mengusulkan pengangkatan hakim agung, dan menjaga kehormatan serta perilaku hakim.
        dimension_ids: [negara-hukum, checks-balances]
      - nomor: "24C"
        ringkas_id: MK berwenang menguji UU terhadap UUD, memutus sengketa kewenangan lembaga negara, pembubaran partai, dan perselisihan hasil pemilu; sembilan hakim diusulkan MA, DPR, dan presiden masing-masing tiga orang.
        dimension_ids: [negara-hukum, checks-balances]
      - nomor: "25"
        ringkas_id: Syarat menjadi dan diperhentikan sebagai hakim ditetapkan dengan undang-undang.
        dimension_ids: [negara-hukum]

  - nomor: "IXA"
    nama_id: Wilayah Negara
    pasal:
      - nomor: "25A"
        ringkas_id: NKRI adalah negara kepulauan berciri Nusantara dengan wilayah yang batas-batas dan hak-haknya ditetapkan undang-undang.
        dimension_ids: [sila-3]

  - nomor: "X"
    nama_id: Warga Negara dan Penduduk
    pasal:
      - nomor: "26"
        ringkas_id: Warga negara ialah orang bangsa Indonesia asli dan bangsa lain yang disahkan UU; ketentuan warga negara dan penduduk diatur UU.
        dimension_ids: [sila-2]
      - nomor: "27"
        ringkas_id: Segala warga negara sama kedudukannya di hukum dan pemerintahan; berhak atas pekerjaan dan penghidupan layak; berhak-wajib ikut pembelaan negara.
        dimension_ids: [sila-2, sila-5]
      - nomor: "28"
        ringkas_id: Kemerdekaan berserikat, berkumpul, dan mengeluarkan pikiran ditetapkan dengan undang-undang.
        dimension_ids: [sila-4]

  - nomor: "XA"
    nama_id: Hak Asasi Manusia
    pasal:
      - nomor: "28A"
        ringkas_id: Setiap orang berhak hidup serta mempertahankan hidup dan kehidupannya.
        dimension_ids: [sila-2]
      - nomor: "28B"
        ringkas_id: Hak membentuk keluarga; hak anak atas kelangsungan hidup, tumbuh-kembang, dan perlindungan dari kekerasan serta diskriminasi.
        dimension_ids: [sila-2]
      - nomor: "28C"
        ringkas_id: Hak mengembangkan diri melalui pemenuhan kebutuhan dasar, pendidikan, manfaat iptek-seni-budaya; hak memperjuangkan hak secara kolektif.
        dimension_ids: [tujuan-3, sila-2]
      - nomor: "28D"
        ringkas_id: Hak atas pengakuan, jaminan, perlindungan, kepastian hukum yang adil, perlakuan sama di depan hukum, kesempatan sama dalam pemerintahan, status kewarganegaraan.
        dimension_ids: [negara-hukum, sila-2]
      - nomor: "28E"
        ringkas_id: Kebebasan memeluk agama dan beribadat, memilih pendidikan-pekerjaan-tempat tinggal; kebebasan meyakini kepercayaan, menyatakan pikiran; kebebasan berserikat-berkumpul-mengeluarkan pendapat.
        dimension_ids: [sila-1, sila-4]
      - nomor: "28F"
        ringkas_id: Hak berkomunikasi dan memperoleh informasi untuk mengembangkan pribadi dan lingkungan sosial, mencari-menyimpan-menyampaikan informasi lewat segala saluran.
        dimension_ids: [sila-4]
      - nomor: "28G"
        ringkas_id: Hak atas perlindungan diri-keluarga-kehormatan-martabat-harta; rasa aman; bebas dari penyiksaan dan perlakuan merendahkan martabat.
        dimension_ids: [sila-2]
      - nomor: "28H"
        ringkas_id: Hidup sejahtera lahir-batin, lingkungan baik-sehat, pelayanan kesehatan; kemudahan/perlakuan khusus untuk persamaan; jaminan sosial; hak milik pribadi.
        dimension_ids: [sila-5, tujuan-2]
      - nomor: "28I"
        ringkas_id: Hak nonderogable (hidup, anti-penyiksaan, pikiran-hati nurani, beragama, anti-perbudakan, diakui hukum, non-retroaktif); anti diskriminasi; identitas budaya masyarakat tradisional; HAM tanggung jawab negara.
        dimension_ids: [sila-2, negara-hukum]
      - nomor: "28J"
        ringkas_id: Kewajiban menghormati HAM orang lain dan tunduk pada pembatasan UU demi jaminan hak orang lain serta moral-agama-keamanan-ketertiban umum masyarakat demokratis.
        dimension_ids: [sila-2, negara-hukum]

  - nomor: "XI"
    nama_id: Agama
    pasal:
      - nomor: "29"
        ringkas_id: Negara berdasar atas Ketuhanan Yang Maha Esa; negara menjamin kemerdekaan tiap penduduk memeluk agama dan beribadat menurut agama dan kepercayaannya.
        dimension_ids: [sila-1]

  - nomor: "XII"
    nama_id: Pertahanan dan Keamanan Negara
    pasal:
      - nomor: "30"
        ringkas_id: Sistem pertahanan-keamanan rakyat semesta; TNI alat negara mempertahankan kedaulatan; Polri menjaga kamtibmas, melindungi-mengayomi-melayani masyarakat, menegakkan hukum.
        dimension_ids: [tujuan-1, sila-2]

  - nomor: "XIII"
    nama_id: Pendidikan dan Kebudayaan
    pasal:
      - nomor: "31"
        ringkas_id: Hak pendidikan semua warga negara; pendidikan dasar wajib dibayar pemerintah; anggaran pendidikan minimal 20% APBN/APBD; pemerintah memajukan iptek dengan menjunjung nilai agama dan persatuan.
        dimension_ids: [tujuan-3]
      - nomor: "32"
        ringkas_id: Negara memajukan kebudayaan nasional menjamin kebebasan memelihara nilai budaya; menghormati bahasa daerah sebagai kekayaan budaya nasional.
        dimension_ids: [tujuan-3, sila-3]

  - nomor: "XIV"
    nama_id: Perekonomian Nasional dan Kesejahteraan Sosial
    pasal:
      - nomor: "33"
        ringkas_id: Ekonomi disusun usaha bersama asas kekeluargaan; cabang produksi penting dan bumi-air-kekayaan alam dikuasai negara untuk kemakmuran rakyat; ekonomi berdasar demokrasi ekonomi.
        dimension_ids: [sila-5]
      - nomor: "34"
        ringkas_id: Fakir miskin dan anak terlantar dipelihara negara; sistem jaminan sosial bagi seluruh rakyat; tanggung jawab fasilitas kesehatan dan pelayanan umum layak.
        dimension_ids: [sila-5, tujuan-2]

  - nomor: "XV"
    nama_id: Bendera, Bahasa, dan Lambang Negara, serta Lagu Kebangsaan
    pasal:
      - nomor: "35"
        ringkas_id: Bendera negara ialah Sang Merah Putih.
        dimension_ids: []
      - nomor: "36"
        ringkas_id: Bahasa negara ialah Bahasa Indonesia.
        dimension_ids: []
      - nomor: "36A"
        ringkas_id: Lambang negara ialah Garuda Pancasila dengan semboyan Bhinneka Tunggal Ika.
        dimension_ids: []
      - nomor: "36B"
        ringkas_id: Lagu kebangsaan ialah Indonesia Raya.
        dimension_ids: []
      - nomor: "36C"
        ringkas_id: Ketentuan lebih lanjut tentang bendera, bahasa, lambang negara, dan lagu kebangsaan diatur undang-undang.
        dimension_ids: []

  - nomor: "XVI"
    nama_id: Perubahan Undang-Undang Dasar
    pasal:
      - nomor: "37"
        ringkas_id: Usul perubahan diagendakan bila diajukan 1/3 anggota; keputusan diambil pada sidang 2/3 kehadiran dengan persetujuan 50%+1 seluruh anggota; bentuk NKRI tidak dapat diubah.
        dimension_ids: [negara-hukum, kedaulatan-rakyat]

  - nomor: "Peralihan"
    nama_id: Aturan Peralihan
    pasal:
      - nomor: "I"
        ringkas_id: Peraturan perundang-undangan lama tetap berlaku selama belum ada yang baru menurut UUD ini.
        dimension_ids: [negara-hukum]
      - nomor: "II"
        ringkas_id: Semua lembaga negara yang ada tetap berfungsi sepanjang belum dibentuk yang baru menurut UUD ini.
        dimension_ids: [negara-hukum]
      - nomor: "III"
        ringkas_id: MK dibentuk selambat-lambatnya 17 Agustus 2003; sebelumnya kewenangannya dijalankan MA.
        dimension_ids: [negara-hukum]

  - nomor: "Tambahan"
    nama_id: Aturan Tambahan
    pasal:
      - nomor: "I"
        ringkas_id: MPR meninjau materi dan status hukum Ketetapan MPRS/MPR untuk diputuskan pada sidang 2003.
        dimension_ids: []
      - nomor: "II"
        ringkas_id: Dengan penetapan perubahan ini, UUD 1945 terdiri atas Pembukaan dan pasal-pasal.
        dimension_ids: []
