    Komposit 13 survei independen bisnis dan penilaian pakar internasional untuk
    mengukur tingkat korupsi di sektor publik, peradilan, dan penegakan hukum.
  url: https://www.transparency.org/en/cpi
  target_dimensions:
    - negara-hukum
    - checks-balances
    - sila-5
  data:
    - year: 2014
      score: 34
      rank: 107
    - year: 2015
      score: 36
      rank: 88
    - year: 2016
      score: 37
      rank: 90
    - year: 2017
      score: 37
      rank: 96
    - year: 2018
      score: 38
      rank: 89
    - year: 2019
      score: 40
      rank: 85
      note: Puncak skor tertinggi pasca-penguatan OTT dan peradilan tipikor.
    - year: 2020
      score: 37
      rank: 102
      note: Penurunan drastis pasca-berlakunya UU No. 19/2019 tentang Perubahan UU KPK.
    - year: 2021
      score: 38
      rank: 96
    - year: 2022
      score: 34
      rank: 110
