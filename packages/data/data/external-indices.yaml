# Indeks Independen Eksternal (Enrichment / Pengaya Konteks Pancasila Index)
# Berisi data deret waktu (time series) indeks pihak ketiga yang kredibel,
# berbasis data keras (hard data) dan peer-reviewed, bebas dari bias birokrasi ABS.

- id: ipi-ercas
  name: Index of Public Integrity (IPI)
  publisher: European Research Centre for Anti-Corruption and State-Building (ERCAS)
  type: hard-data
  scale: 1.0 - 10.0 (10 = Kapasitas kontrol korupsi tertinggi)
  description: >-
    Mengukur kapasitas objektif masyarakat dalam mengontrol korupsi berbasis data keras:
    Independensi Peradilan (Judicial Independence), Beban Administrasi (Administrative Burden),
    Keterbukaan Perdagangan, Transparansi Anggaran, Layanan Publik Digital (E-Services), dan Kebebasan Pers.
  url: https://corruptionrisk.org/country/?country=IDN#integrity
  target_dimensions:
    - negara-hukum
    - checks-balances
    - sila-5
    - sila-4
  data:
    - year: 2015
      score: 6.84
      rank: 65
      total_countries: 109
      note: Penguatan awal e-procurement dan transparansi anggaran APBN.
    - year: 2017
      score: 6.92
      rank: 64
      total_countries: 109
      note: Perluasan digitalisasi layanan perizinan terpadu.
    - year: 2019
      score: 6.78
      rank: 68
      total_countries: 114
      note: Penurunan pada pilar independensi peradilan dan kebebasan sipil.
    - year: 2021
      score: 6.65
      rank: 72
      total_countries: 114
      note: Tekanan terhadap ruang sipil dan dampak pelemahan kerangka antikorupsi.
    - year: 2023
      score: 6.58
      rank: 75
      total_countries: 114
      note: Kemunduran kapasitas pengawasan independen dan transparansi proses regulasi.
  abs_discrepancy_note: >-
    Data IPI menunjukkan tren penurunan kapasitas kontrol korupsi riil sejak 2019,
    sangat kontras dengan laporan internal instansi pemerintah yang rata-rata mengklaim
    kepatuhan Zona Integritas dan Reformasi Birokrasi di atas 85%.

- id: wjp-rule-of-law
  name: WJP Rule of Law Index
  publisher: World Justice Project (WJP)
  type: civil-society
  scale: 0.00 - 1.00 (1.00 = Kepatuhan supremasi hukum mutlak)
  description: >-
    Mengukur 8 faktor supremasi hukum dari survei independen masyarakat umum dan praktisi hukum:
    Pembatasan Kekuasaan Pemerintah, Ketiadaan Korupsi, Keterbukaan Pemerintah, Hak-Hak Dasar,
    Ketertiban & Keamanan, Penegakan Regulasi, Keadilan Perdata, dan Keadilan Pidana.
  url: https://worldjusticeproject.org/rule-of-law-index/country/Indonesia
  target_dimensions:
    - negara-hukum
    - checks-balances
    - sila-2
    - sila-4
  data:
    - year: 2015
      score: 0.52
      rank: 52
      total_countries: 102
    - year: 2016
      score: 0.52
      rank: 61
      total_countries: 113
    - year: 2017
      score: 0.52
      rank: 63
      total_countries: 113
    - year: 2018
      score: 0.52
      rank: 63
      total_countries: 113
    - year: 2019
      score: 0.53
      rank: 63
      total_countries: 126
    - year: 2020
      score: 0.53
      rank: 59
      total_countries: 128
    - year: 2021
      score: 0.52
      rank: 68
      total_countries: 139
    - year: 2022
      score: 0.53
      rank: 64
      total_countries: 140
    - year: 2023
      score: 0.53
      rank: 66
      total_countries: 142
    - year: 2024
      score: 0.52
      rank: 68
      total_countries: 142
  abs_discrepancy_note: >-
    Skor faktor 'Pembatasan Kekuasaan Pemerintah' (Constraints on Government Powers) dan
    'Keadilan Pidana' stagnan di level rendah (~0.48-0.50), membuktikan bahwa deklarasi formal
    WBK/WBBM di peradilan belum mengubah persepsi masyarakat atas praktik impunitas dan intervensi politik.

- id: vdem-deliberative
  name: V-Dem Deliberative & Liberal Democracy Index
  publisher: Varieties of Democracy (V-Dem) Institute, University of Gothenburg
  type: expert-coded
  scale: 0.00 - 1.00 (1.00 = Demokrasi deliberatif berintegritas tinggi)
  description: >-
    Basis data riset akademik global berbasis double-blind expert coding dan model Bayesian,
    menilai kualitas musyawarah publik (meaningful participation), kebebasan akademik/pers,
    serta kapasitas peradilan mengawasi tindakan inkonstitusional eksekutif.
  url: https://v-dem.net/
  target_dimensions:
    - sila-4
    - kedaulatan-rakyat
    - checks-balances
  data:
    - year: 2014
      score: 0.54
      note: Pemilu kompetitif dan stabilitas ruang publik demokratis.
    - year: 2016
      score: 0.53
      note: Polarisasi politik identitas mulai mempengaruhi deliberasi publik.
    - year: 2018
      score: 0.51
      note: Pembatasan awal kebebasan berekspresi digital via pasal karet.
    - year: 2019
      score: 0.46
      note: Gelombang demonstrasi Reformasi Dikorupsi dan revisi kilat legislasi kunci.
    - year: 2020
      score: 0.44
      note: Pengesahan omnibus law dengan partisipasi publik bermakna yang sangat minim.
    - year: 2021
      score: 0.42
      note: Penurunan skor perlindungan kebebasan sipil dan kebebasan akademik.
    - year: 2022
      score: 0.43
      note: Stagnasi deliberasi legislatif dan dominasi koalisi mayoritas eksekutif-parlemen.
    - year: 2023
      score: 0.41
      note: Krisis etika peradilan konstitusi dan kemunduran integritas elektoral.
  abs_discrepancy_note: >-
    V-Dem mengkategorikan Indonesia mengalami gejala 'democratic backsliding' (kemunduran demokrasi)
    sejak 2019, berbanding terbalik dengan laporan kepuasan publik seremonial yang sering dirilis institusi resmi.

- id: cpi-ti
