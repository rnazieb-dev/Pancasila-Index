# Indeks Independen Eksternal (Enrichment / Pengaya Konteks Pancasila Index)
#
# STATUS BERKAS INI - BACA DULU SEBELUM MENGUTIP ANGKANYA.
#
# Berkas ini sebelumnya berisi angka yang tampak masuk akal tetapi tidak bisa
# ditelusuri ke penerbitnya, dan satu indeks yang penerbitnya tidak ada sama
# sekali. Yang sudah dibereskan:
#
#   - Indeks fiktif "Indeks Supremasi Sipil & Integritas Sektor Keamanan"
#     DIHAPUS. Tidak ada indeks maupun penerbit dengan nama itu.
#   - CPI 2024 dikoreksi: sebelumnya 34/peringkat 115 (itu angka 2023),
#     seharusnya 37/peringkat 99. CPI 2025 ditambahkan.
#   - Peringkat RSF 2026 dikoreksi dari 128 menjadi 129.
#
# ATURAN: satu titik data hanya boleh dianggap sah bila punya `provenance`
# (tautan tepat + tanggal ambil + cara ambil). Build MENGHITUNG sendiri derajat
# verifikasi tiap indeks dari kelengkapan provenance - tidak bisa diklaim
# manual di berkas ini. Titik tanpa provenance ditandai "belum terverifikasi"
# di UI dan TIDAK BOLEH dikutip sebagai fakta.
#
# Cara membereskan sisanya: jalankan
#   pnpm --filter @pancasila-index/data fetch:indices
# Script itu mengunduh langsung dari penerbit resmi dan mengisi provenance.
# Di lingkungan build saat ini script tersebut GAGAL karena kebijakan egress
# memblokir seluruh host penerbit (transparency.org, worldjusticeproject.org,
# rsf.org, v-dem.net, internationalbudget.org, api.worldbank.org). Host-host
# itu perlu diizinkan lebih dulu.
#
# `method: pencarian-web` berarti angka itu terbaca dari halaman yang
# disitasi, BUKAN dari unduhan dataset resmi. Derajatnya lebih rendah
# daripada `unduh-dataset` dan sebaiknya diganti begitu unduhan bisa jalan.

- id: ipi-ercas
