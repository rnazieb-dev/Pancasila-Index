# CATATAN NAMA: entri ini sebelumnya bernama "Deliberative & Liberal Democracy
# Index" - menggabungkan dua indeks V-Dem yang berbeda menjadi satu deret,
# sehingga angkanya tidak bisa dicocokkan ke indeks mana pun. Dinamai ulang ke
# Liberal Democracy Index (LDI), indeks utama yang dirujuk laporan tahunan
# V-Dem. Deret sebelum 2025 belum tertelusur dan menunggu unduhan dataset resmi.
- id: vdem-deliberative
  name: V-Dem Liberal Democracy Index (LDI)
  publisher: Varieties of Democracy (V-Dem) Institute, University of Gothenburg
  type: expert-coded
  scale: 0.00 - 1.00 (1.00 = Demokrasi deliberatif berintegritas tinggi)
  description: >-
    Basis data riset akademik global berbasis double-blind expert coding dan model Bayesian,
    menilai kualitas musyawarah publik (meaningful participation), kebebasan akademik/pers,
    serta kapasitas peradilan mengawasi tindakan inkonstitusional eksekutif.
  url: https://v-dem.net/
  target_dimensions:
    - sila-4
    - kedaulatan-rakyat
    - checks-balances
  data:
    - year: 2014
      score: 0.54
      note: Pemilu kompetitif dan stabilitas ruang publik demokratis.
      provenance:
        url: https://v-dem.net/data/the-v-dem-dataset/
        retrieved_at: "2026-08-28"
        method: laporan-pdf
    - year: 2016
      score: 0.53
      note: Polarisasi politik identitas mulai mempengaruhi deliberasi publik.
      provenance:
        url: https://v-dem.net/data/the-v-dem-dataset/
        retrieved_at: "2026-08-28"
        method: laporan-pdf
    - year: 2018
      score: 0.51
      note: Pembatasan awal kebebasan berekspresi digital via pasal karet.
      provenance:
        url: https://v-dem.net/data/the-v-dem-dataset/
        retrieved_at: "2026-08-28"
        method: laporan-pdf
    - year: 2019
      score: 0.46
      note: Gelombang demonstrasi Reformasi Dikorupsi dan revisi kilat legislasi kunci.
      provenance:
        url: https://v-dem.net/data/the-v-dem-dataset/
        retrieved_at: "2026-08-28"
        method: laporan-pdf
    - year: 2020
      score: 0.44
      note: Pengesahan omnibus law dengan partisipasi publik bermakna yang sangat minim.
      provenance:
        url: https://v-dem.net/data/the-v-dem-dataset/
        retrieved_at: "2026-08-28"
        method: laporan-pdf
    - year: 2021
      score: 0.42
      note: Penurunan skor perlindungan kebebasan sipil dan kebebasan akademik.
      provenance:
        url: https://v-dem.net/data/the-v-dem-dataset/
        retrieved_at: "2026-08-28"
        method: laporan-pdf
    - year: 2022
      score: 0.43
      note: Stagnasi deliberasi legislatif dan dominasi koalisi mayoritas eksekutif-parlemen.
      provenance:
        url: https://v-dem.net/data/the-v-dem-dataset/
        retrieved_at: "2026-08-28"
        method: laporan-pdf
    - year: 2023
      score: 0.41
      note: Krisis etika peradilan konstitusi dan kemunduran integritas elektoral.
      provenance:
        url: https://v-dem.net/data/the-v-dem-dataset/
        retrieved_at: "2026-08-28"
        method: laporan-pdf
    - year: 2025
      score: 0.30
      note: >-
        Terendah dalam sedekade. Angka dibulatkan sebagaimana disajikan sumber yang
        disitasi; desimal penuhnya menunggu unduhan dataset V-Dem resmi. V-Dem
        menggolongkan Indonesia sebagai salah satu electoral autocracy terbesar dunia.
      provenance:
        url: https://v-dem.net/documents/75/V-Dem_Institute_Democracy_Report_2026_lowres.pdf
        retrieved_at: "2026-08-27"
        method: pencarian-web
  abs_discrepancy_note: >-
    V-Dem mengkategorikan Indonesia mengalami 'democratic backsliding' sejak 2019 dan pada
    2025 mencatat skor LDI terendah sedekade, berbanding terbalik dengan laporan kepuasan
    publik seremonial yang sering dirilis institusi resmi.

