# Perkara hukum yang melibatkan aktor ketatanegaraan.
#
# ATURAN KERAS berkas ini:
#
# 1. `source_ids` minimal satu - skema menolak perkara tanpa dokumen.
#    Tidak ada nama yang masuk hanya karena "ramai diberitakan".
# 2. `status` wajib eksplisit dan dibaca apa adanya:
#       terlapor    - baru dilaporkan/diadukan
#       tersangka   - sudah ditetapkan penyidik, BELUM diadili
#       terdakwa    - sedang diadili
#       terpidana   - sudah divonis, belum berkekuatan hukum tetap
#       inkracht    - vonis berkekuatan hukum tetap
#       bebas       - diputus bebas atau lepas
#       dihentikan  - penuntutan dihentikan (SP3/SKP2/deponering)
#    UI wajib menampilkan status ini bersama nama. Asas praduga tak bersalah
#    tidak boleh tergilas hanya karena tampilan indeks terlihat tegas.
# 3. `loss_idr` hanya diisi bila angkanya berasal dari audit resmi yang
#    disitasi - bukan dari angka yang beredar di pemberitaan.

