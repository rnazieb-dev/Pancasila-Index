  date: "1945-11-14"
  category: kebijakan
  title_id: Maklumat Pemerintah 14 November 1945 - Pergeseran ke Sistem Parlementer
  summary_id: >-
    Pemerintah mengumumkan pembentukan Kabinet Sutan Sjahrir I yang bertanggung jawab kepada KNIP (Badan Pekerja),
    mengubah praktik sistem presidensial murni UUD 1945 menjadi sistem pertanggungjawaban parlementer semu demi diplomasi internasional.
  source_ids: [maklumat-pemerintah-14-nov-1945]
  dimension_ids: [checks-balances, kedaulatan-rakyat]

- id: ev-perjanjian-linggajati-1946
  term_id: presiden-soekarno-i
  date: "1946-11-15"
  category: peristiwa
  title_id: Persetujuan Linggajati dan Pengakuan De Facto Republik Indonesia
  summary_id: >-
    Delegasi Indonesia dipimpin Sutan Sjahrir menandatangani naskah persetujuan Linggajati dengan Belanda,
    menghasilkan pengakuan de facto atas wilayah Jawa, Madura, dan Sumatera, serta komitmen pembentukan negara federasi RIS.
  source_ids: [perjanjian-linggajati-1946]
  dimension_ids: [tujuan-1, tujuan-4]

- id: ev-perjanjian-renville-1948
  term_id: presiden-soekarno-i
  date: "1948-01-17"
  category: peristiwa
  title_id: Perjanjian Renville dan Garis Van Mook
  summary_id: >-
    Indonesia menandatangani perjanjian gencatan senjata Renville di bawah mediasi Komisi Tiga Negara PBB,
    mengakibatkan penarikan mundur pasukan TNI dari kantong-kantong gerilya di Jawa Barat dan Jawa Timur (Hijrah Siliwangi).
  source_ids: [perjanjian-renville-1948]
  dimension_ids: [tujuan-1, tujuan-4]

- id: ev-perjanjian-roem-royen-1949
  term_id: presiden-soekarno-i
  date: "1949-05-07"
  category: peristiwa
  title_id: Persetujuan Roem-Roijen Membuka Jalan Pengembalian Pemerintahan RI ke Yogyakarta
  summary_id: >-
    Diplomasi Mohammad Roem dan J.H. van Roijen menyepakati penghentian perang gerilya, pemulihan pemerintahan RI di Yogyakarta,
    dan penyelenggaraan Konferensi Meja Bundar di Den Haag untuk penyerahan kedaulatan penuh tanpa syarat.
  source_ids: [perjanjian-roem-royen-1949]
  dimension_ids: [tujuan-1, tujuan-4]

- id: ev-keadaan-darurat-sob-1957
  term_id: presiden-soekarno-i
  date: "1957-03-14"
  category: kebijakan
  title_id: Pemberlakuan Keadaan Darurat Perang (SOB) di Seluruh Wilayah Indonesia
  summary_id: >-
    Presiden Sukarno memberlakukan Keadaan Darurat Perang (Staat van Oorlog en Beleg / SOB) melalui Keppres No. 40/1957
    menanggapi krisis politik daerah dan pergolakan militer daerah (Dewan Banteng, Dewan Gajah, Permesta), memperluas wewenang militer dalam urusan sipil.
  source_ids: [deklarasi-keadaan-perang-1957]
  dimension_ids: [tujuan-1, checks-balances]

- id: ev-nasionalisasi-belanda-1958
  term_id: presiden-soekarno-i
  date: "1958-12-27"
  category: produk-hukum
  title_id: Pengesahan UU No. 86 Tahun 1958 tentang Nasionalisasi Perusahaan Milik Belanda
  summary_id: >-
    Pemerintah dan DPR mengesahkan nasionalisasi ratusan perusahaan perkebunan, pertambangan, perkapalan (KPM),
    dan perbankan milik Belanda menjadi Badan Usaha Milik Negara (BUMN) sebagai bagian dari perjuangan pembebasan Irian Barat dan kedaulatan ekonomi Pasal 33 UUD 1945.
  source_ids: [uu-86-1958]
  dimension_ids: [tujuan-2, sila-5]

