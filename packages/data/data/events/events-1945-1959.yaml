# Peristiwa Konstitusional & Sejarah Tata Negara: Era Revolusi & Parlementer (1945–1959)

- id: ev-maklumat-wapres-x-1945
  term_id: presiden-soekarno-i
  date: "1945-11-03"
  category: produk-hukum
  title_id: Maklumat Wakil Presiden No. X - Fondasi Sistem Multi-Partai Indonesia
  summary_id: >-
    Wakil Presiden Mohammad Hatta mengeluarkan maklumat yang menganjurkan pembentukan partai-partai politik
    guna memperkuat perjuangan kemerdekaan dan membuktikan kepada dunia internasional bahwa Indonesia adalah negara demokratis.
  source_ids: [maklumat-wakil-presiden-x-1945]
  dimension_ids: [kedaulatan-rakyat, sila-4]

- id: ev-maklumat-pemerintah-14-nov-1945
  term_id: presiden-soekarno-i
  date: "1945-11-14"
  category: kebijakan
  title_id: Maklumat Pemerintah 14 November 1945 - Pergeseran ke Sistem Parlementer
  summary_id: >-
    Pemerintah mengumumkan pembentukan Kabinet Sutan Sjahrir I yang bertanggung jawab kepada KNIP (Badan Pekerja),
    mengubah praktik sistem presidensial murni UUD 1945 menjadi sistem pertanggungjawaban parlementer semu demi diplomasi internasional.
  source_ids: [maklumat-pemerintah-14-nov-1945]
  dimension_ids: [checks-balances, kedaulatan-rakyat]

- id: ev-perjanjian-linggajati-1946
  term_id: presiden-soekarno-i
  date: "1946-11-15"
  category: peristiwa
  title_id: Persetujuan Linggajati dan Pengakuan De Facto Republik Indonesia
  summary_id: >-
    Delegasi Indonesia dipimpin Sutan Sjahrir menandatangani naskah persetujuan Linggajati dengan Belanda,
    menghasilkan pengakuan de facto atas wilayah Jawa, Madura, dan Sumatera, serta komitmen pembentukan negara federasi RIS.
  source_ids: [perjanjian-linggajati-1946]
  dimension_ids: [tujuan-1, tujuan-4]

- id: ev-perjanjian-renville-1948
  term_id: presiden-soekarno-i
  date: "1948-01-17"
  category: peristiwa
  title_id: Perjanjian Renville dan Garis Van Mook
  summary_id: >-
    Indonesia menandatangani perjanjian gencatan senjata Renville di bawah mediasi Komisi Tiga Negara PBB,
    mengakibatkan penarikan mundur pasukan TNI dari kantong-kantong gerilya di Jawa Barat dan Jawa Timur (Hijrah Siliwangi).
  source_ids: [perjanjian-renville-1948]
  dimension_ids: [tujuan-1, tujuan-4]

- id: ev-perjanjian-roem-royen-1949
  term_id: presiden-soekarno-i
  date: "1949-05-07"
  category: peristiwa
  title_id: Persetujuan Roem-Roijen Membuka Jalan Pengembalian Pemerintahan RI ke Yogyakarta
  summary_id: >-
    Diplomasi Mohammad Roem dan J.H. van Roijen menyepakati penghentian perang gerilya, pemulihan pemerintahan RI di Yogyakarta,
    dan penyelenggaraan Konferensi Meja Bundar di Den Haag untuk penyerahan kedaulatan penuh tanpa syarat.
  source_ids: [perjanjian-roem-royen-1949]
  dimension_ids: [tujuan-1, tujuan-4]

- id: ev-keadaan-darurat-sob-1957
  term_id: presiden-soekarno-i
  date: "1957-03-14"
  category: kebijakan
  title_id: Pemberlakuan Keadaan Darurat Perang (SOB) di Seluruh Wilayah Indonesia
  summary_id: >-
    Presiden Sukarno memberlakukan Keadaan Darurat Perang (Staat van Oorlog en Beleg / SOB) melalui Keppres No. 40/1957
    menanggapi krisis politik daerah dan pergolakan militer daerah (Dewan Banteng, Dewan Gajah, Permesta), memperluas wewenang militer dalam urusan sipil.
  source_ids: [deklarasi-keadaan-perang-1957]
  dimension_ids: [tujuan-1, checks-balances]

- id: ev-nasionalisasi-belanda-1958
  term_id: presiden-soekarno-i
  date: "1958-12-27"
  category: produk-hukum
  title_id: Pengesahan UU No. 86 Tahun 1958 tentang Nasionalisasi Perusahaan Milik Belanda
  summary_id: >-
    Pemerintah dan DPR mengesahkan nasionalisasi ratusan perusahaan perkebunan, pertambangan, perkapalan (KPM),
    dan perbankan milik Belanda menjadi Badan Usaha Milik Negara (BUMN) sebagai bagian dari perjuangan pembebasan Irian Barat dan kedaulatan ekonomi Pasal 33 UUD 1945.
  source_ids: [uu-86-1958]
  dimension_ids: [tujuan-2, sila-5]

- id: ev-kmb-1949
  term_id: presiden-soekarno-i
  date: "1949-12-27"
  category: peristiwa
  title_id: Penyerahan Kedaulatan Hasil Konferensi Meja Bundar (KMB) Den Haag
  summary_id: >-
    Kerajaan Belanda secara resmi menyerahkan kedaulatan penuh dan tanpa syarat kepada Republik Indonesia Serikat (RIS)
    di Istana Dam Amsterdam dan Jakarta, mengakhiri agresi militer Belanda dan membuka jalan kembali ke NKRI pada 17 Agustus 1950.
  source_ids: [naskah-kmb-1949]
  dimension_ids: [tujuan-1, tujuan-4]

- id: ev-kaa-bandung-1955
  term_id: presiden-soekarno-i
  date: "1955-04-24"
  category: peristiwa
  title_id: Konferensi Asia-Afrika (KAA) Bandung & Deklarasi Dasasila Bandung
  summary_id: >-
    Indonesia memprakarsai dan menjadi tuan rumah KAA yang dihadiri 29 negara Asia-Afrika, melahirkan Dasasila Bandung
    yang menolak kolonialisme, mempromosikan perdamaian dunia (Tujuan 4 UUD 1945), dan menjadi cikal bakal Gerakan Non-Blok.
  source_ids: [dasasila-bandung-1955]
  dimension_ids: [tujuan-4, sila-2]

- id: ev-pemilu-pertama-1955
  term_id: presiden-soekarno-i
  date: "1955-09-29"
  category: peristiwa
  title_id: Penyelenggaraan Pemilihan Umum Pertama 1955 (DPR & Konstituante)
  summary_id: >-
    Indonesia menyelenggarakan pemilihan umum nasional pertama yang demokratis dan bebas diikuti puluhan partai politik
    dan perseorangan dengan tingkat partisipasi pemilih di atas 90% tanpa insiden kekerasan politik yang berarti.
  source_ids: [arsip-pemilu-1955]
  dimension_ids: [kedaulatan-rakyat, sila-4]

- id: ev-deklarasi-djuanda-1957
  term_id: presiden-soekarno-i
  date: "1957-12-13"
  category: kebijakan
  title_id: Deklarasi Djuanda 1957 - Penetapan Konsep Negara Kepulauan Indonesia
  summary_id: >-
    Perdana Menteri Djuanda Kartawidjaja mendeklarasikan bahwa seluruh perairan di sekitar, di antara, dan yang menghubungkan
    pulau-pulau Indonesia adalah bagian integral wilayah kedaulatan mutlak NKRI, melipatgandakan luas wilayah laut nasional menjadi 5 juta km².
  source_ids: [deklarasi-djuanda-1957]
  dimension_ids: [tujuan-1, sila-3]

- id: ev-pembentukan-depernas-1959
  term_id: presiden-soekarno-i
  date: "1958-10-23"
  category: produk-hukum
  title_id: Pembentukan Dewan Perancang Nasional (Depernas/Bappenas)
  summary_id: >-
    Pemerintah mengesahkan UU No. 80/1958 tentang Pembentukan Dewan Perancang Nasional (Depernas) pimpinan Mohammad Yamin,
    peletak dasar perencanaan pembangunan nasional menyeluruh dan terencana untuk kemakmuran rakyat (Tujuan 2 UUD 1945).
  source_ids: [uu-80-1958]
  dimension_ids: [tujuan-2, sila-5]



