  category: produk-hukum
  title_id: Maklumat Wakil Presiden No. X - Fondasi Sistem Multi-Partai Indonesia
  summary_id: >-
    Wakil Presiden Mohammad Hatta mengeluarkan maklumat yang menganjurkan pembentukan partai-partai politik
    guna memperkuat perjuangan kemerdekaan dan membuktikan kepada dunia internasional bahwa Indonesia adalah negara demokratis.
