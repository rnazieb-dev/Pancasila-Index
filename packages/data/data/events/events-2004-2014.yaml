# Peristiwa Konstitusional & Sejarah Tata Negara: Era Pemantapan Demokrasi (2004–2014)

- id: ev-mk-putusan-kkr-2006
  term_id: mk-2003-2008
  date: "2006-12-07"
  category: pengadilan
  title_id: Putusan MK No. 006/PUU-IV/2006 Membatalkan UU Komisi Kebenaran dan Rekonsiliasi
  summary_id: >-
    MK membatalkan seluruh isi UU No. 27/2004 tentang KKR karena Pasal 27 yang mensyaratkan pemberian amnesti Presiden
    sebagai syarat diberikannya kompensasi dan rehabilitasi bagi korban pelanggaran HAM berat mencederai kepastian hukum yang adil.
  source_ids: [putusan-mk-006-puu-iv-2006]
