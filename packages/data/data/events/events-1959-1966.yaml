  title_id: Dwi Komando Rakyat (Dwikora) - Konfrontasi Menentang Pembentukan Malaysia
  summary_id: >-
    Presiden Sukarno mengumumkan Komando Dwikora untuk memperhebat ketahanan revolusi Indonesia dan membantu perjuangan rakyat Malaya,
