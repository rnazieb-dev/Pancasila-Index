  category: kebijakan
  title_id: Pidato Penemuan Kembali Revolusi Kita (Manifesto Politik / Manipol-USDEK)
  summary_id: >-
    Presiden Sukarno menyampaikan pidato kenegaraan yang kemudian ditetapkan oleh DPAS dan MPRS sebagai Garis-Garis Besar Haluan Negara,
