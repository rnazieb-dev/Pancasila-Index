  title_id: "UU No. 15 Tahun 1975 tentang Perubahan Undang-Undang Nomor 15 Tahun 1969 tentang Pemilihan Umum Angota-Anggota Badan Permusyawaratan/Perwakilan Rakyat"
  summary_id: "Perubahan UU Pemilihan Umum ini melengkapi UU 3/1975: setelah peserta pemilu dibatasi jadi dua partai plus Golkar, aturan teknis penyelenggaraannya pun ditempatkan di bawah kendali pemerintah, dari pendaftaran pemilih hingga penghitungan suara. Pemilu tetap diselenggarakan tepat waktu setiap lima tahun - keteraturan prosedural yang justru menjadi tameng: yang rutin dijalankan adalah tata caranya, bukan kompetisinya."
