- id: "ev-jdih-uu-16-1975"
  term_id: "dpr-1971-1999"
  date: "1975-11-24"
  category: "produk-hukum"
  title_id: "UU No. 16 Tahun 1975 tentang Perubahan Undang-Undang Nomor 16 Tahun 1969 tentang Susunan dan Kedudukan Majelis Permusyawaratan Rakyat, Dewan Perwakilan Rakyat dan Dewan Perwakilan Rakyat Daerah"
  summary_id: "Perubahan atas UU 16/1969 mempertahankan kursi yang diisi lewat pengangkatan - terutama jatah ABRI - di MPR, DPR, dan DPRD, sehingga sebagian wakil rakyat tidak pernah melewati kotak suara. Akibatnya sebuah lembaga yang secara konstitusional bersandar pada kedaulatan rakyat menyimpan blok permanen yang loyalitasnya kepada pengangkat, bukan pemilih. DPR menyetujui sendiri aturan yang menentukan siapa boleh duduk di dalamnya."
