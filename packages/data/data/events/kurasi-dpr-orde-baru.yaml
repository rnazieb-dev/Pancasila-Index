- id: "ev-jdih-uu-31-1997"
  term_id: "dpr-1971-1999"
  date: "1997-10-15"
  category: "produk-hukum"
  title_id: "UU No. 31 Tahun 1997 tentang Peradilan Militer"
  summary_id: "UU Peradilan Militer menegaskan bahwa prajurit yang melakukan tindak pidana diadili di lingkungan peradilan militer, termasuk untuk perbuatan yang korbannya warga sipil. Di masa ketika operasi keamanan berlangsung di Aceh, Papua, dan Timor Timur, forum itu menentukan hasil: penyidik, penuntut, dan hakimnya berada dalam satu rantai komando dengan terdakwa. Disahkan pada Oktober 1997, tujuh bulan sebelum kerusuhan Mei 1998 - dan menjadi salah satu sebab mengapa pertanggungjawaban atas kekerasan periode itu tidak pernah sampai ke pengadilan umum."
