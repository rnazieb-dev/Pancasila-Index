- id: "ev-jdih-uu-5-1999"
  term_id: "dpr-1971-1999"
  date: "1999-03-23"
  category: "produk-hukum"
  title_id: "UU No. 5 Tahun 1999 tentang Pencabutan Undang-Undang Nomor 5 Tahun 1985 tentang Referendum"
  summary_id: "Pencabutan UU 5/1985 tentang Referendum - undang-undang yang mensyaratkan referendum dengan ambang persetujuan sangat tinggi sebelum UUD 1945 boleh diubah, dan karenanya secara praktis membekukan konstitusi selama empat belas tahun. Pencabutannya pada Maret 1999 membuka jalan bagi empat kali amandemen 1999-2002. Peristiwa ini merugikan sekaligus meringankan DPR periode ini: ia yang mengesahkan pembekuan itu pada 1985, dan ia pula - dalam bulan-bulan terakhirnya, di bawah tekanan reformasi - yang mencabutnya."
