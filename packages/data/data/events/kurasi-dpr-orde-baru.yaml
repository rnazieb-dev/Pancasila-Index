  date: "1975-08-27"
  category: "produk-hukum"
  title_id: "UU No. 3 Tahun 1975 tentang Partai Politik dan Golongan Karya"
  summary_id: "DPR mengesahkan peleburan paksa sembilan partai hasil Pemilu 1971 menjadi hanya dua - PPP dan PDI - sementara Golongan Karya dibiarkan berdiri di luar kategori partai dan tetap ditopang aparat negara serta korps pegawai negeri. Kontestasi tidak dilarang, melainkan dikurung: rakyat tetap memilih, tetapi hanya dari daftar yang sudah ditentukan negara. Undang-undang inilah fondasi legal yang membuat enam pemilu berikutnya (1977-1997) menghasilkan komposisi yang praktis sama, dan DPR yang mengesahkannya adalah DPR yang diuntungkan olehnya."
