- id: ev-mk-putusan-usia-nikah-2018
  term_id: mk-2018-2023
  date: "2018-12-13"
  category: pengadilan
  title_id: Putusan MK No. 22/PUU-XV/2017 & UU No. 16/2019 Penyetaraan Batas Usia Nikah 19 Tahun
  summary_id: >-
    MK memerintahkan pembentuk undang-undang merevisi batas usia menikah perempuan 16 tahun karena diskriminatif dan mencederai hak tumbuh kembang anak,
    yang ditindaklanjuti DPR dengan mengesahkan UU No. 16/2019 yang menyetarakan batas usia minimal menikah pria dan wanita menjadi 19 tahun.
  source_ids: [putusan-mk-22-puu-xv-2017, uu-16-2019]
