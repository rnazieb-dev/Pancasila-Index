  summary_id: >-
    DPR mengesahkan payung hukum perlindungan data pribadi komprehensif pertama di Indonesia yang menjamin hak privasi konstitusional warga negara,
    mengatur kewajiban pengendali data, dan menetapkan sanksi administratif hingga pidana atas kebocoran dan penyalahgunaan data.
