  summary_id: >-
    Mahkamah Agung mengabulkan permohonan uji materiil Komunitas Pasien Cuci Darah Indonesia (KPCDI) dengan membatalkan
    Pasal 34 ayat 1 dan 2 Perpres No. 75/2019 yang menaikkan iuran BPJS Kesehatan 100%, menyatakan kenaikan tersebut mencederai hak warga atas pelayanan kesehatan layak.
  source_ids: [putusan-ma-31-p-hum-2019]
  dimension_ids: [tujuan-2, sila-5]

