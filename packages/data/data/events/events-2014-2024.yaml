  category: pengadilan
  title_id: Putusan MK No. 136/PUU-XXII/2024 Menegaskan Sanksi Pidana Netralitas TNI/Polri dalam Pilkada
  summary_id: >-
    MK mengabulkan uji materiil Pasal 188 UU Pilkada dengan memasukkan frasa 'pejabat daerah' dan 'anggota TNI/Kepolisian Negara Republik Indonesia'
