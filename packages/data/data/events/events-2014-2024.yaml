  category: pengadilan
  title_id: Putusan MK No. 97/PUU-XIV/2016 Mengakui Hak Kolom Agama Penghayat Kepercayaan
  summary_id: >-
    MK mengabulkan uji materiil UU Administrasi Kependudukan yang diajukan para penghayat kepercayaan,
    memutuskan bahwa kata 'agama' dalam Pasal 61 & 64 harus mencakup 'kepercayaan', mengakhiri diskriminasi administratif puluhan tahun terhadap penganut kepercayaan lokal.
