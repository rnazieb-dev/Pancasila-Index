  date: "2020-02-27"
  category: pengadilan
  title_id: Putusan MA No. 31 P/HUM/2019 Membatalkan Kenaikan Iuran BPJS Kesehatan
  summary_id: >-
    Mahkamah Agung mengabulkan permohonan uji materiil Komunitas Pasien Cuci Darah Indonesia (KPCDI) dengan membatalkan
