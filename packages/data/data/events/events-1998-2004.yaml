  term_id: dpr-1999-2004
  date: "2002-04-17"
  category: produk-hukum
  title_id: Pengesahan UU No. 15 Tahun 2002 tentang Tindak Pidana Pencucian Uang dan Pembentukan PPATK
  summary_id: >-
    DPR dan Pemerintah mengesahkan landasan hukum rezim anti-pencucian uang Indonesia serta membentuk Pusat Pelaporan dan Analisis Transaksi Keuangan (PPATK)
    guna melacak aliran dana hasil kejahatan, korupsi, dan pendanaan terorisme lintas batas (follow the money).
  source_ids: [uu-15-2002]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-uu-terorisme-bom-bali-2003
  term_id: dpr-1999-2004
  date: "2003-04-04"
  category: produk-hukum
  title_id: Pengesahan UU No. 15 Tahun 2003 tentang Pemberantasan Tindak Pidana Terorisme Pasca Bom Bali
  summary_id: >-
    Merespons serangan terorisme Bom Bali I yang menewaskan 202 orang, DPR mengesahkan payung hukum pemberantasan tindak pidana terorisme
    yang memperkuat kewenangan penindakan aparat intelijen dan Detasemen Khusus 88 Polri dengan tetap mengedepankan due process of law.
  source_ids: [uu-15-2003]
  dimension_ids: [tujuan-1, negara-hukum]

- id: ev-putusan-icj-sipadan-ligitan-2002
  term_id: presiden-megawati
  date: "2002-12-17"
  category: peristiwa
  title_id: Putusan Mahkamah Internasional atas Sengketa Kedaulatan Pulau Sipadan dan Ligitan
  summary_id: >-
    Mahkamah Internasional (ICJ) di Den Haag memutuskan kedaulatan atas Pulau Sipadan dan Ligitan jatuh kepada Malaysia berdasarkan prinsip efektivitas administrasi kolonial (effective occupation),
    menjadi pelajaran historis penting bagi penguatan diplomasi batas maritim dan penjagaan pulau-pulau terluar NKRI.
  source_ids: [putusan-icj-sipadan-ligitan-2002]
  dimension_ids: [tujuan-1, tujuan-4]







