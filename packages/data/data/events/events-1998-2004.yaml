  term_id: mpr-1971-1999
  date: "1998-11-13"
  category: produk-hukum
  title_id: TAP MPR No. XVII/MPR/1998 tentang Hak Asasi Manusia (Piagam HAM Indonesia)
  summary_id: >-
    MPR menetapkan Piagam Hak Asasi Manusia Indonesia yang memuat 44 pasal perlindungan hak-hak sipil, politik, ekonomi, sosial, dan budaya,
    yang kemudian menjadi cikal bakal materi muatan Bab XA (Pasal 28A–28J) Perubahan Kedua UUD 1945.
  source_ids: [tap-mpr-xvii-1998]
  dimension_ids: [negara-hukum, sila-2]

- id: ev-uu-otonomi-daerah-1999
  term_id: presiden-habibie
  date: "1999-05-07"
  category: produk-hukum
  title_id: Pengesahan UU No. 22/1999 & UU No. 25/1999 tentang Desentralisasi dan Otonomi Daerah Luas
  summary_id: >-
    Pemerintahan BJ Habibie bersama DPR mengundangkan paket undang-undang otonomi daerah yang mengalihkan kewenangan pemerintahan secara radikal
    dari sentralisme Orde Baru ke tingkat Kabupaten/Kota, disertai formula Dana Alokasi Umum (DAU) dan Dana Alokasi Khusus (DAK).
  source_ids: [uu-22-1999, uu-25-1999]
  dimension_ids: [tujuan-2, sila-5]

