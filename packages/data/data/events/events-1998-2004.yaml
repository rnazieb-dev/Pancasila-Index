  summary_id: >-
    Sidang Istimewa MPR menetapkan haluan pokok reformasi di bidang hukum, ekonomi, dan politik,
    mengamanatkan pemberantasan korupsi, kolusi, dan nepotisme (KKN), pembatasan kekuasaan eksekutif, dan percepatan pemilu demokratis.
  source_ids: [tap-mpr-x-1998]
  dimension_ids: [kedaulatan-rakyat, checks-balances]

