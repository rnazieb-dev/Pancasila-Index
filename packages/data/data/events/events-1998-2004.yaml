# Peristiwa Konstitusional & Sejarah Tata Negara: Era Reformasi Awal & Transformasi UUD (1998–2004)

- id: ev-tap-mpr-xvii-1998-ham
  term_id: mpr-1971-1999
  date: "1998-11-13"
  category: produk-hukum
  title_id: TAP MPR No. XVII/MPR/1998 tentang Piagam Hak Asasi Manusia Indonesia
  summary_id: >-
    Sidang Istimewa MPR 1998 menetapkan Piagam HAM pertama di era Reformasi yang memuat 44 pasal perlindungan hak-hak sipil,
    politik, ekonomi, dan budaya, yang menjadi cikal bakal Bab XA Pasal 28A-28J Perubahan Kedua UUD 1945.
  source_ids: [tap-mpr-xvii-1998]
  dimension_ids: [sila-2, negara-hukum]

- id: ev-tap-mpr-xi-1998-anti-kkn
  term_id: mpr-1971-1999
  date: "1998-11-13"
  category: produk-hukum
  title_id: TAP MPR No. XI/MPR/1998 tentang Penyelenggara Negara Bersih dan Bebas KKN
  summary_id: >-
    MPR menetapkan landasan yuridis pemberantasan korupsi, kolusi, dan nepotisme, mewajibkan pemeriksaan kekayaan pejabat publik,
    dan mengamanatkan penuntasan dugaan korupsi mantan Presiden Soeharto dan kroni-kroninya.
  source_ids: [tap-mpr-xi-1998]
  dimension_ids: [checks-balances, negara-hukum]

- id: ev-tap-mpr-pemisahan-tni-polri-2000
  term_id: mpr-1999-2004
  date: "2000-08-18"
  category: produk-hukum
  title_id: TAP MPR No. VI/2000 & VII/2000 - Pemisahan Polri dan Penghapusan Dwifungsi ABRI
  summary_id: >-
    MPR secara formal memisahkan kelembagaan TNI (pertahanan negara) dan Polri (keamanan & ketertiban masyarakat)
    serta menghapus doktrin Dwifungsi ABRI dalam politik praktis guna menegaskan supremasi sipil dalam negara demokrasi.
  source_ids: [tap-mpr-vi-2000, tap-mpr-vii-2000]
  dimension_ids: [tujuan-1, negara-hukum]

- id: ev-mk-putusan-kelistrikan-2004
  term_id: mk-2003-2008
  date: "2004-12-15"
  category: pengadilan
  title_id: Putusan MK No. 001-021-022/PUU-I/2003 Membatalkan UU Ketenagalistrikan
  summary_id: >-
    Mahkamah Konstitusi membatalkan UU No. 20/2002 tentang Ketenagalistrikan karena skema unbundling dan kompetisi bebas
    bertentangan dengan Pasal 33 ayat 2 UUD 1945 (cabang produksi penting yang menguasai hajat hidup orang banyak harus dikuasai oleh negara).
  source_ids: [putusan-mk-001-021-022-puu-i-2003]
  dimension_ids: [sila-5, checks-balances]

- id: ev-mpr-gbhn-1999
  term_id: mpr-1999-2004
  date: "1999-10-19"
  category: produk-hukum
  title_id: TAP MPR No. IV/MPR/1999 tentang GBHN Terakhir Era Transisi
  summary_id: >-
    MPR menetapkan Garis-Garis Besar Haluan Negara (GBHN) 1999–2004 sebagai pedoman pembangunan nasional transisi
    menuju tatanan demokrasi, yang kelak menjadi GBHN terakhir sebelum sistem perencanaan nasional diubah menjadi UU SPPN dan RPJPN/RPJMN pasca-amandemen UUD.
  source_ids: [tap-mpr-iv-1999]
  dimension_ids: [tujuan-2, kedaulatan-rakyat]

- id: ev-dpr-uu-ppatk-2002
  term_id: dpr-1999-2004
  date: "2002-04-17"
  category: produk-hukum
  title_id: UU No. 15 Tahun 2002 tentang Tindak Pidana Pencucian Uang dan Pendirian PPATK
  summary_id: >-
    DPR bersama Pemerintah mengesahkan rezim anti-pencucian uang Indonesia dan mendirikan Pusat Pelaporan dan Analisis Transaksi Keuangan (PPATK)
    sebagai lembaga intelijen keuangan independen untuk melacak aliran dana hasil kejahatan korupsi, narkotika, dan terorisme.
  source_ids: [uu-15-2002]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-referendum-timtim-1999
  term_id: mpr-1971-1999
  date: "1999-10-19"
  category: produk-hukum
  title_id: TAP MPR No. V/MPR/1999 tentang Pengakuan Hasil Jajak Pendapat Timor Timur
  summary_id: >-
    Sidang Umum MPR secara resmi mengakui hasil jajak pendapat PBB di Timor Timur yang memilih merdeka,
    mencabut TAP MPR No. VI/1978 dan mengakhiri status integrasi wilayah tersebut sebagai bukti ketaatan pada hukum internasional dan hak menentukan nasib sendiri.
  source_ids: [tap-mpr-v-1999]
  dimension_ids: [tujuan-4, kedaulatan-rakyat]

- id: ev-otonomi-daerah-1999
  term_id: dpr-1999-2004
  date: "1999-05-07"
  category: produk-hukum
  title_id: Pengesahan UU No. 22 Tahun 1999 tentang Pemerintahan Daerah (Desentralisasi)
  summary_id: >-
    DPR bersama Presiden BJ Habibie mengesahkan undang-undang otonomi daerah yang mengalihkan sebagian besar wewenang pemerintahan
    dari pusat ke tingkat kabupaten/kota, membongkar sentralisme otoriter Orde Baru dan meletakkan fondasi demokrasi lokal.
  source_ids: [uu-22-1999]
  dimension_ids: [kedaulatan-rakyat, checks-balances]

- id: ev-uu-kpk-2002
  term_id: dpr-1999-2004
  date: "2002-12-27"
  category: produk-hukum
  title_id: Pengesahan UU No. 30 Tahun 2002 tentang Pembentukan Komisi Pemberantasan Korupsi (KPK)
  summary_id: >-
    DPR dan Pemerintah Megawati mendirikan Komisi Pemberantasan Tindak Pidana Korupsi (KPK) sebagai lembaga independen
    dengan wewenang penyelidikan, penyidikan, penuntutan, dan koordinasi supervisi untuk memberantas korupsi secara luar biasa.
  source_ids: [uu-30-2002]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-uu-mk-2003
  term_id: dpr-1999-2004
  date: "2003-08-13"
  category: produk-hukum
  title_id: Pengesahan UU No. 24 Tahun 2003 tentang Mahkamah Konstitusi
  summary_id: >-
    DPR mengesahkan payung hukum operasional Mahkamah Konstitusi RI sebagai pengawal konstitusi (the guardian of constitution)
    yang berwenang menguji undang-undang terhadap UUD 1945, memutus sengketa kewenangan lembaga negara, dan sengketa hasil pemilu.
  source_ids: [uu-24-2003]
  dimension_ids: [negara-hukum, checks-balances]

- id: ev-uu-ky-2004
  term_id: dpr-1999-2004
  date: "2004-08-13"
  category: produk-hukum
  title_id: Pengesahan UU No. 22 Tahun 2004 tentang Komisi Yudisial
  summary_id: >-
    DPR mengesahkan undang-undang pembentukan Komisi Yudisial RI untuk mengusulkan pengangkatan hakim agung kepada DPR
    dan menegakkan kode etik serta pedoman perilaku hakim guna menjaga integritas dan keluhuran martabat peradilan.
  source_ids: [uu-22-2004]
  dimension_ids: [checks-balances, negara-hukum]

- id: ev-dpr-uu-pers-1999
  term_id: dpr-1999-2004
  date: "1999-09-23"
  category: produk-hukum
  title_id: Pengesahan UU No. 40 Tahun 1999 tentang Pers (Kemerdekaan Pers)
  summary_id: >-
    DPR dan Presiden BJ Habibie mengesahkan undang-undang kemerdekaan pers yang menghapus kewajiban SIUPP (surat izin terbit)
    dan melarang sensor serta pembredelan oleh negara, menjamin hak warga negara untuk memperoleh dan menyebarkan informasi.
  source_ids: [uu-40-1999]
  dimension_ids: [kedaulatan-rakyat, sila-4]

- id: ev-uu-ham-1999
  term_id: dpr-1999-2004
  date: "1999-09-23"
  category: produk-hukum
  title_id: Pengesahan UU No. 39 Tahun 1999 tentang Hak Asasi Manusia
  summary_id: >-
    DPR bersama Pemerintah mengesahkan kodifikasi hukum HAM nasional yang menjabarkan hak hidup, hak berkeluarga,
    hak mengembangkan diri, hak memperoleh keadilan, kebebasan pribadi, rasa aman, dan kesejahteraan bagi seluruh insan di Indonesia.
  source_ids: [uu-39-1999]
  dimension_ids: [sila-2, negara-hukum]

- id: ev-uu-pengadilan-ham-2000
  term_id: dpr-1999-2004
  date: "1999-11-23"
  category: produk-hukum
  title_id: Pengesahan UU No. 26 Tahun 2000 tentang Pengadilan Hak Asasi Manusia
  summary_id: >-
    DPR mengesahkan payung hukum pembentukan pengadilan khusus HAM untuk mengadili kejahatan genosida dan kejahatan terhadap kemanusiaan (crimes against humanity),
    termasuk mekanisme pembentukan Pengadilan HAM Ad Hoc atas pelanggaran HAM berat masa lalu.
  source_ids: [uu-26-2000]
  dimension_ids: [sila-2, negara-hukum]

- id: ev-dekrit-gus-dur-impeachment-2001
  term_id: mpr-1999-2004
  date: "2001-07-23"
  category: krisis
  title_id: Dekrit Presiden Gus Dur dan Sidang Istimewa Pemakzulan oleh MPR RI
  summary_id: >-
    Presiden Abdurrahman Wahid mengeluarkan dekrit pembekuan DPR/MPR dan Partai Golkar, yang langsung ditolak oleh Mahkamah Agung dan TNI/Polri,
    mendorong MPR menggelar Sidang Istimewa yang memakzulkan Gus Dur dan mengangkat Megawati Soekarnoputri sebagai Presiden ke-5 RI.
  source_ids: [dekrit-gus-dur-2001, tap-mpr-ii-2001]
  dimension_ids: [checks-balances, negara-hukum]

- id: ev-uu-sisdiknas-2003
  term_id: dpr-1999-2004
  date: "2003-07-08"
  category: produk-hukum
  title_id: UU No. 20 Tahun 2003 tentang Sisdiknas (Kewajiban 20% Anggaran Pendidikan)
  summary_id: >-
    DPR mengesahkan UU Sisdiknas yang mengunci amanat konstitusi Pasal 31 ayat 4 UUD 1945 untuk mengalokasikan minimal 20% APBN dan APBD
    bagi sektor pendidikan nasional demi mencerdaskan kehidupan bangsa (Tujuan 3 UUD 1945).
  source_ids: [uu-20-2003]
  dimension_ids: [tujuan-3, sila-5]




