  category: pengadilan
  title_id: Penggeledahan Rumah Mantan Pejabat MA Zarof Ricar - Sitaan Rp920 Miliar Tunai dan 51 Kg Emas Kasus Suap Kasasi Ronald Tannur
  summary_id: >-
    Kejaksaan Agung membongkar skandal mafia peradilan terbesar pasca-Reformasi dengan menangkap mantan Kepala Balitbang Diklat Kumdil MA Zarof Ricar
