  dimension_ids:
    - "tujuan-4"
  provenance: "kurasi"
- id: "ev-jdih-uu-13-1964"
  term_id: "dpr-gr-1960-1971"
  date: "1964-09-23"
  category: "produk-hukum"
  title_id: "UU No. 13 Tahun 1964 tentang Penetapan Peraturan Pemerintah Pengganti Undang-Undang No. 2 Tahun 1964 Tentang Pembentukan Daerah Tingkat I Sulawesi Tengah Dan Daerah Tingkat I Sulawesi Tenggara Dengan Mengubah Undang-Undang No. 47 Prp Tahun 1960 tentang Pembentukan Daerah Tingkat I Sulawesi Utara -te"
  summary_id: "Penetapan Peraturan Pemerintah Pengganti Undang-Undang menjadi undang-undang - satu dari rangkaian panjang pengesahan serupa sepanjang 1964. Pola ini menunjukkan cara kerja DPR-GR: Presiden menerbitkan Perpu lebih dulu, lembaga perwakilan mengesahkannya belakangan. Fungsi legislasi bergeser dari membentuk norma menjadi meratifikasi norma yang sudah berlaku."
  source_ids:
    - "jdih-uu-13-1964"
  dimension_ids:
    - "sila-3"
  provenance: "kurasi"
- id: "ev-jdih-uu-1-1972"
  term_id: "dpr-1971-1999"
  date: "1972-03-06"
  category: "produk-hukum"
  title_id: "UU No. 1 Tahun 1972 tentang Anggaran Pendapatan dan Belanja Negara Tahun Anggaran 1972/1973"
  summary_id: "Undang-undang APBN tahunan yang disahkan DPR - satu dari rangkaian yang berulang tiap tahun anggaran sepanjang Orde Baru tanpa satu kali pun ditolak. Fungsi anggaran dijalankan secara prosedural lengkap, tetapi tanpa penolakan atau perubahan berarti, persetujuan parlemen atas belanja negara berhenti pada pengesahan dan tidak sampai pada pengendalian."
  source_ids:
    - "jdih-uu-1-1972"
  dimension_ids:
    - "tujuan-2"
  provenance: "kurasi"
- id: "ev-jdih-uu-3-1972"
  term_id: "dpr-1971-1999"
  date: "1972-07-28"
  category: "produk-hukum"
  title_id: "UU No. 3 Tahun 1972 tentang Ketentuan-Ketentuan Pokok Transmigrasi"
  summary_id: "Ketentuan pokok transmigrasi menjadikan pemindahan penduduk dari Jawa ke luar Jawa sebagai kebijakan negara berskala besar. Tujuannya pemerataan penduduk dan pembukaan lahan, dan sebagian transmigran memang memperoleh tanah yang tidak mungkin mereka miliki di Jawa. Namun undang-undang ini tidak mengatur perlindungan hak masyarakat adat di daerah tujuan, sehingga pemerataan bagi satu kelompok dijalankan di atas tanah yang bagi kelompok lain adalah wilayah adat - sumber konflik agraria yang belum selesai sampai hari ini."
  source_ids:
    - "jdih-uu-3-1972"
  dimension_ids:
    - "sila-5"
  provenance: "kurasi"
- id: "ev-jdih-uu-1-1974"
  term_id: "dpr-1971-1999"
  date: "1974-01-02"
  category: "produk-hukum"
  title_id: "UU No. 1 Tahun 1974 tentang Perkawinan"
  summary_id: "UU Perkawinan mengakhiri pluralisme hukum perkawinan warisan kolonial dan menegaskan bahwa sah tidaknya perkawinan ditentukan hukum agama masing-masing, dengan pencatatan negara sebagai syarat administratif. Rancangan awalnya memicu penolakan luas kalangan Islam sampai terjadi insiden di gedung DPR pada 1973, dan naskah akhirnya adalah hasil kompromi. Kewenangan peradilan agama diperkuat, tetapi ketentuan poligami dan batas usia kawin meninggalkan persoalan perlindungan perempuan yang baru diperbaiki lima dasawarsa kemudian."
  source_ids:
    - "jdih-uu-1-1974"
  dimension_ids:
    - "sila-1"
  provenance: "kurasi"
- id: "ev-jdih-uu-6-1976"
  term_id: "dpr-1971-1999"
  date: "1976-06-21"
  category: "produk-hukum"
  title_id: "UU No. 6 Tahun 1976 tentang Pengesahan Perjanjian Persahabatan dan Kerjasama di Asia Tenggara"
  summary_id: "Pengesahan perjanjian persahabatan bilateral pada 1976 - tahun yang sama ketika Timor Timur diintegrasikan lewat undang-undang setelah operasi militer yang tidak pernah memperoleh pengakuan PBB. Diplomasi persahabatan berjalan di satu meja sementara di meja lain Indonesia menghadapi resolusi Dewan Keamanan yang menyerukan penarikan pasukan; DPR mengesahkan keduanya tanpa perdebatan yang tercatat."
  source_ids:
    - "jdih-uu-6-1976"
  dimension_ids:
    - "tujuan-4"
  provenance: "kurasi"
- id: "ev-jdih-uu-5-1979"
  term_id: "dpr-1971-1999"
  date: "1979-12-01"
  category: "produk-hukum"
  title_id: "UU No. 5 Tahun 1979 tentang Pemerintahan Desa"
  summary_id: "UU Pemerintahan Desa menyeragamkan seluruh satuan pemerintahan terendah di Indonesia mengikuti satu model tunggal, menghapus nagari di Sumatera Barat, marga di Sumatera Selatan, dan puluhan bentuk pemerintahan adat lain yang berumur lebih tua dari republik. Keseragaman memudahkan pusat menyalurkan program dan mengawasi desa, tetapi memutus struktur adat yang menjadi penopang identitas kewilayahan - dan pemulihannya setelah 1999 tidak pernah sepenuhnya berhasil karena satu generasi kepemimpinan adat sudah terputus."
  source_ids:
    - "jdih-uu-5-1979"
  dimension_ids:
    - "sila-3"
  provenance: "kurasi"
- id: "ev-jdih-uu-28-1997"
  term_id: "dpr-1971-1999"
  date: "1997-10-07"
  category: "produk-hukum"
  title_id: "UU No. 28 Tahun 1997 tentang Kepolisian Negara Republik Indonesia"
  summary_id: "UU Kepolisian 1997 menegaskan Polri sebagai bagian dari ABRI, bukan lembaga sipil tersendiri. Artinya penegakan hukum terhadap warga berada dalam satu struktur komando dengan kekuatan pertahanan, tepat pada tahun terakhir sebelum krisis 1998. Pemisahan Polri dari TNI baru terjadi dua tahun kemudian lewat Ketetapan MPR - koreksi yang justru menegaskan bahwa kerangka 1997 memang tidak memisahkan fungsi perlindungan warga dari fungsi pertahanan negara."
  source_ids:
    - "jdih-uu-28-1997"
  dimension_ids:
    - "tujuan-1"
  provenance: "kurasi"
