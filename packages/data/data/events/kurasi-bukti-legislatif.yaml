  provenance: "kurasi"
- id: "ev-jdih-uu-2-1948"
  term_id: "dpr-knip-1945-1950"
  date: "1948-01-20"
  category: "produk-hukum"
  title_id: "UU No. 2 Tahun 1948 tentang Pengesahan Perjanjian Persahabatan antara Republik Indonesia dan Negara Kerajaan Mesir"
  summary_id: "Pengesahan perjanjian persahabatan dengan negara lain di masa republik masih diperebutkan pengakuannya. Tiap traktat yang diratifikasi KNIP berfungsi ganda: ia perjanjian bilateral sekaligus bukti bahwa Indonesia bertindak sebagai subjek hukum internasional yang cakap - argumen yang dipakai di meja diplomasi melawan klaim Belanda bahwa republik hanyalah pemberontakan dalam negeri."
  source_ids:
    - "jdih-uu-2-1948"
  dimension_ids:
