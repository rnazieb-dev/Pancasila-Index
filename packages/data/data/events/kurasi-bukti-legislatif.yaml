- id: "ev-jdih-uu-32-1947"
  term_id: "dpr-knip-1945-1950"
  date: "1947-09-22"
  category: "produk-hukum"
  title_id: "UU No. 32 Tahun 1947 tentang Memusatkan Segala Urusan Sekolah-Sekolah Lanjutan Negeri pada Kementerian Pengajaran Pendidikan dan Kebudayaan"
  summary_id: "Segala urusan sekolah dipusatkan pada Kementerian Pendidikan, mengakhiri warisan sistem pendidikan kolonial yang terbelah menurut golongan penduduk - Eropa, Timur Asing, dan bumiputra - dengan mutu dan akses yang berbeda-beda. Pemusatan ini yang memungkinkan satu kurikulum kebangsaan, meski pelaksanaannya baru berjalan setelah pengakuan kedaulatan."
  source_ids:
    - "jdih-uu-32-1947"
