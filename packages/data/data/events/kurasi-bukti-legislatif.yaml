  category: "produk-hukum"
  title_id: "UU No. 7 Tahun 1947 tentang Susunan dan Kekuasaan Mahkamah Agung dan Kejaksaan Agung"
  summary_id: "Susunan dan kekuasaan Mahkamah Agung ditetapkan pada Februari 1947, ketika ibu kota baru saja pindah ke Yogyakarta dan pengadilan republik nyaris tanpa gedung maupun arsip. KNIP tetap mendirikan puncak kekuasaan kehakiman yang terpisah dari eksekutif - keputusan yang menetapkan bahwa republik memilih bentuk negara hukum sejak sebelum ia aman secara militer."
  source_ids:
