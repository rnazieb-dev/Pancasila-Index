  provenance: "kurasi"
- id: "ev-jdih-uu-23-1948"
  term_id: "dpr-knip-1945-1950"
  date: "1948-07-23"
  category: "produk-hukum"
  title_id: "UU No. 23 Tahun 1948 tentang Pengawasan Perburuhan Tahun 1948"
  summary_id: "Di tengah perang kemerdekaan dan wilayah republik yang menyusut akibat blokade, KNIP mengesahkan pengawasan perburuhan: negara memberi diri kewajiban memeriksa keselamatan dan syarat kerja di perusahaan. Isinya sederhana dan jangkauannya terbatas pada wilayah yang masih dikuasai republik, tetapi arah normanya jelas - buruh diperlakukan sebagai pihak yang dilindungi hukum, bukan sekadar faktor produksi, pada saat republik sendiri belum pasti bertahan."
  source_ids:
    - "jdih-uu-23-1948"
  dimension_ids:
