  provenance: "kurasi"
- id: "ev-jdih-uu-17-1950"
  term_id: "dpr-1950-1960"
  date: "1950"
  category: "produk-hukum"
  title_id: "UU No. 17 Tahun 1950 tentang Pembentukan Daerah-Daerah Kota Kecil dalam Lingkungan Propinsi Jawa Timur, Jawa Tengah dan Jawa Barat"
  summary_id: "Pembentukan daerah-daerah kota besar sebagai satuan pemerintahan tersendiri, bagian dari penataan wilayah pasca-RIS. Parlemen memilih menata ulang lewat undang-undang alih-alih keputusan sepihak pusat - prosedur yang kemudian ditinggalkan sepenuhnya ketika pembentukan dan penghapusan daerah dilakukan lewat penetapan presiden pada era Demokrasi Terpimpin."
  source_ids:
    - "jdih-uu-17-1950"
  dimension_ids:
    - "sila-3"
  provenance: "kurasi"
- id: "ev-jdih-uu-1-1950"
  term_id: "dpr-1950-1960"
  date: "1950-05-06"
  category: "produk-hukum"
  title_id: "UU No. 1 Tahun 1950 tentang Susunan, Kekuasaan, dan Jalan-Pengadilan Mahkamah Agung Indonesia"
  summary_id: "Susunan, kekuasaan, dan jalan pengadilan Mahkamah Agung disusun ulang bagi negara kesatuan yang baru dipulihkan dari bentuk federal RIS. Parlemen menetapkan sendiri batas kewenangan puncak yudikatif, termasuk kasasi atas seluruh lingkungan peradilan - fondasi yang bertahan sampai reformasi dan menjadi rujukan ketika kekuasaan kehakiman kemudian digerogoti pada 1964."
  source_ids:
    - "jdih-uu-1-1950"
  dimension_ids:
    - "checks-balances"
  provenance: "kurasi"
- id: "ev-jdih-uu-3-1951"
  term_id: "dpr-1950-1960"
  date: "1951-01-06"
  category: "produk-hukum"
  title_id: "UU No. 3 Tahun 1951 tentang Pernyataan Berlakunya Undang-Undang Pengawasan Perburuhan Tahun 1948 Nr. 23 dari Republik Indonesia untuk Seluruh Indonesia"
  summary_id: "Pengawasan perburuhan yang lahir di masa revolusi dinyatakan berlaku untuk seluruh wilayah Indonesia setelah pengakuan kedaulatan, termasuk bekas daerah negara-negara bagian RIS. Satu norma perlindungan buruh menggantikan aturan yang sebelumnya berbeda-beda antarwilayah - langkah unifikasi hukum sosial yang jarang dicatat karena tidak dramatis."
  source_ids:
