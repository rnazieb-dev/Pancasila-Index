  provenance: "kurasi"
- id: "ev-jdih-uu-14-1963"
  term_id: "dpr-gr-1960-1971"
  date: "1963-11-28"
  category: "produk-hukum"
  title_id: "UU No. 14 Tahun 1963 tentang Pengesahan \"Perjanjian Karya\" Antara P.N. Pertamina dengan p.t. Caltex Indonesia dan California Asiatic Oil Company (Calasiatic) Texaco Overseas Petroleum Company (Topco) ; P.N. Pertamina dengan P.T. Stanvac Indonesia, P.N. Permigan dengan P.T. Shell indonesia"
  summary_id: "Pengesahan \"Perjanjian Karya\" dengan perusahaan asing di sektor sumber daya alam, disahkan DPR-GR yang seluruh anggotanya diangkat. Perjanjian ekonomi internasional berdampak jangka panjang diratifikasi tanpa lembaga perwakilan hasil pemilu - politik luar negeri dijalankan tanpa penyeimbang domestik yang sah."
  source_ids:
