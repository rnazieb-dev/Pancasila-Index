- id: "ev-jdih-uu-22-1961"
  term_id: "dpr-gr-1960-1971"
  date: "1961-12-04"
  category: "produk-hukum"
  title_id: "UU No. 22 Tahun 1961 tentang Perguruan Tinggi"
  summary_id: "UU Perguruan Tinggi menetapkan kerangka universitas nasional: otonomi keilmuan, tridarma, dan pembinaan negara atas perguruan tinggi. Ia lahir dari DPR-GR yang anggotanya diangkat Presiden, dan pada periode yang sama kampus menjadi arena mobilisasi politik - otonomi yang dijanjikan pasal-pasalnya berjalan bersamaan dengan tekanan agar perguruan tinggi menyelaraskan diri dengan garis politik negara."
  source_ids:
    - "jdih-uu-22-1961"
  dimension_ids:
