  category: produk-hukum
  title_id: TAP MPR No. II/MPR/1978 tentang Pedoman Penghayatan dan Pengamalan Pancasila (P4)
  summary_id: >-
    MPR menetapkan 36 butir P4 (Ekaprasetia Pancakarsa) sebagai penataran wajib bagi seluruh PNS, ABRI, mahasiswa,
    dan masyarakat sipil, yang kelak dikritik sebagai hegemoni tafsir tunggal ideologi negara oleh kekuasaan eksekutif.
  source_ids: [tap-mpr-ii-1978]
  dimension_ids: [checks-balances, sila-4]

- id: ev-uu-asas-tunggal-1985
