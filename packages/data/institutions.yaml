
- id: mahkamah-agung
  slug: mahkamah-agung
  branch: yudikatif
  name_id: Mahkamah Agung Republik Indonesia
  short_id: MA RI
  description_id: >
    Puncak empat lingkungan peradilan (umum, agama, militer, TUN) dengan
    kewenangan kasasi dan peninjauan kembali serta uji peraturan di bawah UU.
    Berdiri sejak 1946 lewat UU No. 1 Tahun 1946. Dinilai per periode politik
    nasional dari independensi, integritas, dan mutu yurisprudensinya.
